meta:
  schema: rll.validacao_real.sources.v1
  version: 1
  updated_utc: "2026-06-01"
  principle: "Minimo que ja valida. Marca-se a regiao onde a regua cai; nao se calcula a imensidao."
  claim_policy: "Nenhuma fonte declara descoberta. Cada fonte e ancora real para a prova RLL vs LCDM."

sources:
  - id: desi_dr2_bao
    domain: cosmology_bao
    method: baryon_acoustic_oscillation
    embedded_fallback: data/desi_dr2_bao.yml
    remote:
      portal: "https://github.com/CobayaSampler/bao_data/tree/master/desi_bao_dr2"
      zenodo: "https://zenodo.org/records/16644577"
      note: "DESI DR2 Results II public BAO likelihood mean/covariance files materializados em data/real/cosmology/desi_bao_dr2_cobaya; se ausentes, usa fallback embutido."
    falsifier: "Se RLL nao reproduzir DM/rd, DH/rd, DV/rd dentro das barras DESI, o setor de superposicao e rejeitado nesse regime."

  - id: hz_cosmic_chronometers
    domain: cosmology_expansion
    method: cosmic_chronometers
    embedded_fallback: data/hz_cosmic_chronometers.yml
    remote:
      portal: "https://gitlab.com/mmoresco/CCcovariance"
      note: "Compilacao de cronometros cosmicos (Moresco et al.), independente de modelo."
    falsifier: "Se RLL desviar sistematicamente de H(z) observado alem das barras, a transicao logistica e rejeitada."

regiao_de_validade:
  z_min: 0.0
  z_max: 2.4
  note: "Regiao onde os dados reais existem. Fora disso e extrapolacao, nao prova."
