schema: rll.ai_shared_knowledge_middleware_house.v1
status: GOVERNED_DRAFT
claim_allowed: false
publication_effect: NONE
updated_at: "2026-09-20"

authority:
  human_intent: root
  drive_role: documentary_memory_source_index_receipt_reconstruction
  github_role: code_schema_test_ci_producer_authority
  runtime_rule: "narrative != execution_evidence"
  separation: "SOURCE != ARTIFACT != EXECUTION != EVIDENCE != CLAIM"
  token_vazio: valid_unknown_state

drive:
  house_url: "https://drive.google.com/drive/folders/1Iza50dV_x13I7amR9gi-y-4qGhoFLxYF"
  router_document: "https://docs.google.com/document/d/1--DKx1FVwkDITpG0tAUS-foOy-oHkx4aqaCo_fOmWgg/edit"
  agents_document: "https://docs.google.com/document/d/1ahJW3e7bCdrlqsl4vVk4IL5HvuRaNUEJPOFGNp72dh0/edit"
  parent_architecture: "https://docs.google.com/document/d/1cVvVhOUedHtCc2C72rLRLPCjcEH2gTmfw1FkMrrVRlw/edit"
  tree:
    "00": START_HERE_AND_TREE
    "01": AGENTS_AND_AI_CONTRACTS
    "02": INBOX_UPLOADS_AND_HANDOFFS
    "03": SOURCES_ARTICLES_AND_PAPERS
    "04": WORKSPACES_CHATGPT_CLAUDE_RAFAELIA_RLL
    "05": UNCERTAINTY_COHERENCE_CONTRADICTIONS
    "06": ARTIFACTS_RECEIPTS_AND_EVIDENCE
    "07": SIX_SIGMA_CONTINUOUS_EVOLUTION
    "08": LINKS_GITHUB_DRIVE_AND_ROUTING

clients:
  names: [ChatGPT, Claude, RAFAELIA, RLL]
  rule: client_name_does_not_grant_authority
  unknown_client_metadata: TOKEN_VAZIO
  independent_agreement_rule: agreement_without_independent_evidence_is_not_replication

lifecycle:
  - INTENT
  - SOURCE_AUTHORITY
  - INBOX_HANDOFF
  - CLASSIFY
  - WORKSPACE
  - RELATE_CONTRAST
  - UNCERTAINTY
  - AUTHORIZED_EXECUTION
  - ARTIFACT
  - EVIDENCE_RECEIPT
  - SIX_SIGMA_CONTROL
  - INDEX_ROUTE
  - R3

handoff_required:
  - handoff_id
  - timestamp
  - client_name
  - session_or_ref
  - human_intent
  - source_refs
  - authority
  - workspace
  - inputs
  - expected_outputs
  - claim_allowed
  - evidence_required
  - uncertainties
  - contradictions
  - artifact_refs
  - execution_refs
  - receipt_refs
  - F_ok
  - F_gap
  - F_next
  - parent_or_supersedes
  - hash_or_ref

relations:
  allowed:
    - AGREES_WITHIN_SCOPE
    - TENSION
    - CONTRADICTED_BY_EVIDENCE
    - ORTHOGONAL
    - INSUFFICIENT_COMPARABILITY
    - DERIVES_FROM
    - REPRODUCES
    - SUPERSEDES
    - TOKEN_VAZIO_RELATION

uncertainty_maturity:
  order:
    - UNSCOPED
    - CLUSTERED
    - TYPED
    - SOURCE_BOUND
    - METHOD_BOUND
    - EVIDENCE_BOUND
    - CLAIM_BOUND
  force_zero: false

six_sigma_dmaic:
  define: [intent, CTQ, scope, authority, risk]
  measure: [sources, baseline, coverage, gaps, contradictions]
  analyze: [causes, dependencies, entropy, incoherence, uncertainty]
  improve: smallest_reversible_high_value_delta
  control: [tests, receipt, hash_ref, index, rollback_supersession]
  statistical_sigma_claim_requires_metrics: true

upload_lifecycle:
  - UPLOAD
  - INBOX
  - IDENTIFY
  - CLASSIFY
  - DEDUP_REFERENCE
  - ROUTE
  - TRANSFORM
  - VERIFY
  - EVIDENCE_RECEIPT
  - ARCHIVE_SUPERSEDE

mutation:
  preconditions: [authority, source, destination, scope, rollback_or_supersession]
  postconditions: [observable_receipt, index_pointer]
  history: append_only

r3:
  required_on_meaningful_cycle: true
  fields: [F_ok, F_gap, F_next]
