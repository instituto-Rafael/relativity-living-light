      equation_or_algorithm_to_code: {state: EVIDENCED, evidence: [data/pipelines/structure_d/model_family_shadow.py]}
      observable_to_measurement: {state: PARTIAL, evidence: [DESI_DR2_BAO, H_z], missing: perturbation_and_additional_likelihood_backends}
      parameter_to_configuration: {state: EVIDENCED, evidence: [frozen_bounds, predeclared_seeds]}
      prediction_to_receipt: {state: TOKEN_VAZIO, reason: robust multi-seed receipt absent, next_action: execute all preregistered seeds, exit_criterion: receipt contains per-seed objectives residuals convergence and stability}
