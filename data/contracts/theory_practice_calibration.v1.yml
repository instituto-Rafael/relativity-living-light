    fragment_id: FRAG-RLL-BACKGROUND-001
    exploration_tier: P5_NEAR_OPERATIONAL
    promotion_state: TESTED_SYNTHETIC
    calibration_state: C2_EXECUTABLE_SHADOW
    relation_state: APPROX_WORKING
    scope_marker: background_expansion_Hz_DESI_DR2_BAO_shadow
    theory_anchors:
