schema: rll.theory_practice_calibration.v1
status: EXPERIMENTAL_SHADOW
claim_allowed: false
publication_effect: NONE
documentation: docs/science/RLL_THEORY_PRACTICE_CALIBRATION_OMEGA_PI_INFINITY_20260729.md
purpose: >-
  Maintain an auditable working relation between theoretical artifacts and
  practical artifacts without converting proximity, fit, elegance, or
  implementation readiness into probability of truth.

symbolic_language:
  working_relation: "theory ~= practice"
  approximation_operator: "[~=]"
  residual_operator: "Delta(theory, practice)"
  signed_direction: "+/- records the direction of a measured residual only"
  scope_marker: "section_sign"
  verification_marker: "check_mark"
  provenance_marker: "paragraph_mark"
  omega: "iterative return through calibration cycles"
  pi: "composition of independently declared dimensions, never an opaque average"
  infinity: "open-ended evolution potential, never infinite execution or universal truth"
  boundary: >-
    The symbols are methodological notation. They do not define a new physical
    constant, field, particle, cosmological law, or authorization of claim.

knowledge_invariant:
  id: OMEGA_PI_INFINITY_DATA_INVARIANT
  statement: >-
    Every datum used by a calibration remains addressable through source,
    transformation, scope, residual, decision, and receipt. New evidence may
    refine or refute a relation, but no state transition may silently erase a
    contradiction, negative result, missing datum, or prior receipt.
  append_only_transitions: true
  token_vazio_is_data: true
  silent_deletion_forbidden: true

calibration_loop:
  - theory_anchor
  - operational_mapping
  - executable_shadow
  - practical_observation
  - signed_residual
  - falsifier_decision
  - receipt
  - next_bridge
  - repeat

relation_states:
  - id: APPROX_WORKING
    meaning: theory and practice are linked, but one or more mandatory residuals remain unresolved
  - id: APPROX_BOUNDED
    meaning: a preregistered comparison produced a receipt inside its declared tolerance and scope
  - id: NOT_EQUAL_OBSERVED
    meaning: an observed residual crossed a preregistered falsifier or tolerance boundary
  - id: TOKEN_VAZIO_UNDEFINED
    meaning: the comparison is not yet defined because a mandatory anchor, observable, or receipt is absent

calibration_states:
  - {id: C5_INDEPENDENTLY_REPRODUCED, rank: 5}
  - {id: C4_ROBUST_REPEATED, rank: 4}
  - {id: C3_RECEIPTED_COMPARISON, rank: 3}
  - {id: C2_EXECUTABLE_SHADOW, rank: 2}
  - {id: C1_LINKED, rank: 1}
  - {id: C0_TOKEN_VAZIO_UNCALIBRATED, rank: 0}

mandatory_delta_axes:
  - theory_scope_to_specific_model
  - equation_or_algorithm_to_code
  - observable_to_measurement
  - parameter_to_configuration
  - prediction_to_receipt
  - falsifier_to_decision

delta_states:
  - EVIDENCED
  - PARTIAL
  - TOKEN_VAZIO

rules:
  - calibration_state is independent from scientific promotion state and exploration tier
  - APPROX_BOUNDED requires a preregistered tolerance, scope marker, receipt, and falsifier decision
  - a signed residual is not a moral score, truth score, or probability
  - no weighted average may hide a TOKEN_VAZIO mandatory delta axis
  - PARTIAL must name both what exists and what remains missing
  - TOKEN_VAZIO must name reason, next action, and exit criterion
  - NOT_EQUAL_OBSERVED must be preserved as knowledge and must not be renamed as success
  - every profile must retain source, scope, verification, and provenance markers

profiles:
