schema: rll.rafaelian_permutation_pipeline/v1
created_at: 2026-08-29
claim_allowed: false
pipeline:
  - stage: RAW
    object: "(p_raw,q_raw)"
    invariant: preserve_source_representation
  - stage: VALUE
    object: "(p,q)=reduce(p_raw,q_raw)"
    invariant: standard_rational_equality
  - stage: BASE
    object: "b"
    invariant: base_is_explicit
  - stage: ORBIT
    object: "r_(k+1)=b*r_k mod q"
    invariant: integer_remainder_state_first
  - stage: ANGLE
    object: "theta_k=2*pi*r_k/q"
    invariant: exact_symbolic_angle
  - stage: GEOMETRY
    object: "z_k=exp(i*theta_k)"
    invariant: geometry_does_not_change_exact_value
  - stage: TRIG
    object: "(cos(theta_k),sin(theta_k),tan(theta_k))"
    invariant: symbolic_when_exact
  - stage: CURVATURE
    object: "kappa"
    invariant: metric_and_curve_definition_required
  - stage: CUSTODY
    object: "hash(raw,value,base,orbit,geometry_context)"
    invariant: append_only_receipt
permutation_boundary:
  allowed: "reorder analytical views after preserving source chronology and evidence"
  forbidden: "permute source chronology or evidence provenance"
