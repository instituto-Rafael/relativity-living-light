name: RLL METAR Earth Field

on:
  pull_request:
    paths:
      - ".github/workflows/rll-metar-earth-field.yml"
      - "scripts/rll_metar_earth_field.py"
      - "tests/test_rll_metar_earth_field.py"
      - "tests/fixtures/rll_metar_synthetic.json"
      - "data/contracts/rll_metar_earth_field.v1.json"
      - "docs/science/RLL_METAR_EARTH_FIELD_V1.md"
      - ".github/workflow-orchestrator/workflows/tower/00-transit-tower.yml"
  workflow_dispatch:
    inputs:
      station_ids:
        description: Comma-separated ICAO METAR stations
        required: true
        default: "SBGR,SBSP,SBKP,SBSJ"
        type: string
      hours:
        description: Bounded lookback in hours
        required: true
        default: "2"
        type: string
      nx:
        description: Grid columns
        required: true
        default: "24"
        type: string
      ny:
        description: Grid rows
        required: true
        default: "18"
        type: string

permissions:
  contents: read

jobs:
  static-field:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate field mathematics and artifact contract
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_rll_metar_earth_field
          python scripts/rll_metar_earth_field.py             --stations TST1,TST2,TST3,TST4             --fixture tests/fixtures/rll_metar_synthetic.json             --nx 16 --ny 12             --output-dir artifacts/science/earth_metar_field_static
      - name: Upload deterministic field artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rll-metar-earth-field-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/science/earth_metar_field_static/
          if-no-files-found: error
          retention-days: 30

  observed-smoke:
    if: github.event_name == 'pull_request'
    needs: static-field
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Fetch one bounded public METAR observation set
        run: |
          set -euo pipefail
          python scripts/rll_metar_earth_field.py \
            --stations "SBGR,SBSP,SBKP,SBSJ" \
            --hours "2" \
            --nx "24" \
            --ny "18" \
            --output-dir artifacts/science/earth_metar_field_observed_smoke
      - name: Upload observed smoke artifact when available
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rll-metar-earth-field-observed-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/science/earth_metar_field_observed_smoke/
          if-no-files-found: warn
          retention-days: 14

  live-field:
    if: github.event_name == 'workflow_dispatch'
    needs: static-field
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Fetch bounded NOAA/NWS AWC METAR observations and build field
        run: |
          set -euo pipefail
          python scripts/rll_metar_earth_field.py             --stations "${{ inputs.station_ids }}"             --hours "${{ inputs.hours }}"             --nx "${{ inputs.nx }}"             --ny "${{ inputs.ny }}"             --output-dir artifacts/science/earth_metar_field_live
      - name: Upload observed METAR field
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rll-metar-earth-field-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/science/earth_metar_field_live/
          if-no-files-found: error
          retention-days: 30
