# KNOWS_BY_ON_FIRST_LINE: one governed transit, sequential barriers, no claim promotion.
name: RLL Transit Tower — Unified Workflow Orchestrator
run-name: Transit Tower Ω · ${{ github.event_name }} · ${{ github.ref_name }}

"on":
  pull_request:
    branches:
      - main
      - rll/release
      - rll/integration
      - rll/lab
  workflow_dispatch:
    inputs:
      profile:
        description: "Governed specialty profile; auto derives from the selected branch"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - transit_refactor
          - full_session
          - quick_session
          - real_data_session
          - science_shadow_session
      dry_run:
        description: "Validate and receipt the complete plan without dispatching children"
        required: true
        default: true
        type: boolean
      overrides:
        description: "JSON overrides; each specialty is default-deny and explicitly allowlisted"
        required: false
        default: "{}"
        type: string

permissions:
  contents: read

concurrency:
  group: rll-transit-tower-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CLAIM_ALLOWED: "false"
  SCIENTIFIC_GATE: BLOCKED
  PUBLICATION_READY: "false"
  PUBLICATION_EFFECT: NONE

jobs:
  branch-maturity-gate:
    if: github.event_name == 'pull_request'
    name: Evolutionary semantic branch maturity gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RECEIPT_DIR: artifacts/branch-maturity
    steps:
      - name: Checkout full promotion graph without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up deterministic Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bounded validation dependencies
        run: python -m pip install pyyaml pytest jsonschema

      - name: Test branch maturity gate
        id: gate-tests
        continue-on-error: true
        run: python -m pytest -q tests/test_branch_maturity_gate.py

      - name: Validate workflow documentation contract
        id: docs-contract
        continue-on-error: true
        run: python tools/validate_workflow_docs.py --strict --write-report

      - name: Validate workflow architecture invariants
        id: architecture
        continue-on-error: true
        run: |
          mkdir -p "$RECEIPT_DIR/architecture"
          python tools/workflow_architecture.py \
            --contract .github/workflow-architecture/invariants.v1.yml \
            --output-dir "$RECEIPT_DIR/architecture" --strict

      - name: Run maturity-proportional repository checks
        id: stage-tests
        continue-on-error: true
        run: |
          tests=(tests/test_branch_maturity_gate.py)
          test -f tests/test_workflow_orchestrator.py && tests+=(tests/test_workflow_orchestrator.py)
          test -f tests/test_validate_workflow_docs.py && tests+=(tests/test_validate_workflow_docs.py)
          test -f tests/test_workflow_architecture.py && tests+=(tests/test_workflow_architecture.py)
          python -m pytest -q "${tests[@]}"
          if [[ "$BASE_REF" == "rll/release" || "$BASE_REF" == "main" ]]; then
            python tools/rll_pipeline_fase24_1_runtime.py --mode dry_run
          fi

      - name: Decide promotion and materialize fail-closed receipt
        if: always()
        env:
          GATE_TESTS_OUTCOME: ${{ steps.gate-tests.outcome }}
          STAGE_TESTS_OUTCOME: ${{ steps.stage-tests.outcome }}
          ARCHITECTURE_OUTCOME: ${{ steps.architecture.outcome }}
          DOCS_OUTCOME: ${{ steps.docs-contract.outcome }}
        run: |
          mkdir -p "$RECEIPT_DIR"
          tests_status=success
          [[ "$GATE_TESTS_OUTCOME" == success && "$STAGE_TESTS_OUTCOME" == success ]] || tests_status=failure
          python tools/branch_maturity_gate.py \
            --head-ref "$HEAD_REF" --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --tests-status "$tests_status" \
            --architecture-status "$ARCHITECTURE_OUTCOME" \
            --docs-status "$DOCS_OUTCOME" \
            --workflow "$GITHUB_WORKFLOW" --job "$GITHUB_JOB" \
            --output-dir "$RECEIPT_DIR"

      - name: Publish maturity summary
        if: always()
        run: |
          report="$RECEIPT_DIR/BRANCH_MATURITY_REPORT.md"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'TOKEN_VAZIO_BRANCH_MATURITY_REPORT' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload branch maturity receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: branch-maturity-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/branch-maturity/
            artifacts/workflow-docs/
          retention-days: 30
          if-no-files-found: error

  transit-preflight:
    if: github.event_name == 'pull_request'
    name: Inventory and validate the complete transit plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HEAD_REF: ${{ github.head_ref }}
      ORCHESTRATION_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact pull request head without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up deterministic Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflow-orchestrator/requirements.txt

      - name: Install bounded orchestration dependency
        run: python -m pip install -r .github/workflow-orchestrator/requirements.txt

      - name: Validate engine and materialize exhaustive dry-run receipt
        run: |
          set -euo pipefail
          python -m unittest -v tests/test_workflow_orchestrator.py
          python tools/workflow_orchestrator.py \
            --catalog .github/workflow-orchestrator/session.yml \
            --profile transit_refactor --ref "$HEAD_REF" \
            --wait --fail-fast --dry-run \
            --output-dir artifacts/unified-workflow-session

      - name: Publish preflight summary
        if: always()
        run: |
          report=artifacts/unified-workflow-session/ORCHESTRATION_REPORT.md
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'TOKEN_VAZIO_TRANSIT_PREFLIGHT_REPORT' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload preflight receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rll-transit-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/unified-workflow-session/
          retention-days: 30
          if-no-files-found: error

  orchestrate-workflow-session:
    if: github.event_name == 'workflow_dispatch'
    name: Execute specialty transit with fail-fast barriers
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    env:
      PROFILE_INPUT: ${{ inputs.profile }}
      REF_INPUT: ${{ github.ref_name }}
      DRY_RUN_INPUT: ${{ inputs.dry_run }}
      OVERRIDES_INPUT: ${{ inputs.overrides }}
    steps:
      - name: Checkout exact transit ref without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up deterministic Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflow-orchestrator/requirements.txt

      - name: Install bounded orchestration dependency
        run: python -m pip install -r .github/workflow-orchestrator/requirements.txt

      - name: Run adversarial engine tests before dispatch authority
        run: python -m unittest -v tests/test_workflow_orchestrator.py

      - name: Resolve profile and execute the single-flight transit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          profile="$PROFILE_INPUT"
          if [[ "$profile" == auto ]]; then
            case "$REF_INPUT" in
              rll/lab) profile=quick_session ;;
              rll/integration) profile=real_data_session ;;
              rll/release|main) profile=transit_refactor ;;
              *) profile=quick_session ;;
            esac
          fi
          args=(--catalog .github/workflow-orchestrator/session.yml)
          args+=(--profile "$profile" --ref "$REF_INPUT" --overrides "$OVERRIDES_INPUT")
          args+=(--output-dir artifacts/unified-workflow-session --wait --fail-fast)
          [[ "$DRY_RUN_INPUT" == true ]] && args+=(--dry-run)
          python tools/workflow_orchestrator.py "${args[@]}"

      - name: Finalize canonical real-data policy checksums
        if: always()
        env:
          CANONICAL_REAL_DATA_WORKFLOW: .github/workflows/real-data-complete-execution.yml
          CLAIM_BOUNDARY: "Structural orchestration only; claim_allowed=false; publication_effect=NONE."
        run: |
          set -euo pipefail
          artifact_dir="artifacts/workflow-policy/unified-workflow-session-orchestrator/${GITHUB_JOB}"
          mkdir -p "$artifact_dir"
          . tools/ci/real_data_workflow_policy.sh
          rll_real_data_write_claim_boundary "$artifact_dir"
          rll_real_data_assert_boundary_file "$artifact_dir/CLAIM_BOUNDARY.md"
          rll_real_data_write_checksums "$artifact_dir"

      - name: Publish orchestration summary
        if: always()
        run: |
          report=artifacts/unified-workflow-session/ORCHESTRATION_REPORT.md
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'TOKEN_VAZIO_ORCHESTRATION_REPORT' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload transit receipts even after a red stage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rll-transit-tower-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/unified-workflow-session/
            artifacts/workflow-policy/unified-workflow-session-orchestrator/
          retention-days: 30
          if-no-files-found: error
