version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: rll/lab
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    # Labels requested in previous config are not installed in this repository;
    # dependabot[bot] reported missing `dependencies` and `github-actions` labels.
    # Do not ask the bot for nonexistent labels; restore when provider labels exist.
    # Atomic version update group: CodeQL init + analyze must share an exact version.
    groups:
      codeql-action-atomic:
        applies-to: version-updates
        patterns:
          - "github/codeql-action*"
