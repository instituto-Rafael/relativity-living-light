version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: rll/lab
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    labels:
      - dependencies
      - github-actions
    # CodeQL init/analyze share persisted state: never version-skew a workflow.
    # Restrict grouping to routine version updates; security triage is independent.
    groups:
      codeql-atomic:
        applies-to: version-updates
        patterns:
          - "github/codeql-action*"
        update-types: ["minor", "patch"]
