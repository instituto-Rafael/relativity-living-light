version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: rll/lab
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    # Dependabot #1175 reports both requested labels are missing on the provider.
    # Avoid invalid label references until provider labels are created and verified.
