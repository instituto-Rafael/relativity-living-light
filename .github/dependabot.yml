version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: rll/lab
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    # CodeQL init/analyze must share the same pinned release in a workflow.
    # Version-update grouping does not bypass security/review gates.
    groups:
      codeql-lockstep:
        applies-to: "version-updates"
        patterns:
          - "github/codeql-action/*"
    labels:
      - dependencies
      - github-actions
    # CodeQL init/analyze must advance together. Independent bumps fail runtime
    # with a configuration/action version mismatch (PRs #1175 and #1176).
    # Keep major upgrades in separate proposals for explicit review.
    groups:
      codeql-actions:
        applies-to: version-updates
        patterns:
          - "github/codeql-action*"
        update-types:
          - minor
          - patch
