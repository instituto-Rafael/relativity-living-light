schema: rll.workflow_orchestrator.catalog.v3
status: ACTIVE_GOVERNED_TRANSIT
claim_allowed: false
publication_effect: NONE

profiles:
  transit_refactor:
    description: "Six bounded operational gates; science shadow runs remain isolated."
    include_tags: [tower]
  full_session:
    description: "All bounded operational and real-data workflows; excludes science shadow runs."
    include_tags: [tower, real_data]
  quick_session:
    description: "Structural, contract, regression, and governance gates."
    include_tags: [core]
  real_data_session:
    description: "Controlled real-data custody, Climate Engine discovery, and audit workflows."
    include_tags: [real_data]
  science_shadow_session:
    description: "Non-publishing deterministic and frontier shadow gates."
    include_tags: [science_shadow]
  literature_session:
    description: "Validate an academic relation package and build a Jekyll preview artifact."
    include_tags: [literature]
  pages_preview_session:
    description: "Build the research-fragment Jekyll preview artifact without deploying Pages."
    include_tags: [pages_preview]

execution:
  mode: sequential
  stage_barrier: true
  max_in_flight: 1
  wait_for_completion: true
  fail_fast: true

# Inventory is exhaustive but execution is explicit. Event-driven and standalone
# workflows remain visible in the receipt without being dispatched implicitly.
workflow_inventory:
  patterns:
    - ../workflows/*.y*ml

workflow_catalog_dirs:
  - workflows/tower
  - workflows/research
