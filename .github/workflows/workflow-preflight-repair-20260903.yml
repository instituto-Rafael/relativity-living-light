name: Workflow Preflight Repair 20260903

on:
  pull_request:
    types: [reopened]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: workflow-preflight-repair-20260903-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  repair-audit-branch:
    if: github.head_ref == 'audit/rll-workflow-preflight-repair-20260903'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Normalize repair-tool EOF handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/repair_workflow_preflight_20260903.py')
          text = path.read_text(encoding='utf-8')
          old = '        new = "".join(line for line in lines if not line.startswith("x-canonical-real-data-policy:"))\n'
          new = old + '        new = new.rstrip("\\n") + "\\n"\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one repair_x_canonical normalization anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Apply deterministic branch-only repair
        run: python tools/repair_workflow_preflight_20260903.py

      - name: Verify patch hygiene
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain)"
          python -m pytest -q tests/test_workflow_preflight_static.py

      - name: Commit repair to this audit branch only
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "audit/rll-workflow-preflight-repair-20260903"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/repair_workflow_preflight_20260903.py .github/workflows tests/test_workflow_preflight_static.py data/governance/rll_workflow_preflight_repair_20260903.v1.json
          git diff --cached --check
          git commit -m "ci: repair RLL workflow preflight validation"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
