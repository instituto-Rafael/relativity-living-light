name: ACT DR6 CMB-only Materialization

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/act-dr6-cmbonly-materialization.yml"
      - ".github/workflow-contract.yml"
      - "artifacts/science/act/**"
      - "data/governance/RLL_*TOKEN_VAZIO*"
      - "data/governance/RLL_GAP_CLOSURE_INPUT_20260807_V1.json"

permissions:
  contents: read

env:
  ACT_UPSTREAM_REPOSITORY: ACTCollaboration/DR6-ACT-lite
  ACT_UPSTREAM_URL: https://github.com/ACTCollaboration/DR6-ACT-lite.git
  ACT_UPSTREAM_SHA: 627aeafb88ae5ad1aa66b406bea2d65cfa66a27d
  CAMB_UPSTREAM_URL: https://github.com/cmbant/CAMB.git
  CAMB_HISTORY_CUTOFF: "2024-11-14T00:00:00Z"
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/.act-cobaya-packages
  CLAIM_BOUNDARY: "This gate reproduces pinned upstream ACT DR6 CMB-only installation/tests/reference likelihood predicates only. It does not validate RLL CMB predictions, a posterior chain, or any RLL perturbation claim."

concurrency:
  group: act-dr6-cmbonly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout RLL without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audited scientific runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "numpy==2.2.4" \
            "scipy==1.15.2" \
            "camb==1.5.9" \
            "sacc==0.16" \
            "cobaya==3.5.6" \
            "pytest==8.3.5"
          python - <<'PY'
          import importlib.metadata as m
          for package in ("numpy", "scipy", "camb", "sacc", "cobaya", "pytest"):
              print(package, m.version(package))
          PY
          gfortran --version | head -1

      - name: Resolve historical CAMB authority
        run: |
          set -euo pipefail
          rm -rf .camb-history
          git clone --filter=blob:none --no-checkout "$CAMB_UPSTREAM_URL" .camb-history
          candidate="$(git -C .camb-history rev-list -1 --first-parent --before="$CAMB_HISTORY_CUTOFF" origin/master)"
          test -n "$candidate"
          echo "$candidate" > camb_historical_authority_sha.txt
          git -C .camb-history show -s --format='%H%n%cI%n%s' "$candidate" > camb_historical_authority.txt
          echo "CAMB_REPO_VERSION=$candidate" >> "$GITHUB_ENV"
          cat camb_historical_authority.txt

      - name: Acquire exact ACT upstream commit without vendoring
        run: |
          set -euo pipefail
          rm -rf .act-upstream
          git clone --filter=blob:none --no-checkout "$ACT_UPSTREAM_URL" .act-upstream
          git -C .act-upstream checkout --detach "$ACT_UPSTREAM_SHA"
          test "$(git -C .act-upstream rev-parse HEAD)" = "$ACT_UPSTREAM_SHA"
          git -C .act-upstream rev-parse 'HEAD^{tree}' > act_upstream_tree.txt
          git -C .act-upstream ls-tree -r HEAD | sha256sum > act_upstream_lstree.sha256
          sha256sum .act-upstream/act_dr6_cmbonly/tests/test_act.py > act_upstream_reference_test.sha256
          python -m pip install --disable-pip-version-check --no-deps -e ./.act-upstream

      - name: Materialize likelihood data and exact effective CAMB source
        run: |
          set -euo pipefail
          mkdir -p "$COBAYA_PACKAGES_PATH/code"
          cobaya-install act_dr6_cmbonly --packages-path "$COBAYA_PACKAGES_PATH"
          cobaya-install act_dr6_cmbonly.PlanckActCut --packages-path "$COBAYA_PACKAGES_PATH"
          rm -rf "$COBAYA_PACKAGES_PATH/code/CAMB"
          git clone --recursive "$CAMB_UPSTREAM_URL" "$COBAYA_PACKAGES_PATH/code/CAMB"
          git -C "$COBAYA_PACKAGES_PATH/code/CAMB" checkout --detach "$CAMB_REPO_VERSION"
          git -C "$COBAYA_PACKAGES_PATH/code/CAMB" submodule update --init --recursive
          test "$(git -C "$COBAYA_PACKAGES_PATH/code/CAMB" rev-parse HEAD)" = "$CAMB_REPO_VERSION"
          (cd "$COBAYA_PACKAGES_PATH/code/CAMB" && python setup.py build)
          effective_camb_sha="$(git -C "$COBAYA_PACKAGES_PATH/code/CAMB" rev-parse HEAD)"
          echo "$effective_camb_sha" > camb_effective_sha.txt
          test "$effective_camb_sha" = "$CAMB_REPO_VERSION"
          PYTHONPATH="$COBAYA_PACKAGES_PATH/code/CAMB${PYTHONPATH:+:$PYTHONPATH}" python - <<'PY' > camb_effective_runtime.txt
          import camb
          print(getattr(camb, "__version__", "TOKEN_VAZIO_VERSION_ATTRIBUTE"))
          print(camb.__file__)
          PY
          cat camb_effective_runtime.txt
          grep -F "$COBAYA_PACKAGES_PATH/code/CAMB" camb_effective_runtime.txt
          find "$COBAYA_PACKAGES_PATH" -type f -print0 | sort -z | xargs -0 sha256sum > act_dr6_data_files.sha256
          test -s act_dr6_data_files.sha256

      - name: Run pinned upstream ACT tests and preserve diagnostics
        id: upstream_tests
        run: |
          set +e
          export PYTHONPATH="$COBAYA_PACKAGES_PATH/code/CAMB${PYTHONPATH:+:$PYTHONPATH}"
          python -m pytest -q .act-upstream/act_dr6_cmbonly/tests/test_act.py --junitxml=act_dr6_pytest.xml 2>&1 | tee act_dr6_pytest.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload upstream-test diagnostics before enforcement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: act-dr6-upstream-test-diagnostics-${{ github.run_id }}
          path: |
            act_dr6_pytest.xml
            act_dr6_pytest.log
            act_dr6_data_files.sha256
            act_upstream_tree.txt
            act_upstream_lstree.sha256
            act_upstream_reference_test.sha256
            camb_historical_authority_sha.txt
            camb_historical_authority.txt
            camb_effective_sha.txt
            camb_effective_runtime.txt
          if-no-files-found: error
          retention-days: 30

      - name: Reproduce exact upstream reference predicate
        id: reference_values
        if: steps.upstream_tests.outputs.exit_code == '0'
        run: |
          set +e
          export PYTHONPATH="$COBAYA_PACKAGES_PATH/code/CAMB${PYTHONPATH:+:$PYTHONPATH}"
          python - <<'PY' 2>&1 | tee act_dr6_reference.log
          import json
          import os
          import numpy as np
          from cobaya.model import get_model

          camb_path = os.path.join(os.environ["COBAYA_PACKAGES_PATH"], "code", "CAMB")
          base = {
              "packages_path": os.environ["COBAYA_PACKAGES_PATH"],
              "params": {"ombh2": 0.022, "omch2": 0.117, "ns": 0.96, "As": 2e-9, "tau": 0.065, "cosmomc_theta": 104.09e-4},
              "theory": {"camb": {"path": camb_path, "extra_args": {"lmax": 9000, "lens_potential_accuracy": 8, "min_l_logl_sampling": 6000}}},
              "debug": False,
          }
          act = dict(base)
          act["likelihood"] = {"act_dr6_cmbonly": {"stop_at_error": True, "input_file": "dr6_data_cmbonly.fits", "params": {"A_act": 1.0, "P_act": 1.0}}}
          act_loglike = float(sum(get_model(act).loglikes()[0]))
          joint = dict(base)
          joint["likelihood"] = {
              "act_dr6_cmbonly": {"stop_at_error": True, "input_file": "dr6_data_cmbonly.fits", "params": {"A_act": 1.0, "P_act": 1.0}},
              "act_dr6_cmbonly.PlanckActCut": {"stop_at_error": True, "params": {"A_planck": 1.0}},
          }
          joint_loglike = float(sum(get_model(joint).loglikes()[0]))
          expected_act, expected_joint, atol, rtol = -395.48, -962.27, 1e-2, 1e-5
          act_error = abs(act_loglike - expected_act)
          joint_error = abs(joint_loglike - expected_joint)
          act_pass = bool(np.isclose(act_loglike, expected_act, atol=atol, rtol=rtol))
          joint_pass = bool(np.isclose(joint_loglike, expected_joint, atol=atol, rtol=rtol))
          result = {
              "authority": {"upstream_test": "act_dr6_cmbonly/tests/test_act.py", "comparison": "numpy.isclose", "atol": atol, "rtol": rtol, "formula": "abs(actual-expected) <= atol + rtol*abs(expected)"},
              "ACT_TTTEEE_loglike": act_loglike,
              "ACT_PlanckActCut_loglike": joint_loglike,
              "expected_ACT_TTTEEE": expected_act,
              "expected_ACT_PlanckActCut": expected_joint,
              "absolute_error_ACT_TTTEEE": act_error,
              "absolute_error_ACT_PlanckActCut": joint_error,
              "effective_limit_ACT_TTTEEE": atol + rtol * abs(expected_act),
              "effective_limit_ACT_PlanckActCut": atol + rtol * abs(expected_joint),
              "upstream_predicate_pass_ACT_TTTEEE": act_pass,
              "upstream_predicate_pass_ACT_PlanckActCut": joint_pass,
              "strict_abs_only_0p01_pass_ACT_TTTEEE": act_error <= atol,
              "strict_abs_only_0p01_pass_ACT_PlanckActCut": joint_error <= atol,
          }
          with open("act_dr6_reference_loglikes.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(result, sort_keys=True))
          assert act_pass
          assert joint_pass
          PY
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload reference-value diagnostics before enforcement
        if: always() && steps.upstream_tests.outputs.exit_code == '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: act-dr6-reference-diagnostics-${{ github.run_id }}
          path: |
            act_dr6_reference.log
            act_dr6_reference_loglikes.json
          if-no-files-found: warn
          retention-days: 30

      - name: Build provenance-only RLL receipt
        if: steps.upstream_tests.outputs.exit_code == '0' && steps.reference_values.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          mkdir -p artifacts/science/act/runtime
          export PYTHONPATH="$COBAYA_PACKAGES_PATH/code/CAMB${PYTHONPATH:+:$PYTHONPATH}"
          python - <<'PY'
          import hashlib
          import importlib.metadata as m
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import act_dr6_cmbonly

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          xml_root = ET.parse("act_dr6_pytest.xml").getroot()
          suite = xml_root if xml_root.tag == "testsuite" else xml_root.find("testsuite")
          refs = json.loads(Path("act_dr6_reference_loglikes.json").read_text(encoding="utf-8"))
          data_manifest = Path("act_dr6_data_files.sha256")
          lines = [line for line in data_manifest.read_text(encoding="utf-8").splitlines() if line.strip()]
          camb_runtime = Path("camb_effective_runtime.txt").read_text(encoding="utf-8").splitlines()
          runtime = {package: m.version(package) for package in ("numpy", "scipy", "camb", "sacc", "cobaya", "pytest")}
          runtime["ACT_DR6_CMBonly"] = getattr(act_dr6_cmbonly, "__version__", "TOKEN_VAZIO_VERSION_ATTRIBUTE")
          receipt = {
              "schema": "rll.act_dr6_cmbonly_materialization_receipt.v3",
              "state": "VERIFIED_PINNED_UPSTREAM_REFERENCE_PREDICATE",
              "claim_allowed": False,
              "publication_ready": False,
              "upstream": {
                  "repository": os.environ["ACT_UPSTREAM_REPOSITORY"],
                  "commit": os.environ["ACT_UPSTREAM_SHA"],
                  "git_tree": Path("act_upstream_tree.txt").read_text(encoding="utf-8").strip(),
                  "ls_tree_manifest_sha256": sha256(Path("act_upstream_lstree.sha256")),
                  "reference_test_sha256": sha256(Path(".act-upstream/act_dr6_cmbonly/tests/test_act.py")),
              },
              "runtime": runtime,
              "effective_camb": {
                  "git_sha": Path("camb_effective_sha.txt").read_text(encoding="utf-8").strip(),
                  "resolved_cutoff": os.environ["CAMB_HISTORY_CUTOFF"],
                  "reported_version": camb_runtime[0] if camb_runtime else "TOKEN_VAZIO",
                  "import_path": camb_runtime[1] if len(camb_runtime) > 1 else "TOKEN_VAZIO",
                  "selection_method": "manual exact git checkout + source build + explicit Cobaya theory path",
              },
              "data_custody": {"installer": "cobaya-install", "components": ["act_dr6_cmbonly", "act_dr6_cmbonly.PlanckActCut"], "file_count": len(lines), "file_manifest_sha256": sha256(data_manifest), "vendored_into_rll": False},
              "upstream_tests": {"tests": int(suite.attrib.get("tests", "0")), "failures": int(suite.attrib.get("failures", "0")), "errors": int(suite.attrib.get("errors", "0")), "skipped": int(suite.attrib.get("skipped", "0")), "junit_sha256": sha256(Path("act_dr6_pytest.xml")), "log_sha256": sha256(Path("act_dr6_pytest.log"))},
              "reference_likelihood": refs,
              "diagnostic_boundary": {"upstream_predicate_is_literal_authority": True, "strict_absolute_only_0p01_is_upstream_contract": False, "strict_absolute_only_planck_pass": refs["strict_abs_only_0p01_pass_ACT_PlanckActCut"], "strict_absolute_only_planck_residual": refs["absolute_error_ACT_PlanckActCut"]},
              "scientific_boundary": "This receipt verifies pinned ACT DR6 CMB-only acquisition, upstream tests, exact CAMB source authority, and the exact numpy.isclose predicate in pinned upstream test_act.py. It is not a posterior-chain reproduction and does not validate any RLL CMB prediction.",
              "reduces_token": "TOKEN_VAZIO_ACT_DR6_CMBONLY_MATERIALIZATION_REPRODUCTION",
              "successor": "TOKEN_VAZIO_ACT_DR6_LCDM_POSTERIOR_CHAIN_REPRODUCTION",
              "F_ok": ["Pinned ACT upstream code and five upstream tests executed.", "Effective CAMB source was exact-checkout, compiled and hash-verified.", "Official likelihood data were acquired and hashed without vendoring into RLL.", "Both reference values satisfy the exact upstream numpy.isclose predicate."],
              "F_gap": ["The ACT+Planck value has an absolute-only residual greater than 0.01; this is retained because upstream also includes rtol=1e-5.", "TOKEN_VAZIO_ACT_DR6_LCDM_POSTERIOR_CHAIN_REPRODUCTION", "TOKEN_VAZIO_RLL_PERTURBATION_CLOSURE_RELATIONS", "TOKEN_VAZIO_RLL_CLASS_CAMB_IMPLEMENTATION"],
              "F_next": ["Treat the upstream predicate as the materialization authority.", "Keep the strict absolute-only residual visible.", "Posterior-chain reproduction is the next ACT scientific gate."]
          }
          out = Path("artifacts/science/act/runtime/ACT_DR6_CMBONLY_MATERIALIZATION_CURRENT.json")
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          sha256sum \
            artifacts/science/act/runtime/ACT_DR6_CMBONLY_MATERIALIZATION_CURRENT.json \
            act_dr6_reference_loglikes.json act_dr6_data_files.sha256 act_upstream_lstree.sha256 \
            act_upstream_reference_test.sha256 act_dr6_pytest.xml act_dr6_pytest.log \
            camb_historical_authority_sha.txt camb_historical_authority.txt camb_effective_sha.txt camb_effective_runtime.txt \
            > artifacts/science/act/runtime/ACT_DR6_CMBONLY_RUNTIME_CHECKSUMS.sha256

      - name: Verify claim boundaries
        if: steps.upstream_tests.outputs.exit_code == '0' && steps.reference_values.outputs.exit_code == '0'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("artifacts/science/act/runtime/ACT_DR6_CMBONLY_MATERIALIZATION_CURRENT.json").read_text(encoding="utf-8"))
          assert d["state"] == "VERIFIED_PINNED_UPSTREAM_REFERENCE_PREDICATE"
          assert d["claim_allowed"] is False and d["publication_ready"] is False
          assert d["data_custody"]["vendored_into_rll"] is False
          assert d["upstream_tests"]["failures"] == 0 and d["upstream_tests"]["errors"] == 0
          assert d["reference_likelihood"]["upstream_predicate_pass_ACT_TTTEEE"] is True
          assert d["reference_likelihood"]["upstream_predicate_pass_PlanckActCut"] is True
          assert d["reference_likelihood"]["authority"]["atol"] == 1e-2
          assert d["reference_likelihood"]["authority"]["rtol"] == 1e-5
          assert d["successor"] == "TOKEN_VAZIO_ACT_DR6_LCDM_POSTERIOR_CHAIN_REPRODUCTION"
          PY

      - name: Upload provenance-only ACT success receipts
        if: steps.upstream_tests.outputs.exit_code == '0' && steps.reference_values.outputs.exit_code == '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: act-dr6-cmbonly-${{ github.run_id }}
          path: |
            artifacts/science/act/runtime/ACT_DR6_CMBONLY_MATERIALIZATION_CURRENT.json
            artifacts/science/act/runtime/ACT_DR6_CMBONLY_RUNTIME_CHECKSUMS.sha256
            act_dr6_reference_loglikes.json
            act_dr6_reference.log
            act_dr6_data_files.sha256
            act_upstream_lstree.sha256
            act_upstream_reference_test.sha256
            act_dr6_pytest.xml
            act_dr6_pytest.log
            camb_historical_authority_sha.txt
            camb_historical_authority.txt
            camb_effective_sha.txt
            camb_effective_runtime.txt
          if-no-files-found: error
          retention-days: 30

      - name: Enforce ACT upstream/reference authority after diagnostics custody
        if: always()
        run: |
          upstream="${{ steps.upstream_tests.outputs.exit_code }}"
          if [ "$upstream" != "0" ]; then
            echo "ACT upstream tests failed with exit code ${upstream:-missing}; diagnostics were uploaded."
            exit 3
          fi
          reference="${{ steps.reference_values.outputs.exit_code }}"
          if [ "$reference" != "0" ]; then
            echo "ACT upstream reference predicate failed with exit code ${reference:-missing}; diagnostics were uploaded."
            exit 4
          fi
