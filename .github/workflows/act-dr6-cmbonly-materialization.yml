name: ACT DR6 CMB-only Materialization

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/act-dr6-cmbonly-materialization.yml"
      - ".github/workflow-contract.yml"
      - "artifacts/science/act/**"
      - "data/governance/RLL_*TOKEN_VAZIO*"
      - "data/governance/RLL_GAP_CLOSURE_INPUT_20260807_V1.json"

permissions:
  contents: read

env:
  ACT_UPSTREAM_REPOSITORY: ACTCollaboration/DR6-ACT-lite
  ACT_UPSTREAM_URL: https://github.com/ACTCollaboration/DR6-ACT-lite.git
  ACT_UPSTREAM_SHA: 627aeafb88ae5ad1aa66b406bea2d65cfa66a27d
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/.act-cobaya-packages
  CLAIM_BOUNDARY: "This gate reproduces pinned upstream ACT DR6 CMB-only installation/tests/reference likelihood values only. It does not validate RLL CMB predictions, a posterior chain, or any RLL perturbation claim."

concurrency:
  group: act-dr6-cmbonly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout RLL without persistent credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install upstream-date scientific runtime
        run: |
          set -euo pipefail
          # Reconstruct the latest package line available when the audited ACT
          # upstream commit was published (2025-03-28). The previous controlled
          # 2026 stack executed the likelihood but missed the upstream reference
          # values, so this experiment changes dependencies only. Data, ACT SHA,
          # cosmological parameters and ±0.01 assertions remain unchanged.
          python -m pip install --disable-pip-version-check \
            "numpy==2.2.4" \
            "scipy==1.15.2" \
            "camb==1.5.9" \
            "sacc==0.16" \
            "cobaya==3.5.6" \
            "pytest==8.3.5"
          python - <<'PY'
          import importlib.metadata as m
          for package in ("numpy", "scipy", "camb", "sacc", "cobaya", "pytest"):
              print(package, m.version(package))
          PY

      - name: Acquire exact upstream commit without vendoring
        run: |
          set -euo pipefail
          rm -rf .act-upstream
          git clone --filter=blob:none --no-checkout "$ACT_UPSTREAM_URL" .act-upstream
          git -C .act-upstream checkout --detach "$ACT_UPSTREAM_SHA"
          test "$(git -C .act-upstream rev-parse HEAD)" = "$ACT_UPSTREAM_SHA"
          git -C .act-upstream rev-parse 'HEAD^{tree}' > act_upstream_tree.txt
          git -C .act-upstream ls-tree -r HEAD | sha256sum > act_upstream_lstree.sha256
          python -m pip install --disable-pip-version-check --no-deps -e ./.act-upstream

      - name: Materialize official likelihood data through Cobaya installer
        run: |
          set -euo pipefail
          mkdir -p "$COBAYA_PACKAGES_PATH"
          cobaya-install act_dr6_cmbonly
          cobaya-install act_dr6_cmbonly.PlanckActCut
          test -d "$COBAYA_PACKAGES_PATH"
          find "$COBAYA_PACKAGES_PATH" -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > act_dr6_data_files.sha256
          test -s act_dr6_data_files.sha256

      - name: Run pinned upstream ACT tests and preserve diagnostics
        id: upstream_tests
        run: |
          set +e
          python -m pytest -q .act-upstream/act_dr6_cmbonly/tests/test_act.py \
            --junitxml=act_dr6_pytest.xml \
            2>&1 | tee act_dr6_pytest.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload upstream-test diagnostics before enforcement
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: act-dr6-upstream-test-diagnostics-${{ github.run_id }}
          path: |
            act_dr6_pytest.xml
            act_dr6_pytest.log
            act_dr6_data_files.sha256
            act_upstream_tree.txt
            act_upstream_lstree.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Reproduce pinned upstream reference likelihood values
        id: reference_values
        if: steps.upstream_tests.outputs.exit_code == '0'
        run: |
          set +e
          python - <<'PY' 2>&1 | tee act_dr6_reference.log
          import json
          import math
          from cobaya.model import get_model

          base = {
              "params": {
                  "ombh2": 0.022,
                  "omch2": 0.117,
                  "ns": 0.96,
                  "As": 2e-9,
                  "tau": 0.065,
                  "cosmomc_theta": 104.09e-4,
              },
              "theory": {"camb": {"extra_args": {
                  "lmax": 9000,
                  "lens_potential_accuracy": 8,
                  "min_l_logl_sampling": 6000,
              }}},
              "sampler": {"evaluate": None},
              "debug": False,
          }

          act = dict(base)
          act["likelihood"] = {
              "act_dr6_cmbonly": {
                  "stop_at_error": True,
                  "input_file": "dr6_data_cmbonly.fits",
                  "params": {"A_act": 1.0, "P_act": 1.0},
              }
          }
          model = get_model(act)
          act_loglike = float(sum(model.loglikes()[0]))

          joint = dict(base)
          joint["likelihood"] = {
              "act_dr6_cmbonly": {
                  "stop_at_error": True,
                  "input_file": "dr6_data_cmbonly.fits",
                  "params": {"A_act": 1.0, "P_act": 1.0},
              },
              "act_dr6_cmbonly.PlanckActCut": {
                  "stop_at_error": True,
                  "params": {"A_planck": 1.0},
              },
          }
          model_joint = get_model(joint)
          joint_loglike = float(sum(model_joint.loglikes()[0]))

          result = {
              "ACT_TTTEEE_loglike": act_loglike,
              "ACT_PlanckActCut_loglike": joint_loglike,
              "expected_ACT_TTTEEE": -395.48,
              "expected_ACT_PlanckActCut": -962.27,
              "absolute_error_ACT_TTTEEE": abs(act_loglike + 395.48),
              "absolute_error_ACT_PlanckActCut": abs(joint_loglike + 962.27),
              "tolerance": 1e-2,
          }
          with open("act_dr6_reference_loglikes.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(result, sort_keys=True))
          assert math.isclose(act_loglike, -395.48, abs_tol=1e-2)
          assert math.isclose(joint_loglike, -962.27, abs_tol=1e-2)
          PY
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload reference-value diagnostics before enforcement
        if: always() && steps.upstream_tests.outputs.exit_code == '0'
        uses: actions/upload-artifact@v7
        with:
          name: act-dr6-reference-diagnostics-${{ github.run_id }}
          path: |
            act_dr6_reference.log
            act_dr6_reference_loglikes.json
          if-no-files-found: warn
          retention-days: 30

      - name: Build provenance-only RLL receipt
        if: steps.upstream_tests.outputs.exit_code == '0' && steps.reference_values.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          mkdir -p artifacts/science/act/runtime
          python - <<'PY'
          import hashlib
          import importlib.metadata as m
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          xml_root = ET.parse("act_dr6_pytest.xml").getroot()
          suite = xml_root if xml_root.tag == "testsuite" else xml_root.find("testsuite")
          refs = json.loads(Path("act_dr6_reference_loglikes.json").read_text(encoding="utf-8"))
          data_manifest = Path("act_dr6_data_files.sha256")
          lines = [line for line in data_manifest.read_text(encoding="utf-8").splitlines() if line.strip()]
          tree = Path("act_upstream_tree.txt").read_text(encoding="utf-8").strip()

          receipt = {
              "schema": "rll.act_dr6_cmbonly_materialization_receipt.v1",
              "state": "VERIFIED_PINNED_UPSTREAM_REFERENCE_LOGLIKES",
              "claim_allowed": False,
              "publication_ready": False,
              "upstream": {
                  "repository": os.environ["ACT_UPSTREAM_REPOSITORY"],
                  "commit": os.environ["ACT_UPSTREAM_SHA"],
                  "git_tree": tree,
                  "ls_tree_manifest_sha256": sha256(Path("act_upstream_lstree.sha256")),
              },
              "runtime": {
                  package: m.version(package)
                  for package in ("numpy", "scipy", "camb", "sacc", "cobaya", "pytest", "ACT DR6 CMBonly")
              },
              "data_custody": {
                  "installer": "cobaya-install",
                  "components": ["act_dr6_cmbonly", "act_dr6_cmbonly.PlanckActCut"],
                  "file_count": len(lines),
                  "file_manifest_sha256": sha256(data_manifest),
                  "vendored_into_rll": False,
              },
              "upstream_tests": {
                  "tests": int(suite.attrib.get("tests", "0")),
                  "failures": int(suite.attrib.get("failures", "0")),
                  "errors": int(suite.attrib.get("errors", "0")),
                  "skipped": int(suite.attrib.get("skipped", "0")),
                  "junit_sha256": sha256(Path("act_dr6_pytest.xml")),
                  "log_sha256": sha256(Path("act_dr6_pytest.log")),
              },
              "reference_likelihood": refs,
              "scientific_boundary": "This receipt verifies pinned ACT DR6 CMB-only acquisition, upstream tests, and two reference likelihood evaluations. It is not an ACT posterior-chain reproduction and does not validate any RLL CMB prediction; RLL perturbation closure remains a separate TOKEN_VAZIO.",
              "reduces_token": "TOKEN_VAZIO_ACT_DR6_CMBONLY_MATERIALIZATION_REPRODUCTION",
              "successor": "TOKEN_VAZIO_ACT_DR6_LCDM_POSTERIOR_CHAIN_REPRODUCTION",
              "F_ok": [
                  "Pinned upstream code was executed at the audited commit.",
                  "Official likelihood data were acquired through the declared Cobaya installer and hashed without vendoring into RLL.",
                  "Upstream tests passed.",
                  "ACT TT/TE/EE and ACT+Planck reference likelihood values matched upstream tolerances."
              ],
              "F_gap": [
                  "TOKEN_VAZIO_ACT_DR6_LCDM_POSTERIOR_CHAIN_REPRODUCTION",
                  "TOKEN_VAZIO_RLL_PERTURBATION_CLOSURE_RELATIONS",
                  "TOKEN_VAZIO_RLL_CLASS_CAMB_IMPLEMENTATION"
              ],
              "F_next": [
                  "Run a pinned upstream LCDM posterior chain with declared stopping criteria and compare published/reference posterior summaries.",
                  "Do not attach RLL to this likelihood until RLL perturbation closure and independent CLASS/CAMB implementation exist."
              ]
          }
          out = Path("artifacts/science/act/runtime/ACT_DR6_CMBONLY_MATERIALIZATION_CURRENT.json")
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          sha256sum \
            artifacts/science/act/runtime/ACT_DR6_CMBONLY_MATERIALIZATION_CURRENT.json \
            act_dr6_reference_loglikes.json \
            act_dr6_data_files.sha256 \
            act_upstream_lstree.sha256 \
            act_dr6_pytest.xml \
            act_dr6_pytest.log \
            > artifacts/science/act/runtime/ACT_DR6_CMBONLY_RUNTIME_CHECKSUMS.sha256

      - name: Verify claim boundaries
        if: steps.upstream_tests.outputs.exit_code == '0' && steps.reference_values.outputs.exit_code == '0'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/science/act/runtime/ACT_DR6_CMBONLY_MATERIALIZATION_CURRENT.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["state"] == "VERIFIED_PINNED_UPSTREAM_REFERENCE_LOGLIKES"
          assert d["claim_allowed"] is False
          assert d["publication_ready"] is False
          assert d["data_custody"]["vendored_into_rll"] is False
          assert d["upstream_tests"]["failures"] == 0
          assert d["upstream_tests"]["errors"] == 0
          assert d["reference_likelihood"]["absolute_error_ACT_TTTEEE"] <= 1e-2
          assert d["reference_likelihood"]["absolute_error_ACT_PlanckActCut"] <= 1e-2
          assert d["successor"] == "TOKEN_VAZIO_ACT_DR6_LCDM_POSTERIOR_CHAIN_REPRODUCTION"
          PY

      - name: Upload provenance-only ACT success receipts
        if: steps.upstream_tests.outputs.exit_code == '0' && steps.reference_values.outputs.exit_code == '0'
        uses: actions/upload-artifact@v7
        with:
          name: act-dr6-cmbonly-${{ github.run_id }}
          path: |
            artifacts/science/act/runtime/ACT_DR6_CMBONLY_MATERIALIZATION_CURRENT.json
            artifacts/science/act/runtime/ACT_DR6_CMBONLY_RUNTIME_CHECKSUMS.sha256
            act_dr6_reference_loglikes.json
            act_dr6_reference.log
            act_dr6_data_files.sha256
            act_upstream_lstree.sha256
            act_dr6_pytest.xml
            act_dr6_pytest.log
          if-no-files-found: error
          retention-days: 30

      - name: Enforce ACT upstream/reference authority after diagnostics custody
        if: always()
        run: |
          upstream="${{ steps.upstream_tests.outputs.exit_code }}"
          if [ "$upstream" != "0" ]; then
            echo "ACT upstream tests failed with exit code ${upstream:-missing}; diagnostics were uploaded."
            exit 3
          fi
          reference="${{ steps.reference_values.outputs.exit_code }}"
          if [ "$reference" != "0" ]; then
            echo "ACT reference likelihood reproduction failed with exit code ${reference:-missing}; diagnostics were uploaded."
            exit 4
          fi
