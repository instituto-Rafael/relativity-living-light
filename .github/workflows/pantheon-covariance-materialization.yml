name: Pantheon Covariance Materialization

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "products/rll-evidence-runner/**"
      - "scripts/fetch_pantheon_covariance.py"
      - "scripts/verify_pantheon_inputs.py"
      - "tests/test_fetch_pantheon_covariance.py"
      - "tests/test_verify_pantheon_inputs_v2.py"
      - "tests/test_rll_pantheon_full_covariance_fit_v1.py"
      - "tests/test_rll_pantheon_three_model_cpl_v1.py"
      - ".github/workflows/pantheon-covariance-materialization.yml"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: pantheon-covariance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-verify-and-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout pinned RLL revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install focal and product dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install -e products/rll-evidence-runner

      - name: Run focal policy and likelihood tests
        run: |
          python -m pytest -q \
            tests/test_fetch_pantheon_covariance.py \
            tests/test_verify_pantheon_inputs_v2.py \
            tests/test_rll_pantheon_full_covariance_fit_v1.py \
            tests/test_rll_pantheon_three_model_cpl_v1.py

      - name: Materialize pinned official STAT+SYS covariance
        env:
          OUTPUT_DIR: ${{ runner.temp }}/pantheon-covariance
          RECEIPT: ${{ runner.temp }}/pantheon-covariance-receipt.json
          CATALOG: data/real/cosmology/pantheon_plus/Pantheon+_Data/4_DISTANCES_AND_COVAR/Pantheon+SH0ES.dat
          CANONICAL_DIR: data/real/cosmology/pantheon_plus/Pantheon+_Data/4_DISTANCES_AND_COVAR
        run: |
          set -euo pipefail
          python scripts/fetch_pantheon_covariance.py \
            --output-dir "$OUTPUT_DIR" \
            --receipt "$RECEIPT"
          cp "$CATALOG" "$OUTPUT_DIR/Pantheon+SH0ES.dat"
          python scripts/verify_pantheon_inputs.py \
            --data-dir "$OUTPUT_DIR" \
            --json \
            --require-full-covariance \
            > "${{ runner.temp }}/pantheon-readiness.json"
          cp "$OUTPUT_DIR/Pantheon+SH0ES_STAT+SYS.cov" \
             "$CANONICAL_DIR/Pantheon+SH0ES_STAT+SYS.cov"
          cp "$OUTPUT_DIR/Pantheon+SH0ES_STAT+SYS.cov.sha256" \
             "$CANONICAL_DIR/Pantheon+SH0ES_STAT+SYS.cov.sha256"
          cp "$OUTPUT_DIR/Pantheon+SH0ES_STAT+SYS.cov.sha256" \
             "${{ runner.temp }}/Pantheon+SH0ES_STAT+SYS.cov.sha256"
          test -z "$(git status --porcelain --untracked-files=all -- "$CANONICAL_DIR/Pantheon+SH0ES_STAT+SYS.cov")"

      - name: Execute canonical LCDM-RLL full-covariance fit
        run: |
          set -euo pipefail
          rll-evidence run \
            products/rll-evidence-runner/experiments/pantheon_full_covariance_lcdm_rll_fit_v1.yml
          rll-evidence verify \
            artifacts/evidence/RLL-EVIDENCE-PANTHEON-FIT-001/receipt.json

      - name: Execute modern LCDM-CPL-RLL full-covariance fit
        run: |
          set -euo pipefail
          rll-evidence run \
            products/rll-evidence-runner/experiments/pantheon_full_covariance_lcdm_cpl_rll_fit_v1.yml
          rll-evidence verify \
            artifacts/evidence/RLL-EVIDENCE-PANTHEON-3MODEL-001/receipt.json

      - name: Validate scientific boundary and summarize metrics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path("artifacts/evidence/RLL-EVIDENCE-PANTHEON-FIT-001/pantheon_fit_result.json")
          receipt_path = Path("artifacts/evidence/RLL-EVIDENCE-PANTHEON-FIT-001/receipt.json")
          result = json.loads(result_path.read_text(encoding="utf-8"))
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          assert result["claim_allowed"] is False
          assert result["publication_effect"] == "NONE"
          assert receipt["claim_allowed"] is False
          assert len(result["rows"]) == 2
          comparison = result["comparison"]["candidate_minus_baseline"]

          three_path = Path("artifacts/evidence/RLL-EVIDENCE-PANTHEON-3MODEL-001/pantheon_three_model_result.json")
          three_receipt_path = Path("artifacts/evidence/RLL-EVIDENCE-PANTHEON-3MODEL-001/receipt.json")
          three = json.loads(three_path.read_text(encoding="utf-8"))
          three_receipt = json.loads(three_receipt_path.read_text(encoding="utf-8"))
          assert three["claim_allowed"] is False
          assert three["publication_effect"] == "NONE"
          assert three_receipt["claim_allowed"] is False
          assert [row["model"] for row in three["rows"]] == [
              "LCDM_pantheon_full", "CPL_pantheon_full", "RLL_pantheon_full"
          ]
          cpl = three["comparison"]["cpl_minus_baseline"]
          rll = three["comparison"]["rll_minus_baseline"]

          summary = [
              "# Pantheon+ full-covariance validation",
              "",
              f"- canonical status: `{result['status']}`",
              f"- three-model status: `{three['status']}`",
              f"- selected rows: `{three['inputs']['selected_rows']}`",
              f"- covariance SHA-256: `{three['inputs']['covariance']['sha256']}`",
              f"- canonical Δχ² (RLL−ΛCDM): `{comparison['chi2']:.12g}`",
              f"- three-model Δχ² (CPL−ΛCDM): `{cpl['chi2']:.12g}`",
              f"- three-model ΔBIC (CPL−ΛCDM): `{cpl['BIC']:.12g}`",
              f"- three-model Δχ² (RLL−ΛCDM): `{rll['chi2']:.12g}`",
              f"- three-model ΔBIC (RLL−ΛCDM): `{rll['BIC']:.12g}`",
              "- claim_allowed: `false`",
              "- DES-Dovekie calibration: `TOKEN_VAZIO`",
              "- real nested-sampling evidence: `TOKEN_VAZIO`",
              "",
              "A common full-covariance three-model fit is a fairness control, not external validation.",
          ]
          Path("artifacts/evidence/RLL-EVIDENCE-PANTHEON-FIT-001/SUMMARY.md").write_text(
              "\n".join(summary) + "\n", encoding="utf-8"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("\n".join(summary) + "\n")
          PY

      - name: Upload compact custody and fit receipts only
        uses: actions/upload-artifact@v4
        with:
          name: pantheon-full-fit-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pantheon-covariance-receipt.json
            ${{ runner.temp }}/pantheon-readiness.json
            ${{ runner.temp }}/Pantheon+SH0ES_STAT+SYS.cov.sha256
            artifacts/evidence/RLL-EVIDENCE-PANTHEON-FIT-001/pantheon_fit_result.json
            artifacts/evidence/RLL-EVIDENCE-PANTHEON-FIT-001/receipt.json
            artifacts/evidence/RLL-EVIDENCE-PANTHEON-FIT-001/SUMMARY.md
            artifacts/evidence/RLL-EVIDENCE-PANTHEON-3MODEL-001/pantheon_three_model_result.json
            artifacts/evidence/RLL-EVIDENCE-PANTHEON-3MODEL-001/receipt.json
          if-no-files-found: error
          retention-days: 30
