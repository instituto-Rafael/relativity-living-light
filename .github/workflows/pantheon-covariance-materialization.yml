name: Pantheon Covariance Materialization

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "products/rll-evidence-runner/**"
      - "scripts/fetch_pantheon_covariance.py"
      - "scripts/fetch_dovekie_inputs.py"
      - "scripts/verify_pantheon_inputs.py"
      - "tests/test_fetch_pantheon_covariance.py"
      - "tests/test_fetch_dovekie_inputs.py"
      - "tests/test_verify_pantheon_inputs_v2.py"
      - "tests/test_rll_pantheon_full_covariance_fit_v1.py"
      - "tests/test_rll_pantheon_three_model_cpl_v1.py"
      - "tests/test_rll_dovekie_three_model_v1.py"
      - "tests/test_rll_sn_gap_closure_v1.py"
      - ".github/workflows/pantheon-covariance-materialization.yml"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: pantheon-covariance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-verify-and-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout pinned RLL revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install focal and product dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install -e products/rll-evidence-runner

      - name: Run focal policy and likelihood tests
        run: |
          python -m pytest -q \
            tests/test_fetch_pantheon_covariance.py \
            tests/test_fetch_dovekie_inputs.py \
            tests/test_verify_pantheon_inputs_v2.py \
            tests/test_rll_pantheon_full_covariance_fit_v1.py \
            tests/test_rll_pantheon_three_model_cpl_v1.py \
            tests/test_rll_dovekie_three_model_v1.py \
            tests/test_rll_sn_gap_closure_v1.py

      - name: Materialize pinned official Pantheon STAT+SYS covariance
        env:
          OUTPUT_DIR: ${{ runner.temp }}/pantheon-covariance
          RECEIPT: ${{ runner.temp }}/pantheon-covariance-receipt.json
          CATALOG: data/real/cosmology/pantheon_plus/Pantheon+_Data/4_DISTANCES_AND_COVAR/Pantheon+SH0ES.dat
          CANONICAL_DIR: data/real/cosmology/pantheon_plus/Pantheon+_Data/4_DISTANCES_AND_COVAR
        run: |
          set -euo pipefail
          python scripts/fetch_pantheon_covariance.py \
            --output-dir "$OUTPUT_DIR" \
            --receipt "$RECEIPT"
          cp "$CATALOG" "$OUTPUT_DIR/Pantheon+SH0ES.dat"
          python scripts/verify_pantheon_inputs.py \
            --data-dir "$OUTPUT_DIR" \
            --json \
            --require-full-covariance \
            > "${{ runner.temp }}/pantheon-readiness.json"
          cp "$OUTPUT_DIR/Pantheon+SH0ES_STAT+SYS.cov" \
             "$CANONICAL_DIR/Pantheon+SH0ES_STAT+SYS.cov"
          cp "$OUTPUT_DIR/Pantheon+SH0ES_STAT+SYS.cov.sha256" \
             "$CANONICAL_DIR/Pantheon+SH0ES_STAT+SYS.cov.sha256"
          cp "$OUTPUT_DIR/Pantheon+SH0ES_STAT+SYS.cov.sha256" \
             "${{ runner.temp }}/Pantheon+SH0ES_STAT+SYS.cov.sha256"
          test -z "$(git status --porcelain --untracked-files=all -- "$CANONICAL_DIR/Pantheon+SH0ES_STAT+SYS.cov")"

      - name: Execute canonical Pantheon LCDM-RLL full-covariance fit
        run: |
          set -euo pipefail
          rll-evidence run \
            products/rll-evidence-runner/experiments/pantheon_full_covariance_lcdm_rll_fit_v1.yml
          rll-evidence verify \
            artifacts/evidence/RLL-EVIDENCE-PANTHEON-FIT-001/receipt.json

      - name: Execute modern Pantheon LCDM-CPL-RLL full-covariance fit
        run: |
          set -euo pipefail
          rll-evidence run \
            products/rll-evidence-runner/experiments/pantheon_full_covariance_lcdm_cpl_rll_fit_v1.yml
          rll-evidence verify \
            artifacts/evidence/RLL-EVIDENCE-PANTHEON-3MODEL-001/receipt.json

      - name: Execute Pantheon Hubble-flow common-nuisance companion
        run: |
          set -euo pipefail
          python -m rll_evidence.pantheon_hubbleflow_profiled \
            --catalog data/real/cosmology/pantheon_plus/Pantheon+_Data/4_DISTANCES_AND_COVAR/Pantheon+SH0ES.dat \
            --covariance data/real/cosmology/pantheon_plus/Pantheon+_Data/4_DISTANCES_AND_COVAR/Pantheon+SH0ES_STAT+SYS.cov \
            --output artifacts/science/sn_modern/pantheon_hubbleflow_profiled_result.json \
            --seeds 11,23,37 \
            --maxiter 250 \
            --integration-points 4096

      - name: Materialize pinned official DES-Dovekie HD and precision matrix
        run: |
          set -euo pipefail
          python scripts/fetch_dovekie_inputs.py \
            --output-dir data/real/cosmology/des_dovekie \
            --receipt artifacts/science/sn_modern/dovekie_materialization_receipt.json
          test -z "$(git status --porcelain --untracked-files=all -- \
            data/real/cosmology/des_dovekie/DES-Dovekie_HD.csv \
            'data/real/cosmology/des_dovekie/STAT+SYS.npz')"

      - name: Execute DES-Dovekie LCDM-CPL-RLL full-precision fit
        run: |
          set -euo pipefail
          rll-evidence run \
            products/rll-evidence-runner/experiments/dovekie_full_precision_lcdm_cpl_rll_fit_v1.yml
          rll-evidence verify \
            artifacts/evidence/RLL-EVIDENCE-DOVEKIE-3MODEL-001/receipt.json

      - name: Execute Dovekie CPL wa profile beyond historical bound
        run: |
          set -euo pipefail
          python -m rll_evidence.dovekie_cpl_wa_profile \
            --hd data/real/cosmology/des_dovekie/DES-Dovekie_HD.csv \
            --precision 'data/real/cosmology/des_dovekie/STAT+SYS.npz' \
            --output artifacts/science/sn_modern/dovekie_cpl_wa_profile_result.json \
            --wa-grid=-8,-6,-5,-4,-3,-2,-1,0,1,2,3 \
            --maxiter 180 \
            --integration-points 4096

      - name: Build common-nuisance ablation receipt and summarize metrics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          canonical = json.loads(Path(
              "artifacts/evidence/RLL-EVIDENCE-PANTHEON-FIT-001/pantheon_fit_result.json"
          ).read_text(encoding="utf-8"))
          canonical_receipt = json.loads(Path(
              "artifacts/evidence/RLL-EVIDENCE-PANTHEON-FIT-001/receipt.json"
          ).read_text(encoding="utf-8"))
          pantheon = json.loads(Path(
              "artifacts/evidence/RLL-EVIDENCE-PANTHEON-3MODEL-001/pantheon_three_model_result.json"
          ).read_text(encoding="utf-8"))
          pantheon_receipt = json.loads(Path(
              "artifacts/evidence/RLL-EVIDENCE-PANTHEON-3MODEL-001/receipt.json"
          ).read_text(encoding="utf-8"))
          pantheon_hf = json.loads(Path(
              "artifacts/science/sn_modern/pantheon_hubbleflow_profiled_result.json"
          ).read_text(encoding="utf-8"))
          dovekie = json.loads(Path(
              "artifacts/evidence/RLL-EVIDENCE-DOVEKIE-3MODEL-001/dovekie_three_model_result.json"
          ).read_text(encoding="utf-8"))
          dovekie_receipt = json.loads(Path(
              "artifacts/evidence/RLL-EVIDENCE-DOVEKIE-3MODEL-001/receipt.json"
          ).read_text(encoding="utf-8"))
          materialization = json.loads(Path(
              "artifacts/science/sn_modern/dovekie_materialization_receipt.json"
          ).read_text(encoding="utf-8"))
          wa_profile = json.loads(Path(
              "artifacts/science/sn_modern/dovekie_cpl_wa_profile_result.json"
          ).read_text(encoding="utf-8"))

          for payload in (
              canonical, canonical_receipt, pantheon, pantheon_receipt,
              pantheon_hf, dovekie, dovekie_receipt, materialization, wa_profile
          ):
              assert payload["claim_allowed"] is False

          assert materialization["precision_matrix"]["matrix_semantics"] == "inverse_covariance_precision"
          assert pantheon_hf["nuisance_policy"] == dovekie["method"]["nuisance"]
          assert pantheon_hf["H0_reference"] == 70.0
          assert dovekie["method"]["H0_policy"].startswith("fixed reference H0=70")
          assert [row["model"] for row in pantheon["rows"]] == [
              "LCDM_pantheon_full", "CPL_pantheon_full", "RLL_pantheon_full"
          ]
          assert [row["model"] for row in dovekie["rows"]] == [
              "LCDM_dovekie", "CPL_dovekie", "RLL_dovekie"
          ]

          p_cpl = pantheon["comparison"]["cpl_minus_baseline"]
          p_rll = pantheon["comparison"]["rll_minus_baseline"]
          ph_cpl = pantheon_hf["comparison"]["cpl_minus_baseline"]
          ph_rll = pantheon_hf["comparison"]["rll_minus_baseline"]
          d_cpl = dovekie["comparison"]["cpl_minus_baseline"]
          d_rll = dovekie["comparison"]["rll_minus_baseline"]

          ablation = {
              "schema": "rll.sn_common_nuisance_ablation_receipt.v1",
              "state": "VERIFIED",
              "claim_allowed": False,
              "publication_ready": False,
              "source_sha256": {
                  "pantheon_catalog": pantheon_hf["source_sha256"],
                  "dovekie_hd": dovekie["inputs"]["hubble_diagram"]["sha256"],
              },
              "covariance_sha256": {
                  "pantheon_full_covariance": pantheon_hf["covariance_sha256"],
                  "dovekie_precision": dovekie["inputs"]["precision_matrix"]["sha256"],
              },
              "n_supernovae": {
                  "pantheon_hubbleflow": pantheon_hf["n_supernovae"],
                  "dovekie": dovekie["inputs"]["selected_rows"],
              },
              "nuisance_policy": pantheon_hf["nuisance_policy"],
              "same_nuisance_policy": True,
              "calibration_variant": ["Pantheon+SH0ES_HUBBLE_FLOW_ONLY", "DES-Dovekie"],
              "chi2_full_covariance": {
                  "pantheon_hubbleflow": {row["model"]: row["chi2"] for row in pantheon_hf["rows"]},
                  "dovekie": {row["model"]: row["chi2"] for row in dovekie["rows"]},
              },
              "deltas": {
                  "pantheon_hubbleflow": {"CPL": ph_cpl, "RLL": ph_rll},
                  "dovekie": {"CPL": d_cpl, "RLL": d_rll},
              },
              "wa_profile_state": wa_profile["state"],
              "wa_profile_best": wa_profile["classification"]["best_wa"],
              "wa_profile_bounded_95_on_grid": wa_profile["classification"]["bounded_95_on_grid"],
              "scientific_boundary": (
                  "The two SN datasets now share the same profiled-offset/fixed-reference-H0 nuisance logic. "
                  "Differences in sample construction, calibration provenance and matrix construction remain physical/data differences to report, not nuisances to erase."
              ),
              "resolves_token": "TOKEN_VAZIO_SN_COMMON_NUISANCE_ABLATION",
          }
          ablation_path = Path("artifacts/science/sn_modern/common_nuisance_ablation_receipt.json")
          ablation_path.write_text(json.dumps(ablation, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          summary = [
              "# Modern SN likelihood validation + gap closure",
              "",
              f"- Pantheon+ full selected rows: `{pantheon['inputs']['selected_rows']}`",
              f"- Pantheon+ Hubble-flow selected rows: `{pantheon_hf['n_supernovae']}`",
              f"- Pantheon+ full Δχ² CPL−ΛCDM: `{p_cpl['chi2']:.12g}`",
              f"- Pantheon+ Hubble-flow Δχ² CPL−ΛCDM: `{ph_cpl['chi2']:.12g}`",
              f"- Pantheon+ Hubble-flow Δχ² RLL−ΛCDM: `{ph_rll['chi2']:.12g}`",
              f"- DES-Dovekie Δχ² CPL−ΛCDM: `{d_cpl['chi2']:.12g}`",
              f"- DES-Dovekie Δχ² RLL−ΛCDM: `{d_rll['chi2']:.12g}`",
              f"- Dovekie wa profile state: `{wa_profile['state']}`",
              f"- Dovekie wa profile best: `{wa_profile['classification']['best_wa']}`",
              f"- wa bounded at 95% on grid: `{wa_profile['classification']['bounded_95_on_grid']}`",
              "",
              "- common Pantheon+↔Dovekie nuisance-policy ablation: `VERIFIED`",
              "- real nested-sampling evidence: `TOKEN_VAZIO`",
              "- independent replication: `TOKEN_VAZIO`",
              "- claim_allowed: `false`",
          ]
          Path("artifacts/evidence/RLL-EVIDENCE-PANTHEON-FIT-001/SUMMARY.md").write_text(
              "\n".join(summary) + "\n", encoding="utf-8"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("\n".join(summary) + "\n")
          PY

      - name: Upload compact custody, gap-closure and fit receipts only
        uses: actions/upload-artifact@v7
        with:
          name: modern-sn-fit-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pantheon-covariance-receipt.json
            ${{ runner.temp }}/pantheon-readiness.json
            ${{ runner.temp }}/Pantheon+SH0ES_STAT+SYS.cov.sha256
            artifacts/evidence/RLL-EVIDENCE-PANTHEON-FIT-001/pantheon_fit_result.json
            artifacts/evidence/RLL-EVIDENCE-PANTHEON-FIT-001/receipt.json
            artifacts/evidence/RLL-EVIDENCE-PANTHEON-FIT-001/SUMMARY.md
            artifacts/evidence/RLL-EVIDENCE-PANTHEON-3MODEL-001/pantheon_three_model_result.json
            artifacts/evidence/RLL-EVIDENCE-PANTHEON-3MODEL-001/receipt.json
            artifacts/science/sn_modern/pantheon_hubbleflow_profiled_result.json
            artifacts/science/sn_modern/common_nuisance_ablation_receipt.json
            artifacts/science/sn_modern/dovekie_cpl_wa_profile_result.json
            artifacts/science/sn_modern/dovekie_materialization_receipt.json
            artifacts/science/sn_modern/dovekie_existing_verification.json
            artifacts/evidence/RLL-EVIDENCE-DOVEKIE-3MODEL-001/dovekie_three_model_result.json
            artifacts/evidence/RLL-EVIDENCE-DOVEKIE-3MODEL-001/receipt.json
            data/real/cosmology/des_dovekie/DES-Dovekie_HD.csv.sha256
            data/real/cosmology/des_dovekie/STAT+SYS.npz.sha256
          if-no-files-found: error
          retention-days: 30
