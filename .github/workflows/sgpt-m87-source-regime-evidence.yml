name: SGPT M87 Source Regime Evidence

on:
  pull_request:
    branches: [rll/lab]
    paths:
      - 'data/evidence/m87/source_state_evidence.v1.json'
      - 'data/evidence/m87/data_custody_metadata.v1.json'
      - 'data/contracts/m87/process_timescale_registry.v1.json'
      - 'tools/evaluate_sgpt_m87_source_regimes.py'
      - 'tools/evaluate_sgpt_m87_timescale_readiness.py'
      - 'tools/validate_sgpt_m87_external_evidence.py'
      - '.github/workflows/sgpt-m87-source-regime-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regime-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate external evidence without filling unavailable bytes
        run: |
          set -euo pipefail
          mkdir -p build/sgpt-m87-source-regime
          python3 tools/validate_sgpt_m87_external_evidence.py \
            --selftest \
            --receipt build/sgpt-m87-source-regime/external-evidence-receipt.json
          python3 -m json.tool data/evidence/m87/source_state_evidence.v1.json >/dev/null
          python3 -m json.tool data/evidence/m87/data_custody_metadata.v1.json >/dev/null

      - name: Execute bounded source-regime evaluation
        run: |
          set -euo pipefail
          python3 tools/evaluate_sgpt_m87_source_regimes.py \
            --receipt build/sgpt-m87-source-regime/regime-receipt.json
          python3 -m json.tool build/sgpt-m87-source-regime/regime-receipt.json >/dev/null

      - name: Evaluate process-timescale readiness without inventing rates
        run: |
          set -euo pipefail
          python3 tools/evaluate_sgpt_m87_timescale_readiness.py \
            --receipt build/sgpt-m87-source-regime/timescale-readiness-receipt.json
          python3 -m json.tool build/sgpt-m87-source-regime/timescale-readiness-receipt.json >/dev/null
          python3 -m py_compile \
            tools/evaluate_sgpt_m87_source_regimes.py \
            tools/evaluate_sgpt_m87_timescale_readiness.py \
            tools/validate_sgpt_m87_external_evidence.py

      - name: Assert bounded conclusions and evidence ceiling
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('build/sgpt-m87-source-regime/external-evidence-receipt.json').read_text())
          r=json.loads(Path('build/sgpt-m87-source-regime/regime-receipt.json').read_text())
          t=json.loads(Path('build/sgpt-m87-source-regime/timescale-readiness-receipt.json').read_text())
          assert e['status']=='PASS_EXTERNAL_EVIDENCE_PREFLIGHT_PARTIAL_WITH_SOURCE_ANOMALY'
          assert e['raw_VLBI_byte_custody']=='TOKEN_VAZIO_PROVIDER_ACCESS_BARRIER'
          assert e['file_level_sha256']=='TOKEN_VAZIO'
          assert e['MWL_parse_ready'] is False
          assert e['likelihood_ready'] is False
          assert e['claim_allowed'] is False
          assert 'silent-repair-upstream-csv' in e['rejected_illegal_mutations']
          assert r['status']=='PARTIAL_REGIME_EXECUTION_EVIDENCE_BOUND'
          assert r['regimes']['ionized_plasma']['state']=='APPLICABLE'
          assert r['regimes']['MAD_reconnection']['state']=='APPLICABLE'
          assert r['regimes']['electron_degenerate']['state']=='OUT_OF_DOMAIN'
          assert r['regimes']['pycnonuclear']['state']=='OUT_OF_DOMAIN'
          assert r['regimes']['spin_Landau_QED']['state']=='OUT_OF_DOMAIN'
          assert r['regimes']['pair_relevant']['state']=='TOKEN_VAZIO'
          assert r['regimes']['electron_capture']['state']=='TOKEN_VAZIO'
          assert r['regimes']['nuclear_network']['state']=='TOKEN_VAZIO'
          assert r['scientific_boundaries']['claim_allowed'] is False
          assert r['scientific_boundaries']['SGPT_validated'] is False
          assert t['status']=='PASS_TIMESCALE_READINESS_NO_PROCESS_RATE_PROMOTION'
          assert t['Da_i_execution'].startswith('TOKEN_VAZIO')
          assert t['process_readiness']['reconnection']['tau_filled'] is False
          assert t['process_readiness']['pair_creation']['tau_filled'] is False
          assert t['process_readiness']['nuclear']['tau_filled'] is False
          assert t['G4_baseline']=='TOKEN_VAZIO'
          assert t['claim_allowed'] is False
          PY

      - name: Preserve bounded evidence receipts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sgpt-m87-source-regime-${{ github.run_id }}
          path: build/sgpt-m87-source-regime/
          if-no-files-found: error
          retention-days: 30
