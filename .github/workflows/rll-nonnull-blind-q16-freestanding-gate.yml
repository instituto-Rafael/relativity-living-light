name: RLL Non-null Q16 Freestanding Gate

on:
  push:
    branches:
      - "work/rll-nonnull-blind-q16-freestanding-v1-20260928"
      - "fix/rll-nonnull-q16-runner-v2-20260928"
    paths:
      - "core/lowlevel_runtime/c/rll_nonnull_blind_q16_freestanding.c"
      - "data/contracts/rll_nonnull_blind_q16_freestanding.v1.json"
      - "docs/science/RLL_NONNULL_BLIND_Q16_FREESTANDING_V1.md"
      - ".github/workflows/rll-nonnull-blind-q16-freestanding-gate.yml"
  pull_request:
    paths:
      - "core/lowlevel_runtime/c/rll_nonnull_blind_q16_freestanding.c"
      - "data/contracts/rll_nonnull_blind_q16_freestanding.v1.json"
      - "docs/science/RLL_NONNULL_BLIND_Q16_FREESTANDING_V1.md"
      - ".github/workflows/rll-nonnull-blind-q16-freestanding-gate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain presence
        run: |
          set -eu
          command -v clang
          command -v ld
          command -v nm
          command -v readelf
          echo "PASS_TOOLCHAIN_MINIMAL"

      - name: Static source boundary
        run: |
          set -eu
          SRC=core/lowlevel_runtime/c/rll_nonnull_blind_q16_freestanding.c
          if grep -nE '^[[:space:]]*#include' "$SRC"; then
            echo "FORBIDDEN_HOSTED_INCLUDE"
            exit 1
          fi
          if grep -nE '^[[:space:]]*extern[[:space:]]' "$SRC"; then
            echo "FORBIDDEN_EXTERNAL_DECLARATION"
            exit 1
          fi
          echo "PASS_SOURCE_BOUNDARY"

      - name: Build and execute x86_64 static ELF
        run: |
          set -eu
          SRC=core/lowlevel_runtime/c/rll_nonnull_blind_q16_freestanding.c
          mkdir -p build/non-null-q16

          clang \
            -std=c11 -O2 \
            -ffreestanding -fno-builtin -fno-stack-protector \
            -fno-unwind-tables -fno-asynchronous-unwind-tables \
            -fomit-frame-pointer -fno-pic -fno-pie -nostdlib \
            -ffunction-sections -fdata-sections \
            -c "$SRC" -o build/non-null-q16/x86_64.o

          ld -static --gc-sections -e _start \
            -o build/non-null-q16/x86_64.elf \
            build/non-null-q16/x86_64.o

          test -z "$(nm -u build/non-null-q16/x86_64.elf)"
          ! readelf -l build/non-null-q16/x86_64.elf | grep -q 'INTERP'
          ! readelf -d build/non-null-q16/x86_64.elf 2>/dev/null | grep -q 'NEEDED'

          set +e
          OUT="$(build/non-null-q16/x86_64.elf)"
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          echo "PROGRAM_RC=$RC"

          printf '%s\n' "$OUT" | grep -F 'state=PASS'
          printf '%s\n' "$OUT" | grep -F 'exact=1311,65536,19661'
          printf '%s\n' "$OUT" | grep -F 'stress=1311,65536,19661'
          printf '%s\n' "$OUT" | grep -F 'null_os=0'
          printf '%s\n' "$OUT" | grep -F 'grid_evals=1782'
          printf '%s\n' "$OUT" | grep -F 'claim_allowed=0'

          echo "PASS_X86_64_STATIC_EXECUTION"

      - name: Cross-build ARMv7 freestanding object and audit
        run: |
          set -eu
          SRC=core/lowlevel_runtime/c/rll_nonnull_blind_q16_freestanding.c

          clang \
            --target=armv7-linux-gnueabihf \
            -march=armv7-a -marm \
            -std=c11 -O2 \
            -ffreestanding -fno-builtin -fno-stack-protector \
            -fno-unwind-tables -fno-asynchronous-unwind-tables \
            -fomit-frame-pointer -fno-pic -fno-pie -nostdlib \
            -ffunction-sections -fdata-sections \
            -c "$SRC" -o build/non-null-q16/armv7.o

          test -z "$(nm -u build/non-null-q16/armv7.o)"
          ! nm -u build/non-null-q16/armv7.o | grep -q '__aeabi_'
          readelf -h build/non-null-q16/armv7.o | grep -F 'Class:' | grep -F 'ELF32'
          readelf -h build/non-null-q16/armv7.o | grep -F 'Machine:' | grep -F 'ARM'

          echo "PASS_ARMV7_FREESTANDING_OBJECT"
          echo "ARMV7_STATIC_LINK=TOKEN_VAZIO_TOOLCHAIN_LINKER"
          echo "ARMV7_PHYSICAL_EXECUTION=TOKEN_VAZIO"
