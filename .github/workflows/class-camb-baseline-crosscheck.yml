name: CLASS CAMB Baseline Crosscheck

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/crosscheck_class_camb_baselines.py"
      - "tests/test_class_camb_baseline_crosscheck_v1.py"
      - ".github/workflows/class-camb-baseline-crosscheck.yml"

permissions:
  contents: read

env:
  CLAIM_BOUNDARY: "Standard LCDM/CPL engine agreement including r_drag validates backend plumbing only; RLL perturbation claims remain blocked until explicit closure relations and independent engine implementations exist."

concurrency:
  group: class-camb-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  crosscheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install independent Boltzmann engines
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<2" \
            "pytest>=8" \
            "camb>=1.6,<2" \
            "classy>=3.3,<4"
          python - <<'PY'
          import importlib.metadata
          import numpy
          print("numpy", numpy.__version__)
          print("camb", importlib.metadata.version("camb"))
          print("classy", importlib.metadata.version("classy"))
          PY

      - name: Run structural comparator tests
        run: python -m pytest -q tests/test_class_camb_baseline_crosscheck_v1.py

      - name: Execute LCDM and CPL crosscheck
        id: engine_run
        run: |
          set +e
          python scripts/crosscheck_class_camb_baselines.py \
            --output artifacts/science/perturbations/CLASS_CAMB_BASELINE_CROSSCHECK_CURRENT.json \
            --lmax 1000
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Inspect fail-closed receipt and write checksum
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/science/perturbations/CLASS_CAMB_BASELINE_CROSSCHECK_CURRENT.json")
          if not p.is_file():
              raise SystemExit("crosscheck receipt missing")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["state"] in {"VERIFIED_BASELINE_ENGINE_CROSSCHECK_WITH_RDRAG", "TOKEN_VAZIO_ENGINE_MISMATCH"}
          assert d["claim_allowed"] is False
          assert d["publication_ready"] is False
          assert set(d["models"]) == {"lcdm", "cpl"}
          summary = {}
          for model, row in d["models"].items():
              assert "r_drag_Mpc" in row["metrics"]
              assert "rd_approximation_diagnostic" in row
              summary[model] = {
                  "pass": row["pass"],
                  "max_relative_error": {family: metrics["max_relative_error"] for family, metrics in row["metrics"].items()},
                  "rd_approximation_diagnostic": row["rd_approximation_diagnostic"],
              }
          print(json.dumps({"state": d["state"], "camb": d["models"]["lcdm"]["engines"]["CAMB"]["version"], "classy": d["models"]["lcdm"]["engines"]["CLASS"]["version"], "models": summary, "claim_allowed": False}, sort_keys=True))
          PY
          sha256sum artifacts/science/perturbations/CLASS_CAMB_BASELINE_CROSSCHECK_CURRENT.json \
            > artifacts/science/perturbations/CLASS_CAMB_BASELINE_CROSSCHECK_CURRENT.sha256

      - name: Upload compact crosscheck receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: class-camb-baseline-${{ github.run_id }}
          path: |
            artifacts/science/perturbations/CLASS_CAMB_BASELINE_CROSSCHECK_CURRENT.json
            artifacts/science/perturbations/CLASS_CAMB_BASELINE_CROSSCHECK_CURRENT.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Enforce engine agreement after receipt custody
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/science/perturbations/CLASS_CAMB_BASELINE_CROSSCHECK_CURRENT.json")
          if not p.is_file():
              raise SystemExit(4)
          d = json.loads(p.read_text(encoding="utf-8"))
          if d["state"] != "VERIFIED_BASELINE_ENGINE_CROSSCHECK_WITH_RDRAG":
              raise SystemExit(3)
          for model in d["models"]:
              if not d["models"][model]["pass"]:
                  raise SystemExit(3)
              if not d["models"][model]["metrics"]["r_drag_Mpc"]["pass"]:
                  raise SystemExit(5)
          if d["claim_allowed"] is not False or d["publication_ready"] is not False:
              raise SystemExit(6)
          PY
