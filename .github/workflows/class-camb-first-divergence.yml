name: CLASS CAMB First Divergence

on:
  pull_request:
    paths:
      - "scripts/crosscheck_class_camb_baselines.py"
      - "tests/test_class_camb_baseline_crosscheck_v1.py"
      - ".github/workflows/class-camb-first-divergence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned engine ranges
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<2" "pytest>=8" "camb>=1.6,<2" "classy>=3.3,<4"
      - name: Structural tests
        run: python -m pytest -q tests/test_class_camb_baseline_crosscheck_v1.py
      - name: Execute lmax convergence sweep
        id: compare
        continue-on-error: true
        run: |
          set +e
          rc=0
          for lmax in 700 900 1200; do
            python scripts/crosscheck_class_camb_baselines.py \
              --output "artifacts/science/perturbations/CLASS_CAMB_LMAX_${lmax}.json" \
              --lmax "$lmax"
            code=$?
            if [ "$code" -ne 0 ]; then rc="$code"; fi
          done
          exit "$rc"
      - name: Summarize lmax convergence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for lmax in (700, 900, 1200):
              p=Path(f'artifacts/science/perturbations/CLASS_CAMB_LMAX_{lmax}.json')
              if not p.exists():
                  raise SystemExit(f'receipt missing for lmax={lmax}')
              d=json.loads(p.read_text())
              print('lmax=', lmax, 'state=', d['state'])
              for model, md in d['models'].items():
                  metric=md['metrics']['Cl_TT_dimensionless']
                  worst=max(metric['points'], key=lambda x:x['relative_error'])
                  print(model, 'TT pass=',metric['pass'], 'max_rel=',metric['max_relative_error'], 'worst=',worst)
          PY
      - name: Upload convergence receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: class-camb-lmax-convergence-${{ github.run_id }}
          path: artifacts/science/perturbations/CLASS_CAMB_LMAX_*.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce high-margin comparison fail-closed
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/science/perturbations/CLASS_CAMB_LMAX_1200.json').read_text())
          if d['state'] != 'VERIFIED_BASELINE_ENGINE_CROSSCHECK':
              raise SystemExit(3)
          PY
