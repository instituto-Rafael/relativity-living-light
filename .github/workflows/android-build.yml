name: Android Build

on:
  push:
    paths:
      - 'app/**'
      - 'core/lowlevel_runtime/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'scripts/bootstrap-gradle-wrapper.sh'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'core/lowlevel_runtime/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'scripts/bootstrap-gradle-wrapper.sh'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_COMPILE_SDK: '35'
      ANDROID_NDK_VERSION: '27.2.12479018'
      ANDROID_CMAKE_VERSION: '3.22.1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Generate Gradle Wrapper JAR
        run: scripts/bootstrap-gradle-wrapper.sh

      - name: Build debug unsigned APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleValidationUnsigned

      - name: Decode release keystore
        if: ${{ secrets.RLL_RELEASE_KEYSTORE_BASE64 != '' && secrets.RLL_RELEASE_STORE_PASSWORD != '' && secrets.RLL_RELEASE_KEY_ALIAS != '' && secrets.RLL_RELEASE_KEY_PASSWORD != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/rll-signing"
          printf '%s' "${{ secrets.RLL_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/rll-signing/release.jks"

      - name: Build signed release APK and AAB
        if: ${{ secrets.RLL_RELEASE_KEYSTORE_BASE64 != '' && secrets.RLL_RELEASE_STORE_PASSWORD != '' && secrets.RLL_RELEASE_KEY_ALIAS != '' && secrets.RLL_RELEASE_KEY_PASSWORD != '' }}
        env:
          RLL_RELEASE_STORE_FILE: ${{ runner.temp }}/rll-signing/release.jks
          RLL_RELEASE_STORE_PASSWORD: ${{ secrets.RLL_RELEASE_STORE_PASSWORD }}
          RLL_RELEASE_KEY_ALIAS: ${{ secrets.RLL_RELEASE_KEY_ALIAS }}
          RLL_RELEASE_KEY_PASSWORD: ${{ secrets.RLL_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rll-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload validation unsigned APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rll-validation-unsigned-apk
          path: app/build/outputs/apk/validationUnsigned/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate signed APK verification receipt
        if: ${{ secrets.RLL_RELEASE_KEYSTORE_BASE64 != '' && secrets.RLL_RELEASE_STORE_PASSWORD != '' && secrets.RLL_RELEASE_KEY_ALIAS != '' && secrets.RLL_RELEASE_KEY_PASSWORD != '' }}
        env:
          RLL_RUN_ID: ${{ github.run_id }}
          RLL_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p apk-signature-receipts
          apk_path="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk_path" > apk-signature-receipts/apksigner.txt
          sha256sum "$apk_path" > apk-signature-receipts/sha256.txt
          APK_PATH="$apk_path" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          apk = Path(os.environ["APK_PATH"])
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          cert_lines = Path("apk-signature-receipts/apksigner.txt").read_text(
              encoding="utf-8"
          ).splitlines()
          cert = {}
          for line in cert_lines:
              if "Signer #1 certificate DN:" in line:
                  cert["dn"] = line.split(":", 1)[1].strip()
              elif "Signer #1 certificate SHA-256 digest:" in line:
                  cert["sha256"] = line.split(":", 1)[1].strip()
          receipt = {
              "schema": "rll.apk-signature-receipt.v1",
              "state": "VERIFIED_BY_APKSIGNER",
              "artifact": apk.name,
              "artifact_sha256": digest,
              "certificate": cert,
              "git_commit": os.environ["RLL_COMMIT_SHA"],
              "github_run_id": os.environ["RLL_RUN_ID"],
              "claim_allowed": False,
          }
          Path("apk-signature-receipts/receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload APK signature receipt
        if: ${{ secrets.RLL_RELEASE_KEYSTORE_BASE64 != '' && secrets.RLL_RELEASE_STORE_PASSWORD != '' && secrets.RLL_RELEASE_KEY_ALIAS != '' && secrets.RLL_RELEASE_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rll-apk-signature-receipt
          path: apk-signature-receipts/
          if-no-files-found: error
          retention-days: 90

      - name: Upload signed release APK
        if: ${{ secrets.RLL_RELEASE_KEYSTORE_BASE64 != '' && secrets.RLL_RELEASE_STORE_PASSWORD != '' && secrets.RLL_RELEASE_KEY_ALIAS != '' && secrets.RLL_RELEASE_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rll-release-apk-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release AAB
        if: ${{ secrets.RLL_RELEASE_KEYSTORE_BASE64 != '' && secrets.RLL_RELEASE_STORE_PASSWORD != '' && secrets.RLL_RELEASE_KEY_ALIAS != '' && secrets.RLL_RELEASE_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rll-release-aab-signed
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
