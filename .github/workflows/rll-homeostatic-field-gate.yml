name: RLL Homeostatic Field Gate

on:
  pull_request:
    paths:
      - 'scripts/rll_homeostatic_field_gate.py'
      - 'docs/research/RLL_HOMEOSTATIC_FIELD_GATE_20260815.md'
      - 'data/evidence/rll_homeostatic_field_gate_20260815.json'
      - '.github/workflows/rll-homeostatic-field-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homeostatic-field-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deterministic self-test
        run: |
          python3 scripts/rll_homeostatic_field_gate.py --outdir artifacts/homeostatic_field_gate

      - name: Show gate summary
        run: |
          cat artifacts/homeostatic_field_gate/rll_homeostatic_field_gate_results.json

      - name: Upload gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rll-homeostatic-field-gate
          path: artifacts/homeostatic_field_gate/
