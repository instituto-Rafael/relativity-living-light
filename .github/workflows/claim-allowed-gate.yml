name: claim-allowed-gate

on:
  pull_request:
    branches: [rll/lab]
    paths:
      - 'data/**'
      - 'results/**'
      - 'docs/yml/**'
      - 'schemas/**'
      - 'src/rll/academic_false_positive_gate.py'
      - 'tools/validate_claim_allowed_gate.py'
      - 'tools/validate_academic_false_positive_gate.py'
      - 'tests/test_claim_allowed_gate.py'
      - 'tests/test_academic_false_positive_gate.py'
      - '.github/workflows/claim-allowed-gate.yml'
      - '.github/workflow-contract.yml'
  push:
    branches: [rll/lab]
    paths:
      - 'data/**'
      - 'results/**'
      - 'docs/yml/**'
      - 'schemas/**'
      - 'src/rll/academic_false_positive_gate.py'
      - 'tools/validate_claim_allowed_gate.py'
      - 'tools/validate_academic_false_positive_gate.py'
      - 'tests/test_claim_allowed_gate.py'
      - 'tests/test_academic_false_positive_gate.py'
      - '.github/workflows/claim-allowed-gate.yml'
      - '.github/workflow-contract.yml'

permissions:
  contents: read

concurrency:
  group: claim-allowed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Existing claim-boundary unit tests
        run: python -m unittest tests.test_claim_allowed_gate -v
      - name: Academic false-positive unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_academic_false_positive_gate -v
      - name: Repository structural claim gate
        run: python tools/validate_claim_allowed_gate.py
      - name: Academic false-positive claim gate
        env:
          PYTHONPATH: src
        run: python tools/validate_academic_false_positive_gate.py
