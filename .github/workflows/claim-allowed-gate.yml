name: claim-allowed-gate

on:
  pull_request:
    branches: [rll/lab]
    paths:
      - 'data/**'
      - 'results/**'
      - 'docs/yml/**'
      - 'schemas/**'
      - 'tools/validate_claim_allowed_gate.py'
      - 'tests/test_claim_allowed_gate.py'
      - '.github/workflows/claim-allowed-gate.yml'
      - '.github/workflow-contract.yml'
  push:
    branches: [rll/lab]
    paths:
      - 'data/**'
      - 'results/**'
      - 'docs/yml/**'
      - 'schemas/**'
      - 'tools/validate_claim_allowed_gate.py'
      - 'tests/test_claim_allowed_gate.py'
      - '.github/workflows/claim-allowed-gate.yml'
      - '.github/workflow-contract.yml'

permissions:
  contents: read

concurrency:
  group: claim-allowed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Unit tests
        run: python -m unittest tests.test_claim_allowed_gate -v
      - name: Repository claim gate
        run: python tools/validate_claim_allowed_gate.py
