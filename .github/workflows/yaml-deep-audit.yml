name: YAML Deep Audit — every file

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - "tools/deep_yaml_audit.py"
      - "tests/test_deep_yaml_audit.py"
      - ".github/workflows/yaml-deep-audit.yml"
  push:
    branches: [main]
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - "tools/deep_yaml_audit.py"
      - "tests/test_deep_yaml_audit.py"
      - ".github/workflows/yaml-deep-audit.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RECEIPT_DIR: artifacts/yaml-deep-audit

jobs:
  yaml-deep-audit:
    name: Parse, cross-check, and receipt every YAML/YML
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic parser dependency
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"

      - name: Audit every YAML/YML without promoting claims
        run: |
          set -euo pipefail
          python tools/deep_yaml_audit.py \
            --output-dir "$RECEIPT_DIR" \
            --fail-on none \
            2>&1 | tee "$RECEIPT_DIR.console.log"

      - name: Run focused adversarial tests
        run: python -m unittest -v tests/test_deep_yaml_audit.py

      - name: Publish audit summary
        if: always()
        run: |
          report="$RECEIPT_DIR/DEEP_YAML_AUDIT.md"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'TOKEN_VAZIO_DEEP_YAML_AUDIT_REPORT' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload complete per-file receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yaml-deep-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/yaml-deep-audit/
            artifacts/yaml-deep-audit.console.log
          if-no-files-found: error
          retention-days: 30
