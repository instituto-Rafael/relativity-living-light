name: RLL Rx Development

on:
  workflow_dispatch:
    inputs:
      note:
        description: Optional development-run note
        required: false
        default: manual governed Rx development

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rx-development:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RLL_AUTHORITY_MODE: reviewed_ci_workflow
      RX_NETWORK_PROBE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard unit tests
        run: python3 tests/test_rll_development_guard.py

      - name: Governance bundle consistency
        run: python3 tools/validate_rll_development_governance.py --strict

      - name: Promoted Rx security surface
        run: python3 tools/rll_security_surface_audit.py --strict

      - name: Governed Rx development chain
        run: python3 -m rx develop

      - name: Upload governed development artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rll-rx-development-${{ github.run_id }}
          path: |
            results/
            validacao_real/results_rx/
            validacao_real/fetched_rx/
          retention-days: '30'
          if-no-files-found: warn
