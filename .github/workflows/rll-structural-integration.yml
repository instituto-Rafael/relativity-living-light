name: RLL Structural Integration

on:
  pull_request:
    paths:
      - "src/rll/structural_integration.py"
      - "src/rll/strong_gravity_calibration.py"
      - "data/registries/rll_*integration*.json"
      - "data/registries/rll_*calibration*.json"
      - "data/registries/rll_recent_primary_sources_2026.json"
      - "tests/test_structural_integration.py"
      - "tests/test_strong_gravity_calibration.py"
      - "scripts/run_strong_gravity_calibration.py"
      - "results/strong_gravity_calibration/*.json"
      - "docs/science/RLL_OPERATIONAL_INTEGRATION_HOUSE_20260717.md"
      - "docs/science/RLL_RECENT_LITERATURE_INTEGRATION_20260717.md"
      - "docs/science/RLL_STRONG_GRAVITY_*.md"
      - ".github/workflows/rll-structural-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run structural and strong-gravity tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_structural_integration.py \
            tests/test_strong_gravity_calibration.py
      - name: Reproduce committed numeric calibration
        env:
          PYTHONPATH: src
        run: |
          python scripts/run_strong_gravity_calibration.py --output /tmp/strong_gravity_calibration.json
          diff -u \
            results/strong_gravity_calibration/session_reference_sweep_20260717.json \
            /tmp/strong_gravity_calibration.json
