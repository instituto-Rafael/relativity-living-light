name: RLL Real Data Evidence Bridge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/real/Hz_data_real.csv"
      - "data/real/cosmology/Hz_cosmic_chronometers_independent.csv"
      - "data/real/cosmology/desi_dr2_bao_primary_points.csv"
      - "data/real/desi_dr2_bao_covariance.csv"
      - "data/real/cosmology/fsigma8_growth_real.csv"
      - "data/real/CMB_shift_real.json"
      - "data/governance/RLL_EXTERNAL_EVIDENCE_REGISTRY_V1.json"
      - "data/governance/RLL_REAL_DATA_VALIDATION_CONTRACT_V2.json"
      - "data/governance/RLL_W0WA_SIGN_FALSIFIABILITY_GATE_V1.json"
      - "data/contracts/cosmology_model_family_shadow.v1.json"
      - "scripts/map_rll_to_w0wa_eff.py"
      - "tools/rll_real_data_evidence_bridge.py"
      - "tools/rll_w0wa_sign_gate.py"
      - "tests/test_rll_real_data_evidence_bridge.py"
      - "tests/test_rll_w0wa_sign_gate.py"
      - ".github/workflows/rll-real-data-evidence-bridge.yml"

permissions:
  contents: read

env:
  CANONICAL_REAL_DATA_WORKFLOW: .github/workflows/real-data-complete-execution.yml
  CLAIM_BOUNDARY: "Evidence-bridge PASS validates provenance/data contracts only; it does not validate RLL or permit a scientific superiority claim."
  DATA_BOUNDARY: "Real observational inputs only; synthetic/mock/fixture/placeholder/demo/example data cannot satisfy this workflow."

jobs:
  evidence-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest

      - name: Test evidence bridge and w0-wa sign gate
        run: |
          python -m pytest -q \
            tests/test_rll_real_data_evidence_bridge.py \
            tests/test_rll_w0wa_sign_gate.py

      - name: Materialize w0-wa sign/falsifiability receipt
        run: |
          set -euo pipefail
          python tools/rll_w0wa_sign_gate.py \
            --require-math-pass \
            --output results/audit/rll_w0wa_sign_falsifiability.json

      - name: Materialize validation receipt
        run: |
          set -euo pipefail
          python tools/rll_real_data_evidence_bridge.py \
            --require-data-ready \
            --output results/audit/rll_real_data_evidence_bridge.json
          printf '%s\n' "$CLAIM_BOUNDARY" > results/audit/CLAIM_BOUNDARY.txt
          printf '%s\n' "$DATA_BOUNDARY" > results/audit/DATA_BOUNDARY.txt

      - name: Build final checksums
        run: |
          set -euo pipefail
          (
            cd results/audit
            sha256sum \
              rll_real_data_evidence_bridge.json \
              rll_w0wa_sign_falsifiability.json \
              CLAIM_BOUNDARY.txt \
              DATA_BOUNDARY.txt > CHECKSUMS.sha256
          )

      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: rll-real-data-evidence-bridge
          path: |
            results/audit/rll_real_data_evidence_bridge.json
            results/audit/rll_w0wa_sign_falsifiability.json
            results/audit/CLAIM_BOUNDARY.txt
            results/audit/DATA_BOUNDARY.txt
            results/audit/CHECKSUMS.sha256
