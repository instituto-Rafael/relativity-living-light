name: RLL Secret Boundary Assurance

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rll-secret-boundary-assurance-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAIM_BOUNDARY: "Credential presence/authentication metadata only; no scientific, dataset-rights, or publication claim."

jobs:
  secret-boundary:
    name: External credential boundary assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Probe GitHub PAT read authority
        env:
          RLL_GITHUB_PAT: ${{ secrets.RLL_GITHUB_PAT }}
        run: python tools/rll_secret_boundary_assurance.py --mode github

      - name: Inspect Climate Engine trial credential
        env:
          CLIMATE_ENGINE_TRIAL_TOKEN: ${{ secrets.CLIMATE_ENGINE_TRIAL_TOKEN }}
        run: python tools/rll_secret_boundary_assurance.py --mode climate

      - name: Finalize fail-closed credential receipt
        run: python tools/rll_secret_boundary_assurance.py --mode finalize --enforce

      - name: Upload sanitized credential receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rll-secret-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/secret-boundary-assurance/
          retention-days: 30
          if-no-files-found: error
