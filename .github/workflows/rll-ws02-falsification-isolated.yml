# Isolated, fail-closed falsification. No raw observation upload or secret access.
# This workflow cannot promote a scientific claim or merge a branch.
name: RLL WS02 focused real-source falsifiers
on:
  push:
    branches:
      - work/rll-ws02-desi-order-nobs-falsifier-20261117-v1
    paths:
      - .github/workflows/rll-ws02-falsification-isolated.yml
      - src/rll/desi_dr2_authority_v1.py
      - data/pipelines/structure_d/joint_real_likelihood.py
      - tests/test_desi_dr2_authority_v1.py
      - tests/test_joint_real_likelihood.py
      - tests/test_rll_observational_arithmetic_v1.py
      - data/governance/RLL_WS02_INDEX_DECIMAL_ADVERSARIAL_RECEIPT_20261117_S3.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rll-ws02-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-real-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch commit (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: "3.11"
      - name: Install focused runtime dependencies only
        run: python -m pip install "numpy>=1.25" "scipy>=1.11" "pandas>=2.0" pytest
      - name: Compile source and tests (no cosmological refit)
        run: python -m compileall -q src/rll/desi_dr2_authority_v1.py data/pipelines/structure_d/joint_real_likelihood.py tests/test_desi_dr2_authority_v1.py tests/test_rll_observational_arithmetic_v1.py
      - name: Execute source-bound, negative and existing regression tests
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/rll-ws02-focused
          python -m pytest -q tests/test_desi_dr2_authority_v1.py tests/test_joint_real_likelihood.py tests/test_rll_observational_arithmetic_v1.py \
            --junitxml=artifacts/rll-ws02-focused/junit.xml \
            > artifacts/rll-ws02-focused/pytest.log 2>&1
          rc=$?
          cat artifacts/rll-ws02-focused/pytest.log
          printf "%s\n" "$rc" > artifacts/rll-ws02-focused/exitcode.txt
          exit "$rc"
      - name: Write scoped evidence and SHA-256 receipt even on failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/rll-ws02-focused
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          paths = [
              "data/real/desi_dr2_bao_covariance.csv",
              "data/real/cosmology/desi_dr2_bao_primary_points.csv",
              "data/real/cosmology/Hz_cosmic_chronometers_independent.csv",
              "data/real/cosmology/fsigma8_growth_real.csv",
              "data/real/CMB_shift_real.json",
              "src/rll/desi_dr2_authority_v1.py",
              "data/pipelines/structure_d/joint_real_likelihood.py",
              "tests/test_desi_dr2_authority_v1.py"
          ]
          state = {}
          for p in paths:
              f = Path(p)
              state[p] = hashlib.sha256(f.read_bytes()).hexdigest() if f.is_file() else "TOKEN_VAZIO_MISSING_SOURCE"
          exitcode_file = Path("artifacts/rll-ws02-focused/exitcode.txt")
          exitcode = exitcode_file.read_text().strip() if exitcode_file.is_file() else "TOKEN_VAZIO_NOT_RUN"
          r = {
              "schema": "rll.ws02.focused.github_action.receipt.v1",
              "sha": os.environ["GITHUB_SHA"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "trigger": os.environ["GITHUB_EVENT_NAME"],
              "test_exit_code": exitcode,
              "test_state": "PASS_SCOPED_ONLY" if exitcode == "0" else ("FAIL" if exitcode != "TOKEN_VAZIO_NOT_RUN" else "NOT_RUN"),
              "sha256": state,
              "class_RLL": "NOT_RUN",
              "camb_RLL": "NOT_RUN",
              "joint_refit": "NOT_RUN",
              "claim_allowed": False,
              "rollback": "append-only successor; preserve original data"
          }
          Path("artifacts/rll-ws02-focused/receipt.json").write_text(json.dumps(r, indent=2, sort_keys=True)+"\n")
          print(json.dumps({"exact_head": r["sha"], "test_state": r["test_state"], "claim_allowed": False}))
          PY
      - name: Upload only test receipt, junit and log; never observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rll-ws02-falsification-${{ github.sha }}
          path: artifacts/rll-ws02-focused/
          if-no-files-found: warn
          retention-days: 14
      - name: Generate metadata-only deterministic inventory and check reproducibility
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_six_sigma_real_data_controls.py
          python tools/docs_inventory.py
          python tools/docs_inventory.py --check
          mkdir -p artifacts/rll-ws02-focused
          git diff --numstat -- docs/DOCUMENTATION_FULL_INVENTORY.md docs/REAL_NUMBERS_REPORT.md docs/YML_WORKFLOWS_INDEX.md data/results/repo_inventory.json data/results/repo_inventory.tsv data/results/repo_inventory_summary.json > artifacts/rll-ws02-focused/inventory_delta_numstat.tsv
          cat data/results/repo_inventory_summary.json
          echo "INVENTORY_GENERATED_NOT_COMMITTED; claim_allowed=false"
      - name: Upload generated inventory metadata (not observational datasets)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rll-ws02-inventory-${{ github.sha }}
          path: |
            docs/DOCUMENTATION_FULL_INVENTORY.md
            docs/REAL_NUMBERS_REPORT.md
            docs/YML_WORKFLOWS_INDEX.md
            data/results/repo_inventory.json
            data/results/repo_inventory.tsv
            data/results/repo_inventory_summary.json
            artifacts/rll-ws02-focused/inventory_delta_numstat.tsv
          if-no-files-found: error
          retention-days: 14
