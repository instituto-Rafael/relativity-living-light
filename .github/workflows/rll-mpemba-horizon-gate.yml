# KNOWS_BY_ON_FIRST_LINE: bounded strong-gravity falsifiability gate; no scientific promotion.
name: RLL Mpemba Horizon Gate

"on":
  pull_request:
    paths: &mpemba_paths
      - "data/pipelines/strong_gravity/mpemba_horizon_falsifier.py"
      - "data/contracts/mpemba_horizon_falsifier.v1.json"
      - "tests/strong_gravity/test_mpemba_horizon_falsifier.py"
      - "docs/RLL_MPEMBA_HORIZON_ATLAS.md"
      - "FALSIFIABILITY_PROTOCOL.md"
      - ".github/workflow-contract.yml"
      - ".github/workflows/rll-mpemba-horizon-gate.yml"
  push:
    branches: [rll/lab, rll/integration, rll/release, main]
    paths: *mpemba_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mpemba-horizon-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable PR snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Unit falsifiers
        run: python -m unittest tests.strong_gravity.test_mpemba_horizon_falsifier -v

      - name: Materialize deterministic bounded baseline
        run: |
          set -euo pipefail
          mkdir -p artifacts/strong-gravity
          python data/pipelines/strong_gravity/mpemba_horizon_falsifier.py > artifacts/strong-gravity/rll_mpemba_horizon_gate.json

      - name: Fail closed on epistemic boundary regression
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("artifacts/strong-gravity/rll_mpemba_horizon_gate.json").read_text())
          assert data["decision"] == "BOUNDED_PASS"
          assert data["global_scientific_claim_allowed"] is False
          claims = {item["id"]: item for item in data["claim_ledger"]}
          assert claims["BH-MP-04"]["state"] == "FALSIFIED_BY_CAUSAL_BOUNDARY"
          assert claims["BH-MP-06"]["state"] == "TOKEN_VAZIO"
          assert claims["BH-MP-08"]["state"] == "TOKEN_VAZIO"
          assert data["synthetic_relaxation"]["astrophysical_evidence"] is False
          print("RLL Mpemba horizon claim boundary: PASS")
          PY
