# Auxiliary real-data workflow. Canonical policy: .github/workflows/real-data-complete-execution.yml
name: Validacao Real RLL
on:
  push:
    branches:
      - main
    paths:
      - "rx/**"
      - "validacao_real/**"
      - "tools/rx_*.py"
      - "tools/validate_executable_entrypoint_authority_registry.py"
      - "tools/validate_validacao_real_serialization_parity.py"
      - "tools/validate_validacao_real_zero_dependency.py"
      - "tools/validate_rll_development_governance.py"
      - "tools/rll_security_surface_audit.py"
      - "internal/governance/**"
      - "data/governance/RLL_DEVELOPMENT_SECURITY_ENVELOPE_V1.json"
      - "data/governance/RLL_DATA_USE_PURPOSE_REGISTRY_V1.json"
      - "data/governance/RLL_EXECUTABLE_ENTRYPOINT_AUTHORITY_REGISTRY_V1.json"
      - "configs/rx_physics_contracts.json"
      - "data/pipelines/structure_d/joint_real_likelihood_rx.py"
      - "data/pipelines/structure_d/__init__.py"
      - ".github/workflows/validacao_real.yml"
  workflow_dispatch:
    inputs:
      note:
        description: Optional note for this run
        required: false
        default: manual validation run
      commit_results:
        description: Commit validation outputs back to the repository (explicit opt-in).
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Rx CLI status
      run: python3 -m rx status
    - name: Rx no-AI runtime gate
      run: python3 tools/rx_no_ai_gate.py
    - name: Rx zero-dependency static gate
      run: python3 tools/rx_zero_dependency_gate.py
    - name: Rx deterministic selftest
      run: python3 tools/rx_selftest.py
    - name: Rx sound-horizon reference gate
      run: python3 tools/rx_sound_horizon_selftest.py
    - name: Rx freestanding65 parity gate
      run: python3 tools/rx_freestanding65_parity.py
    - name: Validate development security guard
      run: python3 tests/test_rll_development_guard.py
    - name: Enforce Rx operation contract
      run: python3 internal/governance/development_guard.py --operation validacao_real/rx_operation.json --authority-mode reviewed_ci_workflow --strict
    - name: Validate governance bundle consistency
      run: python3 tools/validate_rll_development_governance.py --strict
    - name: Validate executable entrypoint authority registry
      run: python3 tools/validate_executable_entrypoint_authority_registry.py
    - name: Validate legacy YAML-to-JSON serialization parity
      run: python3 tools/validate_validacao_real_serialization_parity.py
    - name: Validate legacy validacao_real zero dependency core
      run: python3 tools/validate_validacao_real_zero_dependency.py
    - name: Audit governed Python security surface
      run: python3 tools/rll_security_surface_audit.py --strict
    - name: Legacy validacao_real compatibility route (zero third-party)
      env:
        RLL_LEGACY_NETWORK_PROBE: "0"
      run: |
        python3 -m validacao_real.fetch_real_data
        python3 -m validacao_real.compute_validation
        python3 -m validacao_real.make_figures
        python3 -m validacao_real.render_report
    - name: Rx zero-dependency validation pipeline
      env:
        RLL_AUTHORITY_MODE: reviewed_ci_workflow
        RX_NETWORK_PROBE: "0"
      run: python3 -m validacao_real.run_rx_pipeline
    - name: Rx multiprobe validation
      run: python3 -m validacao_real.run_rx_multiprobe
    - name: Structure-D Rx zero-dependency successor
      run: python3 -m data.pipelines.structure_d.joint_real_likelihood_rx
    - name: Check fallback provenance boundary
      run: |
        set -euo pipefail
        python - <<'PY'
        import json
        from pathlib import Path
        manifest = json.loads(Path('validacao_real/fetched_rx/manifest.json').read_text(encoding='utf-8'))
        boundary = manifest.get('claim_boundary', '')
        required = [
            'does not validate RLL',
            'does not prove superiority',
            'does not replace a full likelihood',
        ]
        missing = [term for term in required if term not in boundary]
        if missing:
            raise SystemExit(f'missing fallback claim-boundary terms: {missing}')
        for row in manifest.get('sources', []):
            if row.get('fallback_state') != 'committed_local_payload_not_fresh_remote_download':
                raise SystemExit(f"missing fallback_state for {row.get('source_id')}: {row.get('fallback_state')}")
            if 'claim_boundary' not in row:
                raise SystemExit(f"missing per-source claim boundary for {row.get('source_id')}")
        print('validacao_real fallback provenance boundary OK')
        PY
    - name: Rx cross-runtime semantic parity ledger
      run: python3 tools/rx_semantic_parity.py
    - name: Audit remaining Python external imports
      run: python3 tools/rx_dependency_audit.py
    - name: Build typed dependency migration plan
      run: python3 tools/rx_dependency_migration_plan.py
    - name: Rx aggregate development gate
      run: python3 tools/rx_development_gate.py
    - name: Build artifact checksums
      run: |
        set -euo pipefail
        {
          find validacao_real/fetched_rx validacao_real/results_rx -type f -print0
          find results -maxdepth 1 -type f \( -name 'rx_*.json' -o -name 'rx_*.md' \) -print0
        } | sort -z | xargs -0 -r sha256sum > validacao_real/results_rx/CHECKSUMS.sha256
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: validacao-real-artifacts
        path: |
          validacao_real/fetched_rx/
          validacao_real/results_rx/
          results/structure_d/joint_real_likelihood_rx.json
          results/structure_d/joint_real_likelihood_rx.csv
          results/structure_d/joint_real_likelihood_rx_manifest.json
          results/rx_no_ai_runtime_gate.json
          results/rx_zero_dependency_gate.json
          results/rx_dependency_audit.json
          results/rx_dependency_audit.md
          results/rx_dependency_migration_plan.json
          results/rx_dependency_migration_plan.md
          results/security_surface_audit.json
          results/security_surface_audit.md
          results/development_governance_validation.json
          results/development_governance_validation.md
          results/executable_entrypoint_authority_registry_validation.json
          results/validacao_real_serialization_parity.json
          results/validacao_real_zero_dependency_core.json
          validacao_real/fetched/
          validacao_real/results/
          results/rx_semantic_parity.json
          results/rx_semantic_parity.md
          results/rx_selftest.json
          results/rx_sound_horizon_selftest.json
          results/rx_freestanding65_parity.json
          results/rx_development_gate.json
          results/rx_development_gate.md
        retention-days: '30'
        if-no-files-found: warn
    - name: Finalize canonical real-data policy checksums
      if: always()
      run: |
        set -euo pipefail
        ARTIFACT_DIR="artifacts/workflow-policy/validacao_real/${GITHUB_JOB}"
        mkdir -p "$ARTIFACT_DIR"
        . tools/ci/real_data_workflow_policy.sh
        rll_real_data_write_claim_boundary "$ARTIFACT_DIR"
        rll_real_data_assert_boundary_file "$ARTIFACT_DIR/CLAIM_BOUNDARY.md"
        rll_real_data_write_checksums "$ARTIFACT_DIR"
    env:
      CANONICAL_REAL_DATA_WORKFLOW: .github/workflows/real-data-complete-execution.yml
      CLAIM_BOUNDARY: Auxiliary real-data workflow only; no RLL/cosmology/superiority claim and no synthetic, mock, fixture, demo, example, or placeholder promotion beyond explicit run checks.
  commit-results:
    needs: validate
    if: ${{ inputs.commit_results }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Checkout for explicit opt-in commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Download validation artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: validacao-real-artifacts
        path: .
    - name: Commit results back to repo only by explicit opt-in
      run: |
        set -euo pipefail
        case "${GITHUB_REF_NAME}" in
          main|rll/release)
            echo "Direct commit to protected promotion branch is forbidden."
            exit 1
            ;;
        esac
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add validacao_real/fetched_rx validacao_real/results_rx results/structure_d/joint_real_likelihood_rx.json results/structure_d/joint_real_likelihood_rx.csv results/structure_d/joint_real_likelihood_rx_manifest.json results/rx_no_ai_runtime_gate.json results/rx_zero_dependency_gate.json results/rx_dependency_audit.json results/rx_dependency_audit.md results/rx_dependency_migration_plan.json results/rx_dependency_migration_plan.md results/rx_semantic_parity.json results/rx_semantic_parity.md results/rx_selftest.json results/rx_sound_horizon_selftest.json results/rx_freestanding65_parity.json results/rx_development_gate.json results/rx_development_gate.md
        if git diff --cached --quiet; then
          echo "nothing to commit"
          exit 0
        fi
        git commit -m "validacao_real: automated opt-in run ${GITHUB_RUN_NUMBER}"
        git push
    - name: Finalize canonical real-data policy checksums
      if: always()
      run: |
        set -euo pipefail
        ARTIFACT_DIR="artifacts/workflow-policy/validacao_real/${GITHUB_JOB}"
        mkdir -p "$ARTIFACT_DIR"
        . tools/ci/real_data_workflow_policy.sh
        rll_real_data_write_claim_boundary "$ARTIFACT_DIR"
        rll_real_data_assert_boundary_file "$ARTIFACT_DIR/CLAIM_BOUNDARY.md"
        rll_real_data_write_checksums "$ARTIFACT_DIR"
    - name: Upload canonical real-data policy artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: validacao_real-policy-${{ github.run_id }}-${{ github.job }}
        path: artifacts/workflow-policy/validacao_real/${{ github.job }}/
        retention-days: '14'
    env:
      CANONICAL_REAL_DATA_WORKFLOW: .github/workflows/real-data-complete-execution.yml
      CLAIM_BOUNDARY: Auxiliary real-data workflow only; no RLL/cosmology/superiority claim and no synthetic, mock, fixture, demo, example, or placeholder promotion beyond explicit run checks.
