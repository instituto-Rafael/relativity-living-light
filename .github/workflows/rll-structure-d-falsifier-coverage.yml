name: RLL Structure-D Falsifier Coverage V1

on:
  pull_request:
    paths:
      - "data/pipelines/structure_d/datasets_config.json"
      - "data/pipelines/structure_d/run_all_real.py"
      - "data/pipelines/structure_d/joint_real_likelihood.py"
      - "data/real/Hz_data_real.csv"
      - "data/real/CMB_shift_real.json"
      - "data/real/cosmology/**"
      - "tools/rll_structure_d_falsifier_coverage.py"
      - "tests/test_rll_structure_d_falsifier_coverage.py"
      - ".github/workflows/rll-structure-d-falsifier-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  falsifier-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup deterministic Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # pinned
        with:
          python-version: "3.11"

      - name: Install bounded scientific runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy pandas scipy pytest

      - name: Run focused falsifier tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_rll_structure_d_falsifier_coverage.py

      - name: Materialize coverage receipt
        run: |
          set -euo pipefail
          python tools/rll_structure_d_falsifier_coverage.py \
            --output artifacts/structure-d-falsifier-coverage/receipt.json
          test -s artifacts/structure-d-falsifier-coverage/receipt.json

      - name: Prove legacy full-profile claim route remains fail-closed
        run: |
          set +e
          python tools/rll_structure_d_falsifier_coverage.py \
            --strict-legacy \
            --output artifacts/structure-d-falsifier-coverage/strict-legacy-receipt.json
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "expected strict legacy coverage gate to exit 3 while known dataset-consumption gap exists; got $code"
            exit 1
          fi
          echo "PASS: strict legacy full-profile route is explicitly blocked by the known coverage gap."

      - name: Upload falsifier receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rll-structure-d-falsifier-coverage-${{ github.run_id }}
          path: artifacts/structure-d-falsifier-coverage/
          retention-days: 30
          if-no-files-found: error
