name: RLL Human Societal Science Gate V1

"on":
  pull_request:
  push:
    branches: [main]

concurrency:
  group: rll-human-societal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  human-societal-science-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate RLL human societal science gate
        run: python3 tools/validate_rll_human_societal_gate.py
