name: RLL chronological evidence
on:
  pull_request:
    paths:
      - 'tools/rll_age_gate.py'
      - 'data/chronology/oldest_gc_v1.json'
      - 'tests/test_rll_age_gate.py'
      - '.github/workflows/rll-age-gate.yml'
      - 'src/rll/cosmology_radiation.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rll-age-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_rll_age_gate.py
      - run: python3 -m tools.rll_age_gate > rll-age.json
      - uses: actions/upload-artifact@v7
        with:
          name: rll-age-${{ github.sha }}
          path: rll-age.json
          if-no-files-found: error
