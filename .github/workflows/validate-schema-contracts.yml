name: Validate Schema Contracts

on:
  pull_request:
    paths:
      - "schemas/**"
      - "data/epistemic_void/**"
      - "data/omega_operational/**"
      - "data/knowledge_forest/**"
      - "data/contracts/fase29_integrity_lenses.v1.json"
      - "data/contracts/rll_falsifier_bundle.json"
      - "data/contracts/dataset_rights_manifest.json"
      - "data/contracts/cross_domain_equation_intake.v1.json"
      - "results/state_transition_ledger.jsonl"
      - "docs/science/CAMPO_ENTROPICO_TOKEN_VAZIO.md"
      - "docs/science/RLL_CROSS_DOMAIN_EQUATION_RISK_ASSESSMENT.md"
      - "docs/science/RLL_CROSS_DOMAIN_EQUATION_INTAKE.md"
      - "docs/architecture/31_OMEGA7_OPERATIONAL_INVARIANT.md"
      - "docs/architecture/32_RLL_OMEGA_ROUTE_FOREST.md"
      - "docs/architecture/33_FASE29_LEDGER_DIREITOS_FALSIFICADORES.md"
      - "fixtures/ambient_field_observation.example.json"
      - "fixtures/rmrcti_delta_p_observation.example.json"
      - "fixtures/rll_run_manifest.partial.example.json"
      - "src/rll/scientific_infinity.py"
      - "scripts/validate_omega_schemas.py"
      - "scripts/validate_semantic_governance_schemas.py"
      - "scripts/validate_information_evolution_trace.py"
      - "scripts/validate_scientific_infinity_cycle.py"
      - "scripts/validate_ambient_field_observation.py"
      - "scripts/validate_rmrcti_delta_p_observation.py"
      - "tools/validate_schemas_claim_boundary.py"
      - "tools/validate_epistemic_void.py"
      - "tools/validate_cross_domain_equation_intake.py"
      - "tools/validate_omega7_operational.py"
      - "tools/build_rll_route_forest.py"
      - "tools/build_rll_route_forest_effective.py"
      - "tools/rll_route_forest_snapshot.py"
      - "tools/validate_fase29_integrity.py"
      - "tests/test_schemas_claim_boundary.py"
      - "tests/test_semantic_governance_schemas.py"
      - "tests/test_information_evolution_trace.py"
      - "tests/test_scientific_infinity.py"
      - "tests/test_rll_run_manifest_schema.py"
      - "tests/test_epistemic_void.py"
      - "tests/test_cross_domain_equation_intake.py"
      - "tests/test_omega7_operational.py"
      - "tests/test_rll_route_forest.py"
      - "tests/test_rll_route_forest_effective_cli.py"
      - "tests/test_fase29_integrity.py"
      - ".github/workflows/validate-schema-contracts.yml"
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "data/epistemic_void/**"
      - "data/omega_operational/**"
      - "data/knowledge_forest/**"
      - "data/contracts/fase29_integrity_lenses.v1.json"
      - "data/contracts/rll_falsifier_bundle.json"
      - "data/contracts/dataset_rights_manifest.json"
      - "data/contracts/cross_domain_equation_intake.v1.json"
      - "results/state_transition_ledger.jsonl"
      - "docs/science/CAMPO_ENTROPICO_TOKEN_VAZIO.md"
      - "docs/science/RLL_CROSS_DOMAIN_EQUATION_RISK_ASSESSMENT.md"
      - "docs/science/RLL_CROSS_DOMAIN_EQUATION_INTAKE.md"
      - "docs/architecture/31_OMEGA7_OPERATIONAL_INVARIANT.md"
      - "docs/architecture/32_RLL_OMEGA_ROUTE_FOREST.md"
      - "docs/architecture/33_FASE29_LEDGER_DIREITOS_FALSIFICADORES.md"
      - "fixtures/ambient_field_observation.example.json"
      - "fixtures/rmrcti_delta_p_observation.example.json"
      - "fixtures/rll_run_manifest.partial.example.json"
      - "src/rll/scientific_infinity.py"
      - "scripts/validate_omega_schemas.py"
      - "scripts/validate_semantic_governance_schemas.py"
      - "scripts/validate_information_evolution_trace.py"
      - "scripts/validate_scientific_infinity_cycle.py"
      - "scripts/validate_ambient_field_observation.py"
      - "scripts/validate_rmrcti_delta_p_observation.py"
      - "tools/validate_schemas_claim_boundary.py"
      - "tools/validate_epistemic_void.py"
      - "tools/validate_cross_domain_equation_intake.py"
      - "tools/validate_omega7_operational.py"
      - "tools/build_rll_route_forest.py"
      - "tools/build_rll_route_forest_effective.py"
      - "tools/rll_route_forest_snapshot.py"
      - "tools/validate_fase29_integrity.py"
      - "tests/test_schemas_claim_boundary.py"
      - "tests/test_semantic_governance_schemas.py"
      - "tests/test_information_evolution_trace.py"
      - "tests/test_scientific_infinity.py"
      - "tests/test_rll_run_manifest_schema.py"
      - "tests/test_epistemic_void.py"
      - "tests/test_cross_domain_equation_intake.py"
      - "tests/test_omega7_operational.py"
      - "tests/test_rll_route_forest.py"
      - "tests/test_rll_route_forest_effective_cli.py"
      - "tests/test_fase29_integrity.py"
      - ".github/workflows/validate-schema-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-schema-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest 'jsonschema[format]'
      - name: Validate root schema claim boundaries
        run: python tools/validate_schemas_claim_boundary.py
      - name: Validate epistemic void ledger
        run: python tools/validate_epistemic_void.py --strict --write-report
      - name: Validate cross-domain equation intake quarantine
        run: python tools/validate_cross_domain_equation_intake.py --strict --write-report
      - name: Validate Omega7 operational invariant
        run: python tools/validate_omega7_operational.py --strict --write-report
      - name: Validate effective Omega route forest snapshot
        run: python tools/build_rll_route_forest_effective.py --strict --write-report
      - name: Validate FASE 29 thirty-lens integrity
        run: python tools/validate_fase29_integrity.py --strict --write-report
      - name: Validate RAFAELIA Omega schema layer
        run: python scripts/validate_omega_schemas.py
      - name: Validate information evolution custody trace
        run: python scripts/validate_information_evolution_trace.py
      - name: Validate scientific infinity finite-cycle contract
        run: python scripts/validate_scientific_infinity_cycle.py
      - name: Validate semantic-governance 7D schema layer
        run: python scripts/validate_semantic_governance_schemas.py
      - name: Validate ambient-field observation contract
        run: python scripts/validate_ambient_field_observation.py
      - name: Validate RMRCTI Delta-P observation contract
        run: python scripts/validate_rmrcti_delta_p_observation.py
      - name: Run schema validator tests
        env:
          PYTHONPATH: src:.
        run: >-
          python -m pytest -q
          tests/test_schemas_claim_boundary.py
          tests/test_semantic_governance_schemas.py
          tests/test_information_evolution_trace.py
          tests/test_scientific_infinity.py
          tests/test_rll_run_manifest_schema.py
          tests/test_epistemic_void.py
          tests/test_cross_domain_equation_intake.py
          tests/test_omega7_operational.py
          tests/test_rll_route_forest.py
          tests/test_rll_route_forest_effective_cli.py
          tests/test_fase29_integrity.py
      - name: Upload epistemic void validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epistemic-void-${{ github.run_id }}
          path: artifacts/epistemic-void/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload cross-domain equation intake receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-domain-equation-intake-${{ github.run_id }}
          path: artifacts/cross-domain-equation-intake/
          retention-days: 30
          if-no-files-found: error
      - name: Upload Omega7 operational validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega7-operational-${{ github.run_id }}
          path: artifacts/omega7-operational/
          retention-days: 30
          if-no-files-found: error
      - name: Upload Omega route forest receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-forest-${{ github.run_id }}
          path: artifacts/route-forest/
          retention-days: 30
          if-no-files-found: error
      - name: Upload FASE 29 integrity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase29-integrity-${{ github.run_id }}
          path: artifacts/fase29-integrity/
          retention-days: 30
          if-no-files-found: error
