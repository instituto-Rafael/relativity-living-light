name: ACT DR6 Local Posterior Preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/rll_act_dr6_posterior_contract_v1.py"
      - "tests/test_rll_act_dr6_posterior_contract_v1.py"
      - ".github/workflows/act-dr6-posterior-preflight.yml"
      - ".github/workflow-contract.yml"

permissions:
  contents: read

concurrency:
  group: act-dr6-posterior-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACT_REFERENCE_URL: https://lambda.gsfc.nasa.gov/data/act/chains/lcdm/actlite_lcdm_camb.tar.gz
  CLAIM_BOUNDARY: "This preflight freezes the official ACT DR6.02 LCDM posterior configuration/reference point. It does not execute or validate a local posterior and has no RLL CMB claim effect."

jobs:
  freeze-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install bounded parser dependency
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Run posterior-contract unit tests
        run: python -m unittest -v tests.test_rll_act_dr6_posterior_contract_v1

      - name: Download and extract official ACT DR6.02 LCDM reference archive
        run: |
          set -euo pipefail
          mkdir -p .act-reference/extracted artifacts/science/act/runtime
          curl --fail --location --retry 3 --retry-delay 2 \
            --output .act-reference/actlite_lcdm_camb.tar.gz \
            "$ACT_REFERENCE_URL"
          sha256sum .act-reference/actlite_lcdm_camb.tar.gz \
            > .act-reference/actlite_lcdm_camb.tar.gz.sha256
          tar -xzf .act-reference/actlite_lcdm_camb.tar.gz -C .act-reference/extracted

      - name: Materialize sanitized real-archive parser diagnostic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          root = Path('.act-reference/extracted')
          out = Path('artifacts/science/act/runtime/ACT_DR6_POSTERIOR_PREFLIGHT_DIAGNOSTIC.json')
          yamls = sorted(root.rglob('*.yaml'))
          chains = sorted(
              p for p in root.rglob('*.txt')
              if len(p.name.rsplit('.', 2)) == 3 and p.name.rsplit('.', 2)[-2].isdigit()
          )
          configs = []
          for p in yamls:
              try:
                  d = yaml.safe_load(p.read_text(encoding='utf-8'))
              except Exception as exc:
                  configs.append({'path': str(p.relative_to(root)), 'parse_error': type(exc).__name__})
                  continue
              if not isinstance(d, dict):
                  configs.append({'path': str(p.relative_to(root)), 'top_type': type(d).__name__})
                  continue
              params = d.get('params') if isinstance(d.get('params'), dict) else {}
              configs.append({
                  'path': str(p.relative_to(root)),
                  'top_keys': sorted(map(str, d.keys())),
                  'likelihood_names': sorted(map(str, (d.get('likelihood') or {}).keys())) if isinstance(d.get('likelihood'), dict) else [],
                  'theory_names': sorted(map(str, (d.get('theory') or {}).keys())) if isinstance(d.get('theory'), dict) else [],
                  'sampler_names': sorted(map(str, (d.get('sampler') or {}).keys())) if isinstance(d.get('sampler'), dict) else [],
                  'param_names': list(map(str, params.keys())),
                  'explicit_prior_param_names': [str(k) for k, v in params.items() if isinstance(v, dict) and 'prior' in v],
                  'prior_value_types': {str(k): type(v.get('prior')).__name__ for k, v in params.items() if isinstance(v, dict) and 'prior' in v},
              })
          chain_diag = []
          for p in chains:
              comments = []
              first_data_columns = None
              with p.open('r', encoding='utf-8', errors='replace') as f:
                  for raw in f:
                      s = raw.strip()
                      if not s:
                          continue
                      if s.startswith('#') and len(comments) < 5:
                          comments.append(s[:4000])
                          continue
                      if not s.startswith('#'):
                          first_data_columns = len(s.split())
                          break
              chain_diag.append({
                  'path': str(p.relative_to(root)),
                  'first_comments': comments,
                  'first_data_columns': first_data_columns,
              })
          payload = {
              'schema': 'rll.act_dr6_posterior_preflight_diagnostic.v1',
              'claim_allowed': False,
              'publication_ready': False,
              'yaml_count': len(yamls),
              'chain_count': len(chains),
              'configs': configs,
              'chains': chain_diag,
          }
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'yaml_count': len(yamls), 'chain_count': len(chains), 'claim_allowed': False}, sort_keys=True))
          PY

      - name: Freeze official priors, MCMC controls, covariance and reference point
        id: freeze
        continue-on-error: true
        run: |
          set +e
          python tools/rll_act_dr6_posterior_contract_v1.py \
            --extracted .act-reference/extracted \
            --source-url "$ACT_REFERENCE_URL" \
            --output artifacts/science/act/runtime/ACT_DR6_LCDM_POSTERIOR_REPRODUCTION_CONTRACT_CURRENT.json \
            > .act-reference/freeze.stdout 2> .act-reference/freeze.stderr
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat .act-reference/freeze.stdout || true
          cat .act-reference/freeze.stderr >&2 || true
          exit "$code"

      - name: Validate frozen contract if materialized
        if: steps.freeze.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/science/act/runtime/ACT_DR6_LCDM_POSTERIOR_REPRODUCTION_CONTRACT_CURRENT.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["state"] == "OFFICIAL_ACT_DR6_LCDM_POSTERIOR_CONTRACT_FROZEN"
          assert d["claim_allowed"] is False
          assert d["publication_ready"] is False
          assert d["reference_chains"]["chain_file_count"] == 4
          assert d["reference_chains"]["total_noncomment_rows"] == 87427
          assert d["parameters"]["count_sampled"] > 0
          assert d["components"]["theory_names"] == ["camb"]
          assert "act_dr6_cmbonly.ACTDR6CMBonly" in d["components"]["likelihood_names"]
          assert "planck_2018_lowl.EE_sroll2" in d["components"]["likelihood_names"]
          assert d["resolved_token"] is None
          assert d["reduces_token"] == "TOKEN_VAZIO_ACT_DR6_LCDM_POSTERIOR_CHAIN_REPRODUCTION"
          assert d["local_reproduction_contract"]["must_report_local_Rminus1"] is True
          print(json.dumps({
              "sampled_parameters": d["parameters"]["sampled"],
              "mcmc_contract": d["mcmc_contract"],
              "best_observed_minuslogpost": d["reference_chains"]["best_observed_minuslogpost"],
              "claim_allowed": False,
          }, sort_keys=True))
          PY
          sha256sum \
            artifacts/science/act/runtime/ACT_DR6_LCDM_POSTERIOR_REPRODUCTION_CONTRACT_CURRENT.json \
            .act-reference/actlite_lcdm_camb.tar.gz \
            > artifacts/science/act/runtime/ACT_DR6_LCDM_POSTERIOR_REPRODUCTION_CONTRACT_CHECKSUMS.sha256

      - name: Upload preflight evidence and diagnostics even after parser failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: act-dr6-posterior-preflight-${{ github.run_id }}
          path: |
            artifacts/science/act/runtime/
            .act-reference/actlite_lcdm_camb.tar.gz.sha256
            .act-reference/freeze.stdout
            .act-reference/freeze.stderr
          if-no-files-found: error
          retention-days: 30

      - name: Enforce posterior contract after evidence custody
        if: always()
        run: |
          test "${{ steps.freeze.outcome }}" = success
          test -s artifacts/science/act/runtime/ACT_DR6_LCDM_POSTERIOR_REPRODUCTION_CONTRACT_CURRENT.json
          test -s artifacts/science/act/runtime/ACT_DR6_LCDM_POSTERIOR_REPRODUCTION_CONTRACT_CHECKSUMS.sha256
