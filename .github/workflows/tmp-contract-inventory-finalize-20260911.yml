name: Temporary contract and inventory reconciliation finalizer

on:
  push:
    branches:
      - chore/reconcile-doc-inventory-20260911
    paths:
      - .github/workflows/tmp-contract-inventory-finalize-20260911.yml

permissions:
  contents: write

concurrency:
  group: tmp-contract-inventory-finalize-20260911
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/chore/reconcile-doc-inventory-20260911'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/reconcile-doc-inventory-20260911
          persist-credentials: true

      - name: Reconcile executable workflow contract and inventory
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-contract-inventory-finalize-20260911.yml
          python3 tools/workflow_contract_sync.py --write
          python3 tools/docs_inventory.py

      - name: Commit reconciled contract and generated inventory
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             .github/workflow-contract.yml             docs/DOCUMENTATION_FULL_INVENTORY.md             docs/REAL_NUMBERS_REPORT.md             docs/YML_WORKFLOWS_INDEX.md             data/results/repo_inventory.json             data/results/repo_inventory.tsv             data/results/repo_inventory_summary.json
          git commit -m "chore: reconcile workflow contract and canonical inventory"
          git push origin HEAD:chore/reconcile-doc-inventory-20260911
