name: Real Data Complete Execution

"on":
  pull_request:
    paths:
      - "scripts/download_real_cosmology_inputs.sh"
      - "scripts/verify_pantheon_inputs.py"
      - "tools/validate_scientific_validation_orchestrator_v3.py"
      - "tools/run_g3_dataset_compatibility.py"
      - "data/contracts/rll_g3_dataset_compatibility.v1.json"
      - "artifacts/pantheon/RLL_PANTHEON_FULL_COVARIANCE_MATERIALIZATION_RECEIPT_20260819_RUN32285275333.json"
      - "tests/test_pantheon_materialization_route_v3.py"
      - "tests/test_scientific_validation_orchestrator_v3.py"
      - "tests/test_g3_dataset_compatibility.py"
      - "products/rll-evidence-runner/src/rll_evidence/pantheon_fit.py"
      - "products/rll-evidence-runner/src/rll_evidence/pantheon_fit_ascii.py"
      - "products/rll-evidence-runner/src/rll_evidence/pantheon_fit_three_model.py"
      - ".github/workflows/real-data-complete-execution.yml"
  workflow_dispatch:
    inputs:
      execution_mode:
        description: "audit_only checks registry; materialize downloads official inputs; validate runs real-data validations; full runs all."
        required: true
        default: audit_only
        type: choice
        options: [audit_only, materialize, validate, full]
      materialize_pantheon:
        description: "Download Pantheon+SH0ES official files from the public DataRelease repository."
        required: true
        default: false
        type: boolean
      run_structure_d:
        description: "Run Structure-D real validation after data checks."
        required: true
        default: false
        type: boolean
      run_pantheon_validation:
        description: "Run Pantheon+ real validation when Pantheon+ files are present."
        required: true
        default: false
        type: boolean
      strict_real_data:
        description: "Fail instead of silently fabricating data when a required real source/check is missing."
        required: true
        default: true
        type: boolean
      retention_days:
        description: "Artifact retention days."
        required: true
        default: "30"
        type: choice
        options: ["7", "14", "30", "90"]

permissions:
  contents: read

concurrency:
  group: real-data-complete-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pantheon-full-covariance-pr-gate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup deterministic Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # pinned
        with:
          python-version: "3.11"

      - name: Install bounded scientific dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy scipy

      - name: Materialize pinned Pantheon+ full covariance
        run: |
          set -euo pipefail
          mkdir -p artifacts/pantheon-full-covariance
          bash scripts/download_real_cosmology_inputs.sh | tee artifacts/pantheon-full-covariance/materialize.log

      - name: Re-run strict full-covariance verifier
        run: |
          set -euo pipefail
          python3 scripts/verify_pantheon_inputs.py \
            --require-full-covariance \
            --json > artifacts/pantheon-full-covariance/readiness.json
          cp data/real/pantheon_full_covariance_materialization_receipt.json \
            artifacts/pantheon-full-covariance/materialization_receipt.json
          cp data/real/pantheon_full_covariance_readiness.json \
            artifacts/pantheon-full-covariance/readiness_from_materializer.json

      - name: Assert G2 receipt-aware readiness
        run: |
          set -euo pipefail
          python3 tools/validate_scientific_validation_orchestrator_v3.py \
            --require-g2 --json > artifacts/pantheon-full-covariance/g2_readiness_v3.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('artifacts/pantheon-full-covariance/materialization_receipt.json').read_text())
          readiness = json.loads(Path('artifacts/pantheon-full-covariance/readiness.json').read_text())
          v3 = json.loads(Path('artifacts/pantheon-full-covariance/g2_readiness_v3.json').read_text())
          assert receipt['f_ok'] is True
          assert receipt['claim_allowed'] is False
          assert receipt['scientific_confirmation'] is False
          assert readiness['full_covariance_likelihood_ready'] is True
          assert readiness['claim_allowed'] is False
          assert v3['g2_ready'] is True
          assert v3['claim_allowed'] is False
          assert v3['scientific_confirmation'] is False
          print('G2 receipt-aware materialization VERIFIED; no scientific claim promoted')
          PY

      - name: Execute G3 DESI plus Pantheon compatibility gate
        run: |
          set -euo pipefail
          python3 tools/run_g3_dataset_compatibility.py \
            --require-pass \
            --output artifacts/pantheon-full-covariance/g3_compatibility.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          g3 = json.loads(Path('artifacts/pantheon-full-covariance/g3_compatibility.json').read_text())
          assert g3['state'] == 'PASS_LIMITED_COMPATIBILITY_BRANCH'
          assert g3['compatibility_decision']['allowed'] is True
          assert g3['claim_allowed'] is False
          assert 'TOKEN_VAZIO_INDEPENDENT_DESI_RECONSTRUCTION_ABLATION' in g3['F_gap']
          assert 'TOKEN_VAZIO_EXPLICIT_CROSS_SURVEY_COVARIANCE_MATRIX' in g3['F_gap']
          print('G3 PASS_LIMITED_COMPATIBILITY_BRANCH with residuals preserved')
          PY

      - name: Execute G4 Pantheon full-covariance fairness subgate
        env:
          PYTHONPATH: products/rll-evidence-runner/src
        run: |
          set -euo pipefail
          CATALOG='data/real/cosmology/pantheon_plus/Pantheon+_Data/4_DISTANCES_AND_COVAR/Pantheon+SH0ES.dat'
          COV='data/real/cosmology/pantheon_plus/Pantheon+_Data/4_DISTANCES_AND_COVAR/Pantheon+SH0ES_STAT+SYS.cov'
          OUT='artifacts/pantheon-full-covariance/g4_pantheon_lcdm_cpl_rll.json'
          python -m rll_evidence.pantheon_fit_three_model \
            --catalog "$CATALOG" \
            --covariance "$COV" \
            --output "$OUT" \
            --seeds 11,23,37,53,71 \
            --maxiter 250 \
            --ftol 1e-10 \
            --integration-points 4096 \
            --z-min 0.01 | tee artifacts/pantheon-full-covariance/g4_pantheon_fit.log
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/pantheon-full-covariance/g4_pantheon_lcdm_cpl_rll.json')
          result = json.loads(p.read_text())
          assert result['status'] == 'PASS_LIMITED'
          assert set(result['models']) == {'LCDM_pantheon_full', 'CPL_pantheon_full', 'RLL_pantheon_full'}
          assert result['comparison']['baseline'] == 'LCDM_pantheon_full'
          receipt = {
              'schema': 'rll.g4_pantheon_fairness_subgate.v1',
              'state': 'PASS_LIMITED_PANTHEON_FULL_COVARIANCE_FAIRNESS',
              'models': list(result['models']),
              'comparison': result['comparison'],
              'method': result['method'],
              'scientific_boundary': result['scientific_boundary'],
              'claim_allowed': False,
              'scientific_confirmation': False,
              'F_ok': result.get('F_ok', []),
              'F_gap': result.get('F_gap', []) + ['G4 overall still requires reconciliation with the DESI/H(z)/growth/CMB fair tournament before G5.'],
              'F_next': 'reconcile this Pantheon subgate with the existing four-model joint-real route under one G4 manifest',
          }
          Path('artifacts/pantheon-full-covariance/g4_pantheon_fairness_receipt.json').write_text(
              json.dumps(receipt, indent=2, ensure_ascii=False) + '\n'
          )
          print('G4 Pantheon subgate PASS_LIMITED; overall G4 not yet promoted')
          PY

      - name: Upload G2 G3 G4 evidence bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pantheon-g2-g3-g4-${{ github.run_id }}
          path: artifacts/pantheon-full-covariance/
          retention-days: 30
          if-no-files-found: error

  real-data-complete:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_DIR: artifacts/real-data-complete
      CLAIM_BOUNDARY: "No superiority claim unless real-data metrics pass predefined thresholds."
      STRUCTURE_D_PROFILE: structure_d_real_validation
      STRUCTURE_D_SEED: "42"
      STRUCTURE_D_MAXITER_LCDM: "80"
      STRUCTURE_D_MAXITER_RLL: "120"
      STRUCTURE_D_TOL: "1e-5"
      EXECUTION_MODE: ${{ inputs.execution_mode }}
      MATERIALIZE_PANTHEON: ${{ inputs.materialize_pantheon }}
      RUN_STRUCTURE_D: ${{ inputs.run_structure_d }}
      RUN_PANTHEON_VALIDATION: ${{ inputs.run_pantheon_validation }}
      STRICT_REAL_DATA: ${{ inputs.strict_real_data }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # pinned
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy matplotlib pyyaml requests jsonschema

      - name: Create run plan and five-level repository inventory
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR" "$RUN_DIR/reports" "$RUN_DIR/checks"
          cat > "$RUN_DIR/EXECUTION_PLAN.md" <<PLAN
          # Real Data Complete Execution

          - execution_mode: $EXECUTION_MODE
          - materialize_pantheon: $MATERIALIZE_PANTHEON
          - run_structure_d: $RUN_STRUCTURE_D
          - run_pantheon_validation: $RUN_PANTHEON_VALIDATION
          - strict_real_data: $STRICT_REAL_DATA
          - commit_policy: artifact_only_reviewed_pr_required
          - claim_boundary: $CLAIM_BOUNDARY

          ## Failsafe / failover / rollback
          - Never promote mock/synthetic/example/placeholder files as real data.
          - Download only from documented public primary sources.
          - Write new run artifacts under $RUN_DIR first.
          - This workflow does not push to the repository. Commit artifacts through a reviewed PR.
          - If a required real input is missing and strict mode is true, fail instead of fabricating data.
          PLAN
          find . -maxdepth 5 -type f \
            -not -path './.git/*' \
            -not -path './artifacts/*' \
            -not -path './.venv/*' \
            -print | sort > "$RUN_DIR/checks/repository_files_depth5.txt"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > "$RUN_DIR/RUN_UTC.txt"
          git rev-parse HEAD > "$RUN_DIR/COMMIT_SHA.txt"

      - name: Validate real-data registry without rewriting committed data
        run: |
          set -euo pipefail
          python - <<'PY' | tee "$RUN_DIR/reports/real_data_policy_check.log"
          from pathlib import Path
          required = [
              Path('docs/real_data/REAL_DATA_REQUIRED_INPUTS.md'),
              Path('docs/real_data/RLL_REAL_DATA_INGESTION_REPORT_2026.md'),
              Path('data/real/rll_real_sources_manifest_2026.yml'),
              Path('data/real/cosmology_observational_seed_2026.csv'),
              Path('data/real/cosmology_observational_seed_2026.provenance.json'),
              Path('data/pipelines/structure_d/datasets_config.json'),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit('missing required real-data policy files: ' + ', '.join(missing))
          text = Path('docs/real_data/REAL_DATA_REQUIRED_INPUTS.md').read_text(encoding='utf-8')
          for term in ['dado real', 'checksum', 'mock', 'synthetic', 'Pantheon+SH0ES', 'DESI DR2 BAO']:
              if term not in text:
                  raise SystemExit(f'real-data policy term missing: {term}')
          csv_text = Path('data/real/cosmology_observational_seed_2026.csv').read_text(encoding='utf-8')
          for source_id in ['cc_borghi_2021_lega_c', 'cc_jiao_2022_lega_c_full_spectrum', 'cc_tomasetti_2025_clusters', 'desi_dr2_bao_2025']:
              if source_id not in csv_text:
                  raise SystemExit(f'real-data seed row missing: {source_id}')
          print('real-data policy files, provenance files, and seed source ids OK')
          PY

      - name: Materialize Pantheon+SH0ES official inputs
        if: ${{ inputs.execution_mode == 'materialize' || inputs.execution_mode == 'full' }}
        run: |
          set -euo pipefail
          if [ "$MATERIALIZE_PANTHEON" = "true" ]; then
            bash scripts/download_real_cosmology_inputs.sh | tee "$RUN_DIR/reports/download_real_cosmology_inputs.log"
          else
            echo "Pantheon+ materialization disabled by workflow input." | tee "$RUN_DIR/reports/download_real_cosmology_inputs.log"
          fi

      - name: Verify Pantheon+ inputs with strict failover
        if: ${{ inputs.execution_mode == 'materialize' || inputs.execution_mode == 'validate' || inputs.execution_mode == 'full' }}
        run: |
          set -euo pipefail
          REQUIRE_MODE=""
          if [ "$MATERIALIZE_PANTHEON" = "true" ]; then
            REQUIRE_MODE="--require-full-covariance"
          fi
          if python scripts/verify_pantheon_inputs.py $REQUIRE_MODE --json > "$RUN_DIR/reports/pantheon_inputs.json"; then
            echo "Pantheon+ verification OK" | tee "$RUN_DIR/reports/pantheon_inputs.status"
          else
            echo "Pantheon+ verification failed or files are missing." | tee "$RUN_DIR/reports/pantheon_inputs.status"
            if [ "$STRICT_REAL_DATA" = "true" ]; then
              exit 2
            fi
            printf '%s\n' 'TOKEN_VAZIO_PANTHEON_INPUTS_NON_STRICT' > "$RUN_DIR/reports/pantheon_inputs.residual"
          fi

      - name: Run real-source signature verification and materialization audit
        run: |
          set -euo pipefail
          python tools/verify_real_source_signatures.py | tee "$RUN_DIR/reports/real_source_signature_verification.log"
          python tools/real_data_materialization_audit.py | tee "$RUN_DIR/reports/real_data_materialization_audit.log"
          for source in \
            results/audit/real_source_signature_verification.md \
            results/audit/real_data_materialization_audit.md \
            results/audit/real_data_materialization_audit.json; do
            if [ -f "$source" ]; then
              cp "$source" "$RUN_DIR/reports/"
            else
              printf 'TOKEN_VAZIO_OPTIONAL_REPORT %s\n' "$source" >> "$RUN_DIR/reports/materialization_optional_reports.residual"
            fi
          done

      - name: Package canonical real inputs for downstream pipelines
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path
          import yaml

          root = Path('.')
          artifact_root = Path('artifacts/real-data-complete/inputs')
          contract = yaml.safe_load(Path('data/real/cosmology/real_cosmology_inputs.yml').read_text(encoding='utf-8'))
          paths = {
              'data/real/rll_real_sources_manifest_2026.yml',
              'data/real/cosmology/real_cosmology_inputs.yml',
              'data/real/cosmology/real_source_signatures.json',
          }
          for entry in contract['inputs']:
              paths.add(entry['local_path'])
              if entry.get('covariance_path'):
                  paths.add(entry['covariance_path'])

          records = []
          for relative in sorted(paths):
              source = root / relative
              if not source.is_file():
                  raise SystemExit(f'canonical real input missing: {relative}')
              destination = artifact_root / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
              records.append({
                  'path': relative,
                  'artifact_path': str(destination.relative_to(Path('artifacts/real-data-complete'))),
                  'sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
              })

          manifest = {
              'schema': 'rll.canonical_real_input_artifacts.v1',
              'contract': 'data/real/cosmology/real_cosmology_inputs.yml',
              'claim_boundary': 'Input provenance only; no scientific endorsement.',
              'records': records,
          }
          (artifact_root / 'REAL_INPUTS.json').write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          PY

      - name: Run Structure-D real validation
        if: ${{ inputs.run_structure_d && (inputs.execution_mode == 'validate' || inputs.execution_mode == 'full') }}
        run: |
          set -euo pipefail
          python -m data.pipelines.structure_d.run_all_real | tee "$RUN_DIR/reports/structure_d_real_validation.log"
          for source in \
            results/structure_d/model_comparison_real.csv \
            results/structure_d/model_comparison_real_fit_metadata.json \
            results/structure_d/execution_timing_real.csv \
            results/structure_d/error_mode_usage.csv; do
            if [ -f "$source" ]; then
              cp "$source" "$RUN_DIR/reports/"
            else
              printf '%s\n' "TOKEN_VAZIO_OPTIONAL_REPORT $source" >> "$RUN_DIR/reports/structure_d_optional_reports.residual"
            fi
          done

      - name: Run Pantheon+ real validation
        if: ${{ inputs.run_pantheon_validation && (inputs.execution_mode == 'validate' || inputs.execution_mode == 'full') }}
        run: |
          set -euo pipefail
          if python scripts/run_real_pantheon_validation.py > "$RUN_DIR/reports/run_real_pantheon_validation.log" 2>&1; then
            echo "Pantheon+ real validation OK" | tee "$RUN_DIR/reports/run_real_pantheon_validation.status"
            if [ -f data/results/model_comparison.json ]; then
              cp data/results/model_comparison.json "$RUN_DIR/reports/"
            else
              printf '%s\n' 'TOKEN_VAZIO_MODEL_COMPARISON_OUTPUT' > "$RUN_DIR/reports/run_real_pantheon_validation.residual"
            fi
          else
            cat "$RUN_DIR/reports/run_real_pantheon_validation.log"
            echo "Pantheon+ real validation failed." | tee "$RUN_DIR/reports/run_real_pantheon_validation.status"
            if [ "$STRICT_REAL_DATA" = "true" ]; then
              exit 3
            fi
            printf '%s\n' 'TOKEN_VAZIO_PANTHEON_VALIDATION_NON_STRICT' > "$RUN_DIR/reports/run_real_pantheon_validation.residual"
          fi

      - name: Build final report, checksums, and rollback manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/real-data-complete')
          reports = sorted(str(path.relative_to(root)) for path in (root / 'reports').glob('*') if path.is_file())
          checks = sorted(str(path.relative_to(root)) for path in (root / 'checks').glob('*') if path.is_file())
          payload = {
              'schema': 'rll.real_data_complete_execution.v1',
              'claim_boundary': 'No superiority claim unless real-data metrics pass predefined thresholds.',
              'commit_policy': 'artifact_only_reviewed_pr_required',
              'reports': reports,
              'checks': checks,
              'failsafe': [
                  'no synthetic promotion',
                  'strict mode fails on missing required real inputs',
                  'no automatic push from this workflow',
                  'workflow artifacts preserve rollback evidence',
              ],
          }
          (root / 'MANIFEST.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          lines = [
              '# Real Data Complete Execution Report', '',
              f"Claim boundary: `{payload['claim_boundary']}`",
              f"Commit policy: `{payload['commit_policy']}`", '',
              '## Reports', *[f'- `{item}`' for item in reports], '',
              '## Checks', *[f'- `{item}`' for item in checks], '',
              '## Failsafe / failover / rollback', *[f"- {item}" for item in payload['failsafe']], '',
          ]
          (root / 'PIPELINE_REPORT.md').write_text('\n'.join(lines), encoding='utf-8')
          PY
          (cd "$RUN_DIR" && find . -type f ! -name CHECKSUMS.sha256 -print0 | sort -z | xargs -0 sha256sum) > "$RUN_DIR/CHECKSUMS.sha256"

      - name: Upload complete real-data artifact without committing
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-data-complete-${{ github.run_id }}
          path: artifacts/real-data-complete/
          retention-days: ${{ fromJSON(inputs.retention_days) }}
          if-no-files-found: warn
