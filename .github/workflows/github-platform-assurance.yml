name: GitHub Platform Assurance

on:
  pull_request:
    branches:
      - main
      - rll/release
      - rll/integration
      - rll/lab
  push:
    branches:
      - main
      - rll/release
      - rll/integration
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-platform-assurance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-capability-contract:
    name: GitHub platform capability contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up deterministic Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bounded assurance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest jsonschema

      - name: Test capability gate
        run: python -m pytest -q tests/test_github_actions_capability_gate.py

      - name: Validate workflow documentation contract
        run: python tools/validate_workflow_docs.py --strict --write-report

      - name: Validate workflow architecture invariants
        run: |
          python tools/workflow_architecture.py \
            --contract .github/workflow-architecture/invariants.v1.yml \
            --output-dir artifacts/github-platform-assurance/architecture --strict

      - name: Validate official GitHub capability model
        run: |
          python tools/github_actions_capability_gate.py \
            --strict --write-report \
            --output-dir artifacts/github-platform-assurance/capabilities

      - name: Publish assurance summary
        if: always()
        run: |
          report=artifacts/github-platform-assurance/capabilities/GITHUB_PLATFORM_ASSURANCE_REPORT.md
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'TOKEN_VAZIO_GITHUB_PLATFORM_ASSURANCE_REPORT' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload assurance receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: github-platform-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/github-platform-assurance/
            artifacts/workflow-docs/
          retention-days: 30
          if-no-files-found: error

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BASE_REF: ${{ github.base_ref }}
      RECEIPT_DIR: artifacts/dependency-review
    steps:
      - name: Review newly introduced dependencies
        id: dependency-review
        continue-on-error: ${{ github.base_ref == 'rll/lab' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

      - name: Materialize dependency review residual
        if: always()
        env:
          REVIEW_OUTCOME: ${{ steps.dependency-review.outcome }}
        run: |
          mkdir -p "$RECEIPT_DIR"
          decision=PASS
          residual=NONE
          if [[ "$REVIEW_OUTCOME" != success && "$BASE_REF" == rll/lab ]]; then
            decision=TOKEN_VAZIO_ALLOWED_IN_LAB
            residual=DEPENDENCY_GRAPH_OR_REVIEW_FAILURE
          elif [[ "$REVIEW_OUTCOME" != success ]]; then
            decision=BLOCKED_DEPENDENCY_REVIEW
            residual=DEPENDENCY_GRAPH_OR_REVIEW_FAILURE
          fi
          printf '{"schema":"rll.dependency_review.v1","base_ref":"%s","outcome":"%s","decision":"%s","residual":"%s","claim_allowed":false}\n' \
            "$BASE_REF" "$REVIEW_OUTCOME" "$decision" "$residual" > "$RECEIPT_DIR/receipt.json"
          cat "$RECEIPT_DIR/receipt.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail closed above laboratory maturity
        if: always() && steps.dependency-review.outcome != 'success' && github.base_ref != 'rll/lab'
        run: exit 1

      - name: Upload dependency review receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dependency-review/
          retention-days: 30
          if-no-files-found: error

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: /language:${{ matrix.language }}
