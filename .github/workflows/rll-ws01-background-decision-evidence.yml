name: RLL WS01 Background Decision Evidence

on:
  pull_request:
    paths:
      - "tools/rll_ws01_background_decision_evidence.py"
      - "tests/test_rll_ws01_background_decision_evidence.py"
      - "data/real/Hz_data_real.csv"
      - "data/real/cosmology/Hz_cosmic_chronometers_independent.csv"
      - ".github/workflows/rll-ws01-background-decision-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ws01-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest tests.test_rll_ws01_background_decision_evidence
      - name: Materialize receipt
        run: python tools/rll_ws01_background_decision_evidence.py --write
      - name: Assert fail-closed receipt
        run: |
          python - <<'PY'
          import json
          p="artifacts/science/background/RLL_WS01_BACKGROUND_DECISION_EVIDENCE_V1.json"
          x=json.load(open(p,encoding="utf-8"))
          assert x["claim_allowed"] is False
          assert x["decision_selected"] is False
          assert x["promotion"] == "BLOCKED"
          assert x["axis_status"]["growth_mode"] == "TOKEN_VAZIO_UNTIL_WS06"
          print(json.dumps({
            "state":x["state"],
            "max_relative_H_delta":x["omega_r_sensitivity"]["max_relative_H_delta"],
            "max_finest_crosscheck":x["distance_integration"]["max_finest_simpson_vs_trapezoid_relative"],
            "hz_overlap_count":x["hz_overlap"]["shared_redshift_count"],
            "promotion":x["promotion"],
            "claim_allowed":x["claim_allowed"],
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rll-ws01-background-decision-evidence
          path: artifacts/science/background/RLL_WS01_BACKGROUND_DECISION_EVIDENCE_V1.json
