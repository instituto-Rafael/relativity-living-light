name: "RLL | Legacy YAML Directory Router - archive audit only"

"on":
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/rll-legacy-archive-index.yml"
      - "NOVOexport/legacy-workflows/20261107/**"
      - "tools/ci/rll_warmstart_preflight_v1.py"

permissions:
  contents: read
jobs:
  verify-archived-git-blobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Follow historical directory index (not an archived YAML execution)
        run: |
          python tools/ci/rll_warmstart_preflight_v1.py --archive-only
          echo "133 original workflow blob hashes retained; old workflows stay executable" >> "$GITHUB_STEP_SUMMARY"
