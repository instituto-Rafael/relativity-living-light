name: CI Scientific Skills — Tier 1

on:
  workflow_dispatch:
    inputs:
      strict_repository_evidence:
        description: "Fail when repository result/data inputs are absent instead of preserving TOKEN_VAZIO."
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - "tools/ci_scientific_skills.py"
      - "tests/test_ci_scientific_skills.py"
      - ".github/workflows/ci-scientific-skills.yml"
      - "data/real/**"
      - "results/structure_d/**"
  push:
    branches: [main]
    paths:
      - "tools/ci_scientific_skills.py"
      - "tests/test_ci_scientific_skills.py"
      - ".github/workflows/ci-scientific-skills.yml"
      - "data/real/**"
      - "results/structure_d/**"

permissions:
  contents: read

concurrency:
  group: ci-scientific-skills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tier-1-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANONICAL_REAL_DATA_WORKFLOW: .github/workflows/real-data-complete-execution.yml
      RUN_DIR: artifacts/ci-scientific-skills
      CLAIM_BOUNDARY: >-
        Numerical method checks and repository-data diagnostics only;
        synthetic, mock, fixture, placeholder, demo or example inputs remain diagnostics only
        and cannot support real-data, physical superiority, discovery or theorem-proof claims.
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pinned-minimum test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "pytest>=8,<9"

      - name: Run deterministic unit tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_ci_scientific_skills.py

      - name: Run claim-bounded repository diagnostics
        env:
          EVENT_NAME: ${{ github.event_name }}
          STRICT_REPOSITORY_EVIDENCE: ${{ inputs.strict_repository_evidence }}
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR"
          STRICT=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$STRICT_REPOSITORY_EVIDENCE" = "true" ]; then
            STRICT="--strict"
          fi
          python tools/ci_scientific_skills.py \
            --root . \
            --output "$RUN_DIR/report.json" \
            $STRICT | tee "$RUN_DIR/run.log"

      - name: Generate receipt and checksums
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR"
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("artifacts/ci-scientific-skills")
          report_path = root / "report.json"
          report = json.loads(report_path.read_text(encoding="utf-8")) if report_path.exists() else {
              "overall_status": "TOKEN_VAZIO",
              "claim_boundary": os.environ["CLAIM_BOUNDARY"],
          }
          receipt = {
              "schema": "rll.ci_scientific_skills_receipt.v1",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "commit_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "canonical_real_data_workflow": os.environ["CANONICAL_REAL_DATA_WORKFLOW"],
              "overall_status": report.get("overall_status", "TOKEN_VAZIO"),
              "claim_boundary": report.get("claim_boundary", os.environ["CLAIM_BOUNDARY"]),
              "automatic_commit": False,
              "reviewed_pr_required": True,
          }
          (root / "RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          (cd "$RUN_DIR" && find . -type f ! -name CHECKSUMS.sha256 -print0 | sort -z | xargs -0 sha256sum) > "$RUN_DIR/CHECKSUMS.sha256"

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-scientific-skills-${{ github.run_id }}
          path: artifacts/ci-scientific-skills/
          retention-days: 30
