name: "RLL Governance Quality Gate — non-certification"

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "governance/**"
      - "data/governance/**"
      - "artifacts/science/act/RLL_ACT_DR6_MATERIALIZATION_RECONCILIATION_*.json"
      - "artifacts/science/h0/RLL_H0_RD_BOLTZMANN_RECONCILIATION_*.json"
      - "artifacts/audit/RLL_ALL_REFS_TOPOLOGY_RECONCILIATION_*.json"
      - "tools/rll_token_vazio_reconcile*.py"
      - "tests/test_rll_token_vazio_reconcile*.py"
      - "scripts/rll_governance_audit.py"
      - "tests/test_rll_governance_audit.py"
      - "docs/governance/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/rll-governance-quality-gate.yml"
      - ".github/workflow-architecture/invariants.v1.yml"
      - ".github/workflow-contract.yml"
      - ".github/GUIA_WORKFLOWS.md"

permissions:
  contents: read

concurrency:
  group: rll-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  LC_ALL: "C.UTF-8"
  LANG: "C.UTF-8"

jobs:
  governance-quality-gate:
    name: "Governance, data, security, science and ethics contract"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout immutable reviewed action"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "Validate contracts and generate receipt"
        run: python3 scripts/rll_governance_audit.py --strict --write-report

      - name: "Run governance unit tests"
        run: python3 -m unittest -v tests/test_rll_governance_audit.py

      - name: "Reconcile TOKEN_VAZIO V2 append-only"
        run: |
          mkdir -p artifacts/governance
          python3 -m tools.rll_token_vazio_reconcile_v2 \
            --generated-at 2026-08-08T04:30:00Z \
            --output artifacts/governance/RLL_TOKEN_VAZIO_RECONCILIATION_V2_CURRENT.json
          python3 -m unittest -v tests.test_rll_token_vazio_reconcile_v2
          sha256sum artifacts/governance/RLL_TOKEN_VAZIO_RECONCILIATION_V2_CURRENT.json \
            > artifacts/governance/RLL_TOKEN_VAZIO_RECONCILIATION_V2_CURRENT.sha256

      - name: "Publish non-certification report to job summary"
        if: always()
        run: |
          if [ -f artifacts/governance/RLL_GOVERNANCE_REPORT.md ]; then
            cat artifacts/governance/RLL_GOVERNANCE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '# RLL Governance Audit' '' 'Report was not generated; inspect previous step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Upload governance receipt even after failure"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rll-governance-receipt-${{ github.run_id }}
          path: artifacts/governance/
          if-no-files-found: warn
          retention-days: 30
