name: "RLL Governance Quality Gate — non-certification"

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "governance/**"
      - "data/governance/**"
      - "data/science/act/**"
      - "data/science/h0/**"
      - "data/science/perturbations/**"
      - "artifacts/governance/**"
      - "artifacts/science/act/RLL_ACT_DR6_MATERIALIZATION_RECONCILIATION_*.json"
      - "artifacts/science/h0/RLL_H0_RD_BOLTZMANN_RECONCILIATION_*.json"
      - "artifacts/science/h0/RLL_H0_PRIMARY_SOURCE_PROVENANCE_*.json"
      - "artifacts/science/external/**"
      - "artifacts/audit/RLL_ALL_REFS_TOPOLOGY_RECONCILIATION_*.json"
      - "tools/rll_token_vazio_reconcile*.py"
      - "tests/test_rll_token_vazio_reconcile*.py"
      - "tools/rll_open_work_mechanism_gate*.py"
      - "tests/test_rll_open_work_mechanism_gate*.py"
      - "tools/rll_modern_validation_reconcile*.py"
      - "tests/test_rll_modern_validation_reconcile*.py"
      - "scripts/rll_governance_audit.py"
      - "tests/test_rll_governance_audit.py"
      - "docs/governance/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/rll-governance-quality-gate.yml"
      - ".github/workflow-architecture/invariants.v1.yml"
      - ".github/workflow-contract.yml"
      - ".github/GUIA_WORKFLOWS.md"

permissions:
  contents: read

concurrency:
  group: rll-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  LC_ALL: "C.UTF-8"
  LANG: C.UTF-8

jobs:
  governance-quality-gate:
    name: "Governance, data, security, science and ethics contract"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout immutable reviewed action"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "Validate contracts and generate receipt"
        run: python3 scripts/rll_governance_audit.py --strict --write-report

      - name: "Run governance unit tests"
        run: python3 -m unittest -v tests/test_rll_governance_audit.py

      - name: "Reproduce TOKEN_VAZIO V2 historical append-only view"
        run: |
          mkdir -p artifacts/governance
          python3 -m tools.rll_token_vazio_reconcile_v2 \
            --generated-at 2026-08-08T04:30:00Z \
            --output artifacts/governance/RLL_TOKEN_VAZIO_RECONCILIATION_V2_CURRENT.json
          python3 -m unittest -v tests.test_rll_token_vazio_reconcile_v2
          sha256sum artifacts/governance/RLL_TOKEN_VAZIO_RECONCILIATION_V2_CURRENT.json \
            > artifacts/governance/RLL_TOKEN_VAZIO_RECONCILIATION_V2_CURRENT.sha256

      - name: "Reproduce TOKEN_VAZIO V3 historical append-only view"
        run: |
          python3 -m tools.rll_token_vazio_reconcile_v3 \
            --generated-at 2026-08-08T05:44:00Z \
            --output artifacts/governance/RLL_TOKEN_VAZIO_RECONCILIATION_V3_CURRENT.json
          python3 -m unittest -v tests.test_rll_token_vazio_reconcile_v3
          sha256sum artifacts/governance/RLL_TOKEN_VAZIO_RECONCILIATION_V3_CURRENT.json \
            > artifacts/governance/RLL_TOKEN_VAZIO_RECONCILIATION_V3_CURRENT.sha256

      - name: "Reproduce TOKEN_VAZIO V4 live-settings evidence view"
        run: |
          python3 -m tools.rll_token_vazio_reconcile_v4 \
            --generated-at 2026-08-08T06:50:00Z \
            --output artifacts/governance/RLL_TOKEN_VAZIO_RECONCILIATION_V4_CURRENT.json
          python3 -m unittest -v tests.test_rll_token_vazio_reconcile_v4
          sha256sum artifacts/governance/RLL_TOKEN_VAZIO_RECONCILIATION_V4_CURRENT.json \
            > artifacts/governance/RLL_TOKEN_VAZIO_RECONCILIATION_V4_CURRENT.sha256

      - name: "Reconcile TOKEN_VAZIO V5 orphan modern-validation view"
        run: |
          python3 -m tools.rll_token_vazio_reconcile_v5 \
            --generated-at 2026-08-08T07:10:00Z \
            --output artifacts/governance/RLL_TOKEN_VAZIO_RECONCILIATION_V5_CURRENT.json
          python3 -m unittest -v tests.test_rll_token_vazio_reconcile_v5
          sha256sum artifacts/governance/RLL_TOKEN_VAZIO_RECONCILIATION_V5_CURRENT.json \
            > artifacts/governance/RLL_TOKEN_VAZIO_RECONCILIATION_V5_CURRENT.sha256

      - name: "Reconcile Modern Validation V1 to current canonical tokens"
        run: |
          python3 -m tools.rll_modern_validation_reconcile_v2 \
            --output artifacts/governance/RLL_MODERN_VALIDATION_RECONCILIATION_V2_CURRENT.json
          python3 -m unittest -v tests.test_rll_modern_validation_reconcile_v2
          sha256sum artifacts/governance/RLL_MODERN_VALIDATION_RECONCILIATION_V2_CURRENT.json \
            > artifacts/governance/RLL_MODERN_VALIDATION_RECONCILIATION_V2_CURRENT.sha256

      - name: "Gate historical and effective open-work mechanisms V1-V4"
        run: |
          python3 -m tools.rll_open_work_mechanism_gate_v1 \
            --output artifacts/governance/RLL_OPEN_WORK_MECHANISM_GATE_V1.json
          python3 -m unittest -v tests.test_rll_open_work_mechanism_gate_v1
          python3 -m tools.rll_open_work_mechanism_gate_v2 \
            --output artifacts/governance/RLL_OPEN_WORK_MECHANISM_GATE_V2.json
          python3 -m unittest -v tests.test_rll_open_work_mechanism_gate_v2
          python3 -m tools.rll_open_work_mechanism_gate_v3 \
            --output artifacts/governance/RLL_OPEN_WORK_MECHANISM_GATE_V3.json
          python3 -m unittest -v tests.test_rll_open_work_mechanism_gate_v3
          python3 -m tools.rll_open_work_mechanism_gate_v4 \
            --output artifacts/governance/RLL_OPEN_WORK_MECHANISM_GATE_V4.json
          python3 -m unittest -v tests.test_rll_open_work_mechanism_gate_v4
          sha256sum \
            artifacts/governance/RLL_OPEN_WORK_MECHANISM_GATE_V1.json \
            artifacts/governance/RLL_OPEN_WORK_MECHANISM_GATE_V2.json \
            artifacts/governance/RLL_OPEN_WORK_MECHANISM_GATE_V3.json \
            artifacts/governance/RLL_OPEN_WORK_MECHANISM_GATE_V4.json \
            > artifacts/governance/RLL_OPEN_WORK_MECHANISM_GATES.sha256

      - name: "Publish non-certification report to job summary"
        if: always()
        run: |
          if [ -f artifacts/governance/RLL_GOVERNANCE_REPORT.md ]; then
            cat artifacts/governance/RLL_GOVERNANCE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '# RLL Governance Audit' '' 'Report was not generated; inspect previous step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Upload governance receipt even after failure"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rll-governance-receipt-${{ github.run_id }}
          path: artifacts/governance/
          if-no-files-found: warn
          retention-days: 30
