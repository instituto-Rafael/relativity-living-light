name: RLL Modern Validation Gate

on:
  pull_request:
    paths:
      - "data/governance/RLL_MODERN_VALIDATION_GAPS_20260807_V1.json"
      - "data/governance/RLL_UNCERTAINTY_VARIANCE_LEDGER_20260807_V1.json"
      - "scripts/rll_modern_validation_gate.py"
      - "scripts/rll_uncertainty_variance_gate.py"
      - "tools/rll_desi_dr2_cobaya_custody_v1.py"
      - "tests/test_rll_desi_dr2_cobaya_custody_v1.py"
      - "tests/test_rll_modern_validation_gate.py"
      - "tests/test_rll_uncertainty_variance_gate.py"
      - "docs/science/RLL_MODERN_VALIDATION_GAPS_20260807_V1.md"
      - "artifacts/science/**"
      - ".github/workflows/rll-modern-validation-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DESI_COBAYA_PACKAGES_PATH: ${{ github.workspace }}/.desi-cobaya-packages

jobs:
  modern-validation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded validation dependencies
        run: |
          python -m pip install --disable-pip-version-check "pytest>=8,<10" "cobaya==3.5.6"
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("cobaya") == "3.5.6"
          print("cobaya", importlib.metadata.version("cobaya"))
          PY

      - name: Contract and DESI custody tests
        run: |
          python -m pytest -q \
            tests/test_rll_modern_validation_gate.py \
            tests/test_rll_uncertainty_variance_gate.py \
            tests/test_rll_desi_dr2_cobaya_custody_v1.py

      - name: Materialize official DESI DR2 all-tracer Cobaya likelihood data
        run: |
          set -euo pipefail
          cobaya-install bao.desi_dr2 --packages-path "$DESI_COBAYA_PACKAGES_PATH"
          mkdir -p artifacts/science/desi
          python tools/rll_desi_dr2_cobaya_custody_v1.py \
            --packages-root "$DESI_COBAYA_PACKAGES_PATH" \
            --output artifacts/science/desi/DESI_DR2_COBAYA_CUSTODY_CURRENT.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/science/desi/DESI_DR2_COBAYA_CUSTODY_CURRENT.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["state"] == "DESI_DR2_COBAYA_ALL_TRACER_DATA_CUSTODY_MATERIALIZED"
          assert d["claim_allowed"] is False
          assert d["publication_ready"] is False
          assert d["component"]["cobaya_likelihood"] == "bao.desi_dr2.desi_bao_all"
          assert d["custody"]["desi_file_count"] > 0
          assert d["resolved_token"] is None
          assert d["reduces_token"] == "TOKEN_VAZIO_DESI_DR2_OFFICIAL_JOINT_CROSSBLOCK_REPRODUCTION"
          print(json.dumps({"state": d["state"], "desi_files": d["custody"]["desi_file_count"], "claim_allowed": False}, sort_keys=True))
          PY
          sha256sum artifacts/science/desi/DESI_DR2_COBAYA_CUSTODY_CURRENT.json \
            > artifacts/science/desi/DESI_DR2_COBAYA_CUSTODY_CURRENT.sha256

      - name: Evaluate materialized evidence fail-closed
        shell: bash
        run: |
          mkdir -p artifacts/science
          set +e
          python scripts/rll_modern_validation_gate.py \
            --output artifacts/science/modern_validation_gate_receipt.json
          rc=$?
          set -e

          # The current branch is expected to stay blocked until real external
          # receipts are materialized. rc=0 becomes valid only when every gate
          # has a VERIFIED, provenance-bearing receipt.
          test "$rc" -eq 0 -o "$rc" -eq 3

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/science/modern_validation_gate_receipt.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          assert value["claim_allowed"] is False
          assert value["publication_ready"] is False
          assert value["automatic_promotion_forbidden"] is True
          if value["all_gates_verified"]:
              assert value["scientific_gate"] == "READY_FOR_INDEPENDENT_HUMAN_REVIEW"
          else:
              assert value["token_vazio"]
              assert value["scientific_gate"] in {"BLOCKED_P0_TOKEN_VAZIO", "P0_READY_P1_BLOCKED"}
          PY

      - name: Evaluate uncertainty variance urgency ledger
        shell: bash
        run: |
          set +e
          python scripts/rll_uncertainty_variance_gate.py \
            --output artifacts/science/uncertainty_variance_gate_receipt.json
          rc=$?
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 3

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/science/uncertainty_variance_gate_receipt.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          assert value["claim_allowed"] is False
          assert value["publication_ready"] is False
          assert value["automatic_promotion_forbidden"] is True
          assert value["file_count"] >= 20
          assert value["paper_count"] >= 10
          assert value["priority_counts"]["P0"] >= 1
          assert value["token_vazio"]
          assert value["scientific_gate"] == "BLOCKED_P0_TOKEN_VAZIO"
          PY

      - name: Upload validation receipts
        uses: actions/upload-artifact@v4
        with:
          name: rll-modern-validation-gate-receipts
          path: |
            artifacts/science/modern_validation_gate_receipt.json
            artifacts/science/uncertainty_variance_gate_receipt.json
            artifacts/science/desi/DESI_DR2_COBAYA_CUSTODY_CURRENT.json
            artifacts/science/desi/DESI_DR2_COBAYA_CUSTODY_CURRENT.sha256
          if-no-files-found: error
          retention-days: 90
