name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyyaml jsonschema

      - name: Run tests with auditable receipt
        run: |
          mkdir -p artifacts/python-tests
          set -o pipefail
          pytest -q \
            --junitxml=artifacts/python-tests/junit.xml \
            2>&1 | tee artifacts/python-tests/pytest.log

      - name: Upload test receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-tests-${{ github.run_id }}
          path: artifacts/python-tests/
          retention-days: 30
          if-no-files-found: error
