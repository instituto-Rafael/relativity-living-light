name: Workflow Contract Reconciliation V2

on:
  pull_request:
    branches: [main, rll/release, rll/integration, rll/lab]
    paths:
      - ".github/workflows/**"
      - ".github/workflow-contract.yml"
      - "tools/workflow_contract_sync.py"
      - "tests/test_workflow_contract_sync.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-contract-sync-v2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-contract:
    name: Verify derived workflow inventory V2
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install focused dependency
        run: python -m pip install pytest
      - name: Test synchronizer
        run: python -m pytest -q tests/test_workflow_contract_sync.py
      - name: Compare executable inventory with contract
        run: python tools/workflow_contract_sync.py --write-report
      - name: Upload reconciliation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflow-contract-sync-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/workflow-contract-sync/
          retention-days: 30
          if-no-files-found: warn
