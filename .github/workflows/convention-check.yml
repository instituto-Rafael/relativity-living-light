name: Convention Consistency Check

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup deterministic Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install bounded Structure-D falsifier runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy pandas scipy pytest
      - name: Check structure_d required outputs
        run: bash scripts/check_structure_d_required_outputs.sh
      - name: Check structure_d dataset/model coverage
        run: bash scripts/check_structure_d_model_dataset_coverage.sh
      - name: Run Structure-D falsifier coverage tests
        run: python -m pytest -q tests/test_rll_structure_d_falsifier_coverage.py
      - name: Materialize Structure-D falsifier coverage receipt
        run: |
          set -euo pipefail
          python tools/rll_structure_d_falsifier_coverage.py \
            --output artifacts/structure-d-falsifier-coverage/receipt.json
          test -s artifacts/structure-d-falsifier-coverage/receipt.json
      - name: Validate joint real execution source contract
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_joint_real_execution_contract.py
          python tools/validate_joint_real_execution_contract.py \
            --output artifacts/structure-d-falsifier-coverage/joint-input-contract.json
          test -s artifacts/structure-d-falsifier-coverage/joint-input-contract.json
      - name: Prove unresolved full-profile gaps remain fail-closed
        run: |
          set +e
          python tools/rll_structure_d_falsifier_coverage.py \
            --strict-legacy \
            --output artifacts/structure-d-falsifier-coverage/strict-legacy-receipt.json
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "expected strict coverage gate to exit 3 while known dataset-consumption/source-parity gaps exist; got $code"
            exit 1
          fi
          echo "PASS: unresolved full-profile gaps remain explicitly fail-closed."
      - name: Validate canonical convention consistency
        run: scripts/check_convention_conflicts.sh
      - name: Upload Structure-D falsifier receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: structure-d-falsifier-coverage-${{ github.run_id }}
          path: artifacts/structure-d-falsifier-coverage/
          retention-days: 30
          if-no-files-found: warn
      #- name: Check documentation inventory count consistency
       # run: python3 tools/docs_inventory.py --check
