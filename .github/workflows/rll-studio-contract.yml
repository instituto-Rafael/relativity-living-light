name: RLL Studio Contract

on:
  pull_request:
    paths:
      - "studio/**"
      - "schemas/rll-experiment-manifest.v1.schema.json"
      - "tests/test_rll_studio_contract.py"
      - ".github/workflows/rll-studio-contract.yml"
  push:
    paths:
      - "studio/**"
      - "schemas/rll-experiment-manifest.v1.schema.json"
      - "tests/test_rll_studio_contract.py"
      - ".github/workflows/rll-studio-contract.yml"

permissions:
  contents: read

concurrency:
  group: rll-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'

      - name: Validate JavaScript syntax
        run: node --check studio/app.js

      - name: Run RLL Studio contract tests
        run: python -m unittest tests.test_rll_studio_contract -v

      - name: Claim boundary receipt
        run: |
          printf '%s\n' \
            'RLL_STUDIO_CONTRACT=PASS' \
            'UI_AUTHORITY=NONE' \
            'CLAIM_PROMOTION=PIPELINE_OWNED' \
            'DEFAULT_NEW_EXPERIMENT=NOT_MEASURED_BLOCKED' \
            'ACCESSIBILITY_BASELINE=TESTED_STATIC' \
            'PHYSICAL_USABILITY=TOKEN_VAZIO_UNTIL_HUMAN_DEVICE_TEST'
