name: RLL Execution Fabric

on:
  push:
    branches:
      - main
    paths:
      - "rx/**"
      - "configs/rll_execution_plan.v1.yml"
      - "configs/rx_physics_contracts.json"
      - "data/governance/RLL_RX_FORMULA_BINDINGS_V1.json"
      - "data/governance/RLL_DYNAMIC_STRUCTURAL_GEOMETRY_CONTEXT_V1.json"
      - "data/governance/RLL_WORLDLINE_CASCADE_FORMULA_ROUTER_V1.json"
      - "tests/test_rx_execution_fabric_stdlib.py"
      - ".github/workflows/rll-execution.yml"
  pull_request:
    paths:
      - "rx/**"
      - "configs/rll_execution_plan.v1.yml"
      - "configs/rx_physics_contracts.json"
      - "data/governance/RLL_RX_FORMULA_BINDINGS_V1.json"
      - "data/governance/RLL_DYNAMIC_STRUCTURAL_GEOMETRY_CONTEXT_V1.json"
      - "data/governance/RLL_WORLDLINE_CASCADE_FORMULA_ROUTER_V1.json"
      - "tests/test_rx_execution_fabric_stdlib.py"
      - ".github/workflows/rll-execution.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rll-execution-fabric-${{ github.ref }}
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rx zero-dependency execution-fabric tests
        run: python3 -m unittest tests.test_rx_execution_fabric_stdlib

      - name: Rx no-AI gate
        run: python3 tools/rx_no_ai_gate.py

      - name: Rx zero-third-party gate
        run: python3 tools/rx_zero_dependency_gate.py

      - name: Execute canonical engineering plan
        env:
          RLL_AUTHORITY_MODE: reviewed_ci_workflow
          RX_NETWORK_PROBE: "0"
        run: python3 -m rx orchestrate --plan configs/rll_execution_plan.v1.yml

      - name: Cross-runtime semantic parity gate
        run: python3 tools/rx_semantic_parity.py

      - name: Upload execution receipt bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rll-execution-fabric-${{ github.run_id }}
          path: results/rll-execution/
          if-no-files-found: error
          retention-days: 30
