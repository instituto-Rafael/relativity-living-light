schema: rll.github_actions_capabilities.v2
status: ACTIVE_GOVERNANCE
updated_at: "2026-08-07"
claim_allowed: false
publication_effect: NONE

invariant: >-
  Repository files prove repository-local implementation. GitHub control-plane
  settings remain TOKEN_VAZIO until a fresh bounded execution or settings receipt
  records what was observed and when.

capabilities:
