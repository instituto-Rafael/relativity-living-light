    evidence: [.github/workflows/github-platform-assurance-v2.yml]
  - id: immutable_action_pinning
    state: PARTIAL
    evidence: [.github/workflows/github-platform-assurance-v2.yml, tools/github_actions_capability_gate.py]
    residual: legacy workflows may still contain mutable action references
    f_next: migrate legacy mutable references by risk tier
  - id: concurrency_and_timeouts
    state: PARTIAL
    evidence: [.github/workflows/github-platform-assurance-v2.yml]
    residual: legacy workflows remain incremental migration surface
  - id: reusable_workflows
