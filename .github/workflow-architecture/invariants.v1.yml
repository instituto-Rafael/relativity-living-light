schema: rll.github_actions_architecture.v1
status: ACTIVE_GOVERNANCE
claim_allowed: false
canonical_scientific_outputs_modified: false

first_line:
  id: KNOWS_BY_ON_FIRST_LINE
  statement: >-
    Every automation must expose its trigger, authority, permissions, inputs,
    outputs, claim boundary, failure semantics, and receipt path before it can
    participate in scientific promotion.
  interpretation: >-
    The first readable layer tells an operator what the workflow knows, why it
    runs, what it may change, and which evidence it emits. It is a governance
    invariant, not a physical law or a claim of machine knowledge.

language_boundary:
  yaml_role: declarative_orchestration_dsl
  yaml_must_contain:
    - event routing
    - job dependency graph
    - least-privilege permissions
    - bounded resource policy
    - calls to tested scripts, actions, or reusable workflows
  yaml_must_not_become:
    - primary scientific algorithm implementation
    - long embedded Python program
    - opaque shell application
    - source of physical constants or fitted results
    - substitute for unit-tested domain modules
  preferred_execution_layers:
    - tested Python module
    - repository script
    - composite action
    - reusable workflow

omega_feedback_cycle:
  order:
    - INPUT
    - CONTRACT
    - VALIDATE
    - EXECUTE
    - RECEIPT
    - RESIDUAL
    - DECIDE
    - FEEDBACK
  invariant: >-
    A new cycle may change a decision only through new source material,
    implementation, execution evidence, falsifier output, or an explicitly
    versioned governance rule. Rewording alone does not promote a claim.
  append_only_states:
    - negative_results
    - contradictions
    - TOKEN_VAZIO
    - receipts
    - superseded_decisions

branch_maturity:
  topology:
    feature_to_lab:
      head: any_non_protected_branch
      base: rll/lab
    lab_to_integration:
      head: rll/lab
      base: rll/integration
    integration_to_release:
      head: rll/integration
      base: rll/release
    release_to_main:
      head: rll/release
      base: main
  score_dimensions:
    - topology
    - semantic_amplitude
    - validation
    - evidence
    - governance
  thresholds:
    LAB: 40
    INTEGRATION: 60
    RELEASE: 80
    MAIN: 90
  invariant: >-
    Promotion is allowed only through the ordered branch topology and a new
    repository-local receipt. Semantic breadth without tests, evidence or an
    explicit TOKEN_VAZIO plus verifiable next step cannot mature a change.
  branch_protection_verified: false
  scientific_claim_effect: NONE

branch_reconciliation:
  invariant: >-
    Content merged directly into main must be forward-ported into the maturity
    chain without replacing laboratory-only governance. Workflow inventory and
    branch content drift require separate receipts.
  direct_main_hotfix:
    state: BREAK_GLASS_ONLY
    required_follow_up: forward_port_to_rll_lab
  history_reconciliation: TOKEN_VAZIO_HISTORY_RECONCILIATION
  contract_sync:
    source: .github/workflows/*.{yml,yaml}
    target: .github/workflow-contract.yml
    direct_main_commit: FORBIDDEN
    review_target: rll/lab

workflow_classes:
  structural:
    allowed_permissions:
      contents: read
    publication_effect: NONE
  scientific_shadow:
    allowed_permissions:
      contents: read
    publication_effect: NONE
    claim_allowed: false
  orchestrator:
    allowed_permissions:
      contents: read
      actions: write
    publication_effect: NONE
    manual_dispatch_only: false
    write_jobs_manual_dispatch_only: true
  reconciliation:
    default_permissions:
      contents: read
    manual_write_permissions:
      contents: write
      pull-requests: write
    write_jobs_manual_dispatch_only: true
    direct_main_commit: FORBIDDEN
    publication_effect: NONE
  publishing:
    requires_environment_protection: true
    requires_explicit_owner: true
    requires_attestation_plan: true

managed_workflows:
  .github/workflows/yml-syntax-validation.yml:
    class: structural
    require:
      - permissions
      - concurrency
      - job_timeout
      - checkout_without_persistent_credentials
      - always_upload_receipt
      - externalized_algorithm
  .github/workflows/yaml-deep-audit.yml:
    class: structural
    require:
      - permissions
      - concurrency
      - job_timeout
      - checkout_without_persistent_credentials
      - always_upload_receipt
      - externalized_algorithm
  .github/workflows/rll-governance-quality-gate.yml:
    class: structural
    require:
      - permissions
      - concurrency
      - job_timeout
      - checkout_without_persistent_credentials
      - always_upload_receipt
      - externalized_algorithm
  .github/workflows/frontier-research-composition.yml:
    class: scientific_shadow
    require:
      - permissions
      - concurrency
      - job_timeout
      - checkout_without_persistent_credentials
      - always_upload_receipt
      - externalized_algorithm
      - claim_boundary
  .github/workflows/unified-workflow-session-orchestrator.yml:
    class: orchestrator
    require:
      - permissions
      - concurrency
      - job_timeout
      - checkout_without_persistent_credentials
      - always_upload_receipt
      - claim_boundary
      - externalized_algorithm
  .github/workflows/rare-events-evidence-gate.yml:
    class: scientific_shadow
    require:
      - permissions
      - concurrency
      - job_timeout
      - checkout_without_persistent_credentials
      - always_upload_receipt
      - claim_boundary
      - externalized_algorithm
  .github/workflows/workflow-contract-sync.yml:
    class: reconciliation
    require:
      - permissions
      - concurrency
      - job_timeout
      - checkout_without_persistent_credentials
      - always_upload_receipt
      - claim_boundary
      - externalized_algorithm

policy:
  errors:
    pull_request_target_without_exception: true
    untrusted_context_interpolated_into_run: true
    missing_top_level_permissions_for_managed: true
    missing_timeout_for_managed_job: true
    checkout_persists_credentials_in_managed: true
    oversized_inline_program_in_managed: true
  warnings:
    mutable_external_action_reference: true
    missing_concurrency_outside_managed: true
    missing_timeout_outside_managed: true
    continue_on_error_without_receipt: true
  thresholds:
    max_inline_run_lines_managed: 24
    max_inline_run_lines_legacy_warning: 50
  migration:
    external_actions_full_sha:
      state: TRANSITIONAL_WARNING
      exit_criterion: >-
        Every external action reference is pinned to a reviewed full-length
        commit SHA and the repository Actions policy enforces SHA pinning.
    legacy_workflow_normalization:
      state: INCREMENTAL
      rule: >-
        Existing workflows are inventoried and warned before fail-closed
        enforcement; new or managed workflows are enforced immediately.

receipt_contract:
  mandatory_fields:
    - schema
    - commit_sha
    - workflow
    - job
    - claim_allowed
    - publication_effect
    - inputs_sha256
    - decision
    - residuals
  hash_algorithm: SHA-256
  artifact_retention_days_default: 30
  no_receipt_means: TOKEN_VAZIO_EXECUTION_EVIDENCE

security:
  least_privilege: true
  persist_credentials_default: false
  treat_github_event_text_as_untrusted: true
  secrets_must_not_be_echoed: true
  write_permissions_require_explicit_workflow_class:
    - orchestrator
    - reconciliation
  pull_request_target_default: FORBIDDEN
  automated_pull_requests:
    review_required: true
    target: rll/lab
    external_permission_verified: false
    unavailable_state: TOKEN_VAZIO_EXTERNAL_SETTING

scientific_boundary:
  structural_ci_pass_means: implementation_structure_executed_as_declared
  structural_ci_pass_does_not_mean:
    - theory_confirmed
    - model_preferred
    - dataset_rights_verified
    - independent_replication
    - claim_allowed
