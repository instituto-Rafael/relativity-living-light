schema: rll.workflow_contract.v1
updated_at: "2026-08-01"

inventory:
  active_workflows: 52
  inclusion: ".github/workflows/*.{yml,yaml}"
  exclusion:
    - ".github/To_add/**"
    - ".github/workflow-orchestrator/**"

canonical_pipeline:
  path: .github/workflows/rll-pipeline-linear-completo.yml
  triggers:
    - workflow_dispatch
    - workflow_call
    - pull_request
  job_id: deterministic-gate
  github_actions_steps: 6
  logical_steps: 44
  logical_phases: 8
  pull_request_mode: dry_run
  claim_boundary: "A execução estrutural do gate não comprova afirmações científicas."

branch_maturity:
  workflow: .github/workflows/unified-workflow-session-orchestrator.yml
  job_id: branch-maturity-gate
  topology:
    - "non-protected work branch -> rll/lab"
    - "rll/lab -> rll/integration"
    - "rll/integration -> rll/release"
    - "rll/release -> main"
  thresholds:
    LAB: 40
    INTEGRATION: 60
    RELEASE: 80
    MAIN: 90
  branch_protection_verified: false
  claim_allowed: false
  publication_effect: NONE

aliases:
  - path: .github/workflows/RLL-CI.yml
    job_id: canonical-science
    uses: ./.github/workflows/rll-pipeline-linear-completo.yml
    modo: apenas_ciencia
  - path: .github/workflows/RLL_SCIENTIFIC.yml
    job_id: canonical-science
    uses: ./.github/workflows/rll-pipeline-linear-completo.yml
    modo: apenas_ciencia

documented_checks:
  evidence_scope: repository_local_only
  branch_protection_verified: false
  checks:
    - context: deterministic-gate
      workflow: .github/workflows/rll-pipeline-linear-completo.yml
      job_id: deterministic-gate
    - context: test
      workflow: .github/workflows/python-tests.yml
      job_id: test
    - context: validate-workflow-architecture
      workflow: .github/workflows/yml-syntax-validation.yml
      job_id: validate-workflow-architecture
    - context: yaml-deep-audit
      workflow: .github/workflows/yaml-deep-audit.yml
      job_id: yaml-deep-audit
    - context: check-conventions
      workflow: .github/workflows/convention-check.yml
      job_id: check-conventions
    - context: Build polymathic concept matrix + validate schema
      workflow: .github/workflows/polymathic-concept-matrix.yml
      job_id: concept-matrix
    - context: build-formulas-artifacts
      workflow: .github/workflows/formulas-artifacts.yml
      job_id: build-formulas-artifacts
    - context: formulas-manifest
      workflow: .github/workflows/formulas-artifacts-validation.yml
      job_id: formulas-manifest
    - context: epistemic-contract
      workflow: .github/workflows/frontier-research-composition.yml
      job_id: epistemic-contract
    - context: governance-quality-gate
      workflow: .github/workflows/rll-governance-quality-gate.yml
      job_id: governance-quality-gate
      permissions: contents_read
      certification_claim: false
      conformity_claim: false
    - context: branch-maturity-gate
      workflow: .github/workflows/unified-workflow-session-orchestrator.yml
      job_id: branch-maturity-gate
      permissions: contents_read
      certification_claim: false
      conformity_claim: false

documentation:
  authority_order:
    - .github/workflow-contract.yml
    - .github/workflow-architecture/invariants.v1.yml
    - governance/rll-governance-profile.v1.json
    - tools/validate_workflow_docs.py
    - tools/workflow_architecture.py
    - tools/deep_yaml_audit.py
    - artifacts/workflow-docs/workflow_registry.json
    - docs/workflows/INDICE_CANONICO.md
  required_markers:
    .github/GUIA_WORKFLOWS.md:
      - "44 etapas lógicas"
      - "8 fases"
      - "6 steps físicos"
      - "não comprova a configuração de branch protection"
      - "validate-workflow-architecture"
      - "yaml-deep-audit"
      - "governance-quality-gate"
    docs/workflows/README.md:
      - "contrato executável"
      - "44 etapas lógicas"
      - "8 fases"
    docs/workflows/FASE_25_1_CONTRATO_EXECUTAVEL.md:
      - "fonte de verdade executável"
      - "TOKEN_VAZIO não apaga evidência histórica"
    docs/governance/RLL_OPERATIONAL_GOVERNANCE.md:
      - "sem certificação"
      - "auditoria absoluta"
      - "claim_allowed=true"
