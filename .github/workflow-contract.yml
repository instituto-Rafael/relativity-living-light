schema: rll.workflow_contract.v1
updated_at: "2026-08-08"

inventory:
  active_workflows: 76
  inclusion: ".github/workflows/*.{yml,yaml}"
  exclusion:
    - ".github/To_add/**"
    - ".github/workflow-orchestrator/**"
  source_of_truth: executable_files
  sync_tool: tools/workflow_contract_sync.py

canonical_pipeline:
  path: .github/workflows/rll-pipeline-linear-completo.yml
  triggers: [workflow_dispatch, workflow_call, pull_request]
  job_id: deterministic-gate
  github_actions_steps: 6
  logical_steps: 44
  logical_phases: 8
  pull_request_mode: dry_run
  claim_boundary: "A execução estrutural do gate não comprova afirmações científicas."

branch_maturity:
  workflow: .github/workflows/unified-workflow-session-orchestrator.yml
  job_id: branch-maturity-gate
  topology:
    - "non-protected work branch -> rll/lab"
    - "rll/lab -> rll/integration"
    - "rll/integration -> rll/release"
    - "rll/release -> main"
  thresholds: {LAB: 40, INTEGRATION: 60, RELEASE: 80, MAIN: 90}
  branch_protection_verified: false
  claim_allowed: false
  publication_effect: NONE

github_platform_assurance:
  workflow: .github/workflows/github-platform-assurance.yml
  capability_matrix: .github/workflow-architecture/github-actions-capabilities.v1.yml
  gate: tools/github_actions_capability_gate.py
  jobs: [platform-capability-contract, dependency-review, codeql]
  codeql_languages: [actions, python]
  external_settings_verified: true
  external_state: RESOLVED_NEGATIVE_NO_BRANCH_PROTECTION_OR_RULESETS
  external_evidence: artifacts/governance/RLL_GITHUB_EXTERNAL_SETTINGS_RECEIPT_20260808_RUN31244716847.json
  external_successor: TOKEN_VAZIO_GITHUB_PLATFORM_ENFORCEMENT
  branch_protection_observed: false
  repository_ruleset_count_observed: 0
  claim_allowed: false
  publication_effect: NONE

workflow_contract_reconciliation:
  workflow: .github/workflows/workflow-contract-sync.yml
  tool: tools/workflow_contract_sync.py
  proposal_tool: tools/propose_workflow_contract_pr.py
  tests: tests/test_workflow_contract_sync.py
  local_hook: .githooks/pre-commit
  installer: scripts/install_repo_hooks.sh
  modes:
    check: read_only_fail_closed
    write: local_workspace_only
    propose: workflow_dispatch_pull_request_to_rll_lab
  direct_main_commit: FORBIDDEN
  external_pr_permission_verified: false
  external_pr_permission_state: TOKEN_VAZIO_EXTERNAL_SETTING
  claim_allowed: false
  publication_effect: NONE

branch_reconciliation:
  main_to_maturity_content_forward_ported:
    - .github/workflows/rare-events-evidence-gate.yml
    - data/knowledge_forest/rare_events_claim_registry_v1.yml
    - docs/canonicos/MATRIZ_EVIDENCIAS_EVENTOS_RAROS_V1.md
    - docs/canonicos/PROTOCOLO_EVENTOS_RAROS_EVIDENCIA_V1.md
    - scripts/validate_rare_events_registry.py
    - tests/test_rare_events_registry.py
  history_reconciliation: TOKEN_VAZIO_HISTORY_RECONCILIATION
  invariant: >-
    Content added directly to main must be forward-ported through the maturity
    chain without deleting laboratory-only governance. Commit-history divergence
    does not become equivalence without a new receipt.
  current_release_promotion:
    source_ref: rll/integration
    target_ref: rll/release
    source_sha: 888059a095600c50493d535c2ef5c2a685a453a8
    source_prs: [672, 674]
    evidence:
      - artifacts/science/h0/RLL_H0_RD_CONVERGENCE_RECEIPT_20260808_RUN31229739077.json
      - artifacts/science/perturbations/RLL_CLASS_CAMB_BASELINE_RECEIPT_20260808_RUN31231315944.json
      - data/governance/RLL_TOKEN_VAZIO_CLOSURE_OVERRIDES_20260807_V1.json
    ledger: {input_tokens: 30, terminal_resolved: 9, reduced_generic: 7, open: 14}
    observed_validation:
      python_tests: 1049
      python_subtests: 3
      class_camb_baseline: VERIFIED_BASELINE_ENGINE_CROSSCHECK
      h0_rd_optimizer_convergence: VERIFIED_ALL_24_BEST_FITS_CONVERGED
      pantheon_dovekie_modern_gate: PASS
    residual_scientific_authorities:
      - TOKEN_VAZIO_DESI_DR2_OFFICIAL_JOINT_CROSSBLOCK_REPRODUCTION
      - TOKEN_VAZIO_ACT_DR6_CMBONLY_MATERIALIZATION_REPRODUCTION
      - TOKEN_VAZIO_DES_Y6_3X2PT_LIKELIHOOD
      - TOKEN_VAZIO_H0_PRIOR_PRIMARY_SOURCE_PROVENANCE
      - TOKEN_VAZIO_H0_RD_FULL_BOLTZMANN_REPRODUCTION
      - TOKEN_VAZIO_RLL_PERTURBATION_CLOSURE_RELATIONS
      - TOKEN_VAZIO_RLL_CLASS_CAMB_IMPLEMENTATION
      - TOKEN_VAZIO_INDEPENDENT_REPLICATION
      - TOKEN_VAZIO_PHYSICAL_EXECUTION
    claim_allowed: false
    publication_effect: NONE

aliases:
  - path: .github/workflows/RLL-CI.yml
    job_id: canonical-science
    uses: ./.github/workflows/rll-pipeline-linear-completo.yml
    modo: apenas_ciencia
  - path: .github/workflows/RLL_SCIENTIFIC.yml
    job_id: canonical-science
    uses: ./.github/workflows/rll-pipeline-linear-completo.yml
    modo: apenas_ciencia

documented_checks:
  evidence_scope: repository_local_plus_fresh_pr_execution
  branch_protection_verified: false
  checks:
    - {context: deterministic-gate, workflow: .github/workflows/rll-pipeline-linear-completo.yml, job_id: deterministic-gate}
    - {context: claim-allowed-gate, workflow: .github/workflows/claim-allowed-gate.yml, job_id: validate, permissions: contents_read, certification_claim: false, conformity_claim: false}
    - {context: test, workflow: .github/workflows/python-tests.yml, job_id: test}
    - {context: validate-workflow-architecture, workflow: .github/workflows/yml-syntax-validation.yml, job_id: validate-workflow-architecture}
    - {context: yaml-deep-audit, workflow: .github/workflows/yaml-deep-audit.yml, job_id: yaml-deep-audit}
    - {context: check-conventions, workflow: .github/workflows/convention-check.yml, job_id: check-conventions}
    - {context: Build polymathic concept matrix + validate schema, workflow: .github/workflows/polymathic-concept-matrix.yml, job_id: concept-matrix}
    - {context: build-formulas-artifacts, workflow: .github/workflows/formulas-artifacts.yml, job_id: build-formulas-artifacts}
    - {context: formulas-manifest, workflow: .github/workflows/formulas-artifacts-validation.yml, job_id: formulas-manifest}
    - {context: epistemic-contract, workflow: .github/workflows/frontier-research-composition.yml, job_id: epistemic-contract}
    - {context: governance-quality-gate, workflow: .github/workflows/rll-governance-quality-gate.yml, job_id: governance-quality-gate, permissions: contents_read, certification_claim: false, conformity_claim: false}
    - {context: branch-maturity-gate, workflow: .github/workflows/unified-workflow-session-orchestrator.yml, job_id: branch-maturity-gate, permissions: contents_read, certification_claim: false, conformity_claim: false}
    - {context: GitHub platform capability contract, workflow: .github/workflows/github-platform-assurance.yml, job_id: platform-capability-contract, permissions: contents_read, certification_claim: false, conformity_claim: false}
    - {context: Dependency review, workflow: .github/workflows/github-platform-assurance.yml, job_id: dependency-review, permissions: contents_read, certification_claim: false, conformity_claim: false}
    - {context: CodeQL (actions), workflow: .github/workflows/github-platform-assurance.yml, job_id: codeql, permissions: security_events_write, certification_claim: false, conformity_claim: false}
    - {context: CodeQL (python), workflow: .github/workflows/github-platform-assurance.yml, job_id: codeql, permissions: security_events_write, certification_claim: false, conformity_claim: false}
    - {context: Rare Events Evidence Gate, workflow: .github/workflows/rare-events-evidence-gate.yml, job_id: evidence-governance, permissions: contents_read, certification_claim: false, conformity_claim: false}
    - {context: Verify workflow contract inventory, workflow: .github/workflows/workflow-contract-sync.yml, job_id: verify-contract, permissions: contents_read, certification_claim: false, conformity_claim: false}
    - {context: ACT DR6 CMB-only materialization, workflow: .github/workflows/act-dr6-cmbonly-materialization.yml, job_id: materialize-reference, permissions: contents_read, certification_claim: false, conformity_claim: false}
    - {context: ACT DR6.02 official LCDM reference chain custody, workflow: .github/workflows/act-dr6-reference-chain-custody.yml, job_id: custody, permissions: contents_read, certification_claim: false, conformity_claim: false}
    - {context: ACT DR6 local posterior preflight V2, workflow: .github/workflows/act-dr6-posterior-preflight-v2.yml, job_id: freeze-contract, permissions: contents_read, certification_claim: false, conformity_claim: false}

