# ═══════════════════════════════════════════════════════════════════════════════
# 🎼 ORQUESTRADOR DE PIPELINE - Dashboard Excellence
# ═══════════════════════════════════════════════════════════════════════════════
# Configuração central que orquestra todos os aspectos do pipeline com
# plenitude de conceitos, proveniência, contrato e excelência operacional.

orchestrator:
  name: "Dashboard Excellence Orchestrator"
  version: "1.0.0"
  description: "Orquestrador profissional com 7 fases de validação"

# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURATION: Dependências e Artefatos
# ═══════════════════════════════════════════════════════════════════════════════
configuration:
  contract_file: ".dashboard-excellence-contract.yml"
  workflow_file: ".github/workflows/dashboard-excellence-orchestrator.yml"

  dependencies:
    node_versions: ["20", "22"]
    npm_version: ">=10.0.0"
    git_version: ">=2.40.0"

  environment_variables:
    REGISTRY: "ghcr.io"
    NODE_VERSION: "20"
    PNPM_VERSION: "9.0.0"

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE ORCHESTRATION: Sequência de Execução com Dependências
# ═══════════════════════════════════════════════════════════════════════════════
phases:
  phase_1:
    name: "Provenance & Contract"
    icon: "📋"
    description: "Estabelecer rastreabilidade e contrato operacional"
    duration_max_seconds: 30
    critical: true

    outputs:
      - BUILD_ID
      - COMMIT_HASH
      - TIMESTAMP
      - PAYLOAD_HASH

    artifacts:
      - PROVENANCE_CONTRACT.json

  phase_2:
    name: "Integrity & Completeness"
    icon: "🔐"
    description: "Validar integridade e remover TOKENS_VAZIOS"
    dependencies: [phase_1]
    duration_max_seconds: 45
    critical: true

    checks:
      - token_scan: "Procurar TOKENS_VAZIOS"
      - file_validation: "Verificar arquivos críticos"
      - type_checking: "Validar TypeScript"

    gates:
      - if_empty_tokens_found: "WARN"
      - if_files_missing: "BLOCK"
      - if_type_errors: "BLOCK"

  phase_3:
    name: "Quality & Excellence"
    icon: "✨"
    description: "Validação de qualidade e excelência operacional"
    dependencies: [phase_2]
    duration_max_seconds: 120
    critical: true

    strategies:
      - matrix:
          node_version: ["20", "22"]

    tasks:
      - lint: "ESLint validation"
      - type_check: "TypeScript strict"
      - test: "Unit & integration tests"
      - coverage: "Coverage reporting"

    gates:
      - lint_success: "WARN"
      - type_check_success: "BLOCK"
      - test_coverage_min_80: "WARN"

  phase_4:
    name: "Build & Performance"
    icon: "🏗️"
    description: "Otimização e performance validada"
    dependencies: [phase_3]
    duration_max_seconds: 300
    critical: true

    outputs:
      - BUNDLE_SIZE
      - BUILD_TIME

    gates:
      - bundle_size_max_300kb: "WARN"
      - build_time_max_5min: "WARN"
      - dist_files_generated: "BLOCK"

    artifacts:
      - dist/
      - PERFORMANCE_REPORT.md

  phase_5:
    name: "Security & Compliance"
    icon: "🔒"
    description: "Validação de segurança e compliance"
    dependencies: [phase_2]
    duration_max_seconds: 90
    critical: true

    validations:
      - dependency_audit: "npm audit"
      - sbom_generation: "Software Bill of Materials"
      - security_headers: "CSP + Security headers"
      - vulnerability_scan: "Known CVE check"

    gates:
      - no_critical_vulnerabilities: "BLOCK"
      - no_high_vulnerabilities: "WARN"
      - sbom_generated: "BLOCK"

    artifacts:
      - security-compliance-report/

  phase_6:
    name: "Documentation & Traceability"
    icon: "📚"
    description: "Documentação e matriz de rastreabilidade"
    dependencies: [phase_1, phase_4]
    duration_max_seconds: 60
    critical: false

    requirements:
      - README_md: "Documentation entry point"
      - ARCHITECTURE_md: "Technical architecture"
      - type_definitions: "TypeScript interfaces"
      - code_comments: "JSDoc where needed"

    outputs:
      - TRACEABILITY_MATRIX.md

    gates:
      - doc_files_exist: "WARN"
      - doc_min_length_lines: "WARN"

  phase_7:
    name: "Excellence Gateway"
    icon: "🎯"
    description: "Decisão final de excelência"
    dependencies: [phase_1, phase_2, phase_3, phase_4, phase_5, phase_6]
    duration_max_seconds: 30
    critical: true

    decision_logic: |
      ALL(
        provenance.success,
        integrity.success,
        quality.success,
        build.success,
        security.success,
        (documentation.success OR documentation.warn)
      )

    outputs:
      - EXCELLENCE_REPORT.md
      - decision_status

# ═══════════════════════════════════════════════════════════════════════════════
# FAILURE HANDLING: Estratégias de Recuperação
# ═══════════════════════════════════════════════════════════════════════════════
failure_handling:
  retry_policy:
    max_retries: 3
    backoff_strategy: "exponential"
    backoff_base_seconds: 2

    retriable_errors:
      - "Network timeout"
      - "Rate limit exceeded"
      - "Temporary service unavailable"

    non_retriable_errors:
      - "Type checking failed"
      - "Critical vulnerability"
      - "Security gate failed"

  escalation:
    on_critical_failure: "Notify #engineering"
    on_security_failure: "Notify #security"
    on_multiple_retries: "Create incident ticket"

  rollback:
    automatic_on_phase: "NEVER"  # Manual only
    documentation: "Rollback procedure in ARCHITECTURE.md"
    verification: "Run test suite before production"

# ═══════════════════════════════════════════════════════════════════════════════
# ARTIFACT MANAGEMENT: Geração e Retenção
# ═══════════════════════════════════════════════════════════════════════════════
artifacts:
  retention_policy:
    provenance_contract: 90  # dias
    build_distributions: 30  # dias
    performance_reports: 30  # dias
    security_reports: 90  # dias
    documentation: 365  # dias
    audit_logs: 365  # dias

  storage:
    backend: "github_artifacts"
    compression: "gzip"
    encryption: "none"  # GitHub handles it

  naming_convention: "{phase}-{artifact_type}-{timestamp}"

# ═══════════════════════════════════════════════════════════════════════════════
# METRICS & OBSERVABILITY: Monitoramento Contínuo
# ═══════════════════════════════════════════════════════════════════════════════
metrics:
  collection_enabled: true

  tracked_metrics:
    build_time_seconds:
      unit: "seconds"
      sla_max: 300
      sla_target: 120

    bundle_size_kb:
      unit: "kilobytes"
      sla_max: 300
      sla_target: 250

    test_coverage_percent:
      unit: "percent"
      sla_min: 80
      sla_target: 90

    type_coverage_percent:
      unit: "percent"
      sla_min: 100
      sla_target: 100

    phase_success_rate:
      unit: "percent"
      sla_min: 98

    deployment_frequency:
      unit: "per_day"
      target: 1

  dashboards:
    - name: "Pipeline Overview"
      metrics: [build_time, bundle_size, test_coverage]

    - name: "Quality Metrics"
      metrics: [type_coverage, phase_success_rate]

    - name: "Performance"
      metrics: [build_time, bundle_size]

# ═══════════════════════════════════════════════════════════════════════════════
# NOTIFICATIONS: Comunicação de Status
# ═══════════════════════════════════════════════════════════════════════════════
notifications:
  channels:
    slack:
      enabled: true
      webhook_env: "SLACK_WEBHOOK_EXCELLENCE"
      mention_on_failure: "@channel"

  events:
    on_phase_failure:
      message: "❌ Phase {phase_name} failed"
      severity: "high"
      actions: ["notify", "create_ticket"]

    on_security_issue:
      message: "🔒 Security issue detected"
      severity: "critical"
      actions: ["notify_security", "create_incident", "block_deployment"]

    on_sla_violation:
      message: "⚠️ SLA violation: {metric}"
      severity: "medium"
      actions: ["notify", "log_metric"]

    on_success:
      message: "✅ Pipeline completed successfully"
      severity: "low"
      actions: ["notify"]

# ═══════════════════════════════════════════════════════════════════════════════
# APPROVAL GATES: Pontos de Decisão Críticos
# ═══════════════════════════════════════════════════════════════════════════════
approval_gates:
  gate_1_provenance:
    requirement: "Contrato assinado"
    approvers: ["technical_lead"]
    auto_approve: true
    timeout_hours: 24

  gate_2_security:
    requirement: "Sem vulnerabilidades críticas"
    approvers: ["security_officer"]
    auto_approve: false
    timeout_hours: 4

  gate_3_release:
    requirement: "Todas as fases passaram"
    approvers: ["product_owner", "technical_lead"]
    auto_approve: false
    timeout_hours: 48

# ═══════════════════════════════════════════════════════════════════════════════
# EXECUTION MODES: Diferentes Estratégias de Execução
# ═══════════════════════════════════════════════════════════════════════════════
execution_modes:
  continuous_integration:
    trigger: "push to main OR pull_request"
    phases: [1, 2, 3, 4, 5, 6, 7]
    approve_gates: []
    schedule: "immediate"

  continuous_delivery:
    trigger: "tag release/*"
    phases: [1, 2, 3, 4, 5, 6, 7]
    approve_gates: ["gate_2_security"]
    schedule: "immediate"

  continuous_deployment:
    trigger: "tag release/* AND approved"
    phases: [1, 2, 3, 4, 5, 6, 7]
    approve_gates: ["gate_2_security", "gate_3_release"]
    schedule: "immediate"

  scheduled_validation:
    trigger: "0 2 * * *"  # Daily 2 AM UTC
    phases: [1, 2, 3, 4, 5, 6, 7]
    approve_gates: []
    schedule: "cron"

# ═══════════════════════════════════════════════════════════════════════════════
# COMPLIANCE TRACKING: Auditoria e Conformidade
# ═══════════════════════════════════════════════════════════════════════════════
compliance_tracking:
  audit_log_enabled: true

  tracked_items:
    - phase_execution: "Start/End timestamps"
    - decision_gates: "Pass/Fail + Approvers"
    - artifacts_generated: "Hash + Size"
    - errors_encountered: "Type + Severity"
    - manual_interventions: "Who + When + Why"
    - sla_violations: "Metric + Threshold"

  retention: 365  # dias

  export_format: "JSON-LD"

  compliance_standards:
    - "ISO 27001"
    - "SOC 2 Type II"
    - "GDPR"

# ═══════════════════════════════════════════════════════════════════════════════
# EXTENSIBILITY: Hooks e Customizações
# ═══════════════════════════════════════════════════════════════════════════════
extensibility:
  pre_pipeline_hook: "scripts/pre-pipeline.sh"
  post_phase_hook: "scripts/post-phase.sh"
  pre_deployment_hook: "scripts/pre-deployment.sh"

  custom_checks:
    - name: "Custom Security Scan"
      script: "scripts/custom-security-scan.sh"
      critical: true

    - name: "Performance Benchmark"
      script: "scripts/benchmark.sh"
      critical: false

# ═══════════════════════════════════════════════════════════════════════════════
# DOCUMENTATION & HELP
# ═══════════════════════════════════════════════════════════════════════════════
documentation:
  pipeline_guide: "docs/pipeline-guide.md"
  troubleshooting: "docs/troubleshooting.md"
  sla_details: ".dashboard-excellence-contract.yml"

  help_commands:
    - "npm run pipeline:validate"
    - "npm run pipeline:simulate"
    - "npm run pipeline:report"

# ═══════════════════════════════════════════════════════════════════════════════
# STATUS & CHANGELOG
# ═══════════════════════════════════════════════════════════════════════════════
status:
  version: "1.0.0"
  released: "2026-08-09"
  status: "ACTIVE"

  changelog:
    "1.0.0":
      - "Initial implementation with 7 phases"
      - "Full provenance and contract support"
      - "Zero tokens vazios validation"
      - "Comprehensive security checks"
      - "Complete documentation"

# ═══════════════════════════════════════════════════════════════════════════════
# FIM DO ORQUESTRADOR
# Este arquivo configura o pipeline profissional com plenitude de conceitos
# ═══════════════════════════════════════════════════════════════════════════════
