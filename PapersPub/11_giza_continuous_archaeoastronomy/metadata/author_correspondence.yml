    venue: Nature
    year: 2000
    doi: 10.1038/35042510
    source_role: SUPPORTIVE_ORIENTATION_CHRONOLOGY_MODEL
    correspondence:
      status: NOT_SENT
      route: DOI_PUBLISHER
      intended_question: >-
        Which uncertainty terms and observational assumptions should be preserved
        when adapting the simultaneous-transit/precession method to a separate
        multi-shaft hypothesis without implying that the original paper endorsed it?

