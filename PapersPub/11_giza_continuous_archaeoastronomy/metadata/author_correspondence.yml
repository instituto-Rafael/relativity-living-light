contact_gate:
  prerequisites:
    - exact paper and DOI source-bound
    - one concrete scholarly question per message
    - project hypothesis explicitly distinguished from source author's claims
    - no attachment unless requested
    - no claim of endorsement
    - human review before send
  forbidden:
    - bulk unsolicited mail
    - automatic author enrollment
    - publishing private email addresses in the repository
    - wording that implies the author validated RLL
