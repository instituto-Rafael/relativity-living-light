schema: rll.giza_academic_correspondence.v1
version: 1
recorded_at: 2026-09-06
status: NOT_SENT
claim_allowed: false
publication_allowed: false
privacy_boundary:
  publish_personal_email_addresses: false
  contact_route: DOI_OR_PUBLISHER_ORCID_ONLY
  automated_outreach: false
purpose: >-
  Preserve source-bound author, DOI, venue and correspondence routes for scholarly
  questions about Great Pyramid shaft geometry, orientation, precession and model
  criticism. This manifest does not authorize bulk or unsolicited automated email.

sources:
