relation_calculus:
  operators: [DIRECT, INVERSE, DERIVATIVE, ANTIDERIVATIVE, EXCLUSIVE, COMPLEMENT, COMPOSITION, CORRELATION, INVARIANT, EQUIVARIANT, COUNTERFACTUAL, META_RELATION]
  operator_count: 12
  rules:
  - DIRECT != CAUSAL by default
  - INVERSE may be set-valued
  - ANTIDERIVATIVE may encode a family plus constant/boundary data
  - CORRELATION != EQUIVALENCE
  - META_RELATION must declare its object-level dependencies
