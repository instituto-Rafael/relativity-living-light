macro_families:
- id: F01
  title: Estado / representação / epistemologia
  question: O que o objeto é antes de qualquer redução, transformação ou interpretação?
  focus: [estado bruto e primitivo, escala/unidades/dimensão, orientação e sinal, coordenada vs objeto, precisão/quantização, zero vs TOKEN_VAZIO, simetria e quociente, reconstrutibilidade, encoding/canonicalização, identidade/hash, perda/compressão, fronteira epistemológica]
- id: F02
  title: Relation Calculus / transformação
  question: Que relações e operadores ligam os objetos, e quais são invertíveis, composicionais ou apenas correlacionais?
  focus: [direta, inversa/fibras, derivada, antiderivada, exclusiva, complementar, composição, correlação, invariante, equivariante, contrafactual, meta-relação]
- id: F03
  title: Geometria / topologia
  question: Como métrica, incidência, curvatura, projeção e topologia mudam ou preservam o objeto?
  focus: [local/global, intrínseca/extrínseca, plano/esfera/toro, corda/geodésica, interior/fronteira, incidência/grau, curvatura/defeito, dualidade, simetria, embedding/projeção, refinamento/escala, topologia vs métrica]
- id: F04
  title: Aritmética / modular / discreta
  question: Que parte da estrutura vem de representação numérica, módulo, base, recorrência ou fatoração?
  focus: [inteiro/racional, não reduzido/primitivo, módulo/dobra, primos/resíduos, CRT, período/ciclo, base/representação, recorrência, Fibonacci/Rafaeliana, grafo/circulante, 7/42/420 namespaces, finito/assintótico]
- id: F05
  title: Dinâmica / tempo / controle
  question: Que propriedades pertencem à evolução, memória, estabilidade, causalidade ou controle?
  focus: [estado/update, recorrência, memória/ledger, estabilidade, atrator, transiente, periodicidade, perturbação, feedback/controle, inversa vs mecanismo, multiescala temporal, tempo/unidades físicas]
- id: F06
  title: Empírico / estatístico / falsificação
  question: Que evidência, nulo, erro e teste poderiam sustentar ou derrubar a afirmação?
  focus: [fonte/dado real, baseline/nulo, unidades/calibração, erro/incerteza, covariância, testes múltiplos, permutação, ablação, validação externa, reprodução independente, contraexemplo/falsificador, prior art]
- id: F07
  title: Semântico / polimático / transdisciplinar
  question: Que parte da conexão é semântica, analógica, ontológica ou realmente estrutural entre domínios?
  focus: [namespace, colisão de símbolos, analogia vs equivalência, cross-domain map, ontologia, contextualização global, eco/ciclo semântico, anomalia, paradoxo, utopia, ruído/falso positivo, transformer-of-transformers]
- id: F08
  title: Governança / proveniência / meta-método
  question: O método, a evidência e os gates resistem a uma auditoria adversarial do próprio processo?
  focus: [claim boundary, source→artifact chain, hash/receipt, CI/runtime/evidência, fail-closed, rollback/append-only, autocrítica, anti-gaming, blind spots, lente oposta, promoção/rebaixamento, F_gap/F_next]
