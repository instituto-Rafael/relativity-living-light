method_self_critique:
  state: TOKEN_VAZIO_METHOD_VALIDATION
  questions:
  - Why exactly eight macro-families; what evidence would require a ninth?
  - Do two macro-families encode the same audit under different names?
  - Does applying the same 12 directions to all families create false symmetry?
  - Are A-E labels stable across historical variants or merely one canonicalization?
  - Do 120 A-E permutations produce distinct information or mostly duplicate outcomes?
  - Are the 34D axis slots source-bound, or are names being hallucinated?
  - Does Relation Calculus overcount relations that are algebraically dependent?
  - Does the method prioritize counterexamples as strongly as expansions?
  - Can a larger matrix create a false sense of completeness?
  - Which cells are materially NOT_APPLICABLE and why?
  - Can a compact covering design replace exhaustive Cartesian cross without losing a falsifier?
  - What observation would falsify the claim that this methodology is more complete than NIBIGUIRI-12?
  anti_gaming: [matrix_size_is_not_quality, candidate_count_is_not_quality, no_auto_promotion, no_hash_as_proof, no_CI_as_theorem, no_same_number_semantic_merge, no_unnamed_34D_axis_claim, NOT_APPLICABLE_requires_reason, negative_results_append_only]
